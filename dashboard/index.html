<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .header {
            background: var(--header-bg);
            box-shadow: 0 2px 0 #000000;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #000000;
            transition: all 0.5s ease;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            padding: 2px;
            border: 1px solid #000000;
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .header-logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            transition: color 0.5s ease;
        }

        .header-currency {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: 2px 2px 0 #000000;
            transition: all 0.3s ease;
        }

        .currency-badge i {
            font-size: 12px;
        }

        .currency-badge.coins i {
            color: #f59e0b;
        }

        .currency-badge.diamonds i {
            color: #06b6d4;
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 80px;
        }

        .loader-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #000000;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dashboard-content {
            display: none;
        }

        .dashboard-content.show {
            display: block;
        }

        .game-modes-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.5s ease;
        }

        .section-title i {
            color: var(--primary);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .game-modes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .game-mode-card {
            background: var(--card-bg);
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: fadeInUp 0.5s ease backwards;
        }

        .game-mode-card:nth-child(1) { animation-delay: 0.1s; }
        .game-mode-card:nth-child(2) { animation-delay: 0.15s; }
        .game-mode-card:nth-child(3) { animation-delay: 0.2s; }
        .game-mode-card:nth-child(4) { animation-delay: 0.25s; }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .game-mode-card:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 0 #000000;
        }

        .game-mode-card:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000000;
        }

        .game-mode-icon {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .game-mode-card:hover .game-mode-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .game-mode-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .game-mode-desc {
            font-size: 9px;
            color: var(--text-light);
        }

        .games-section {
            margin-bottom: 20px;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border: 1px solid #000000;
            border-radius: 4px;
            background: var(--card-bg);
            box-shadow: 2px 2px 0 #000000;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-item:hover {
            transform: translateX(-3px);
            box-shadow: 3px 3px 0 #000000;
        }

        .game-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-item-icon {
            font-size: 16px;
            color: var(--primary);
            width: 24px;
            text-align: center;
        }

        .game-item-info {
            min-width: 0;
        }

        .game-item-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-item-subtitle {
            font-size: 9px;
            color: var(--text-light);
        }

        .game-item-status {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #000000;
            flex-shrink: 0;
        }

        .game-item-status.in_progress {
            background: #f59e0b;
            color: #ffffff;
        }

        .game-item-status.finished {
            background: #10b981;
            color: #ffffff;
        }

        .game-item-status.win {
            background: #10b981;
            color: #ffffff;
        }

        .game-item-status.loss {
            background: #ef4444;
            color: #ffffff;
        }

        .game-item-status.draw {
            background: #f59e0b;
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 11px;
            background: var(--card-bg);
            border: 1px solid #000000;
            border-radius: 4px;
        }

        .empty-state i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-light);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            animation: navBounce 0.5s ease;
        }

        @keyframes navBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .nav-item:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/r102593_InShot_20260817_115945628.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">Quizico</div>
                    <div class="header-subtitle">صفحه اصلی</div>
                </div>
            </div>
            <div class="header-currency">
                <span class="currency-badge coins">
                    <i class="fa-solid fa-coins"></i>
                    <span id="coinsHeader">0</span>
                </span>
                <span class="currency-badge diamonds">
                    <i class="fa-solid fa-gem"></i>
                    <span id="diamondsHeader">0</span>
                </span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
        </div>

        <div class="dashboard-content" id="dashboardContent">
            <div class="game-modes-section">
                <div class="section-title">
                    <i class="fa-solid fa-gamepad"></i>
                    شروع مسابقه
                </div>
                <div class="game-modes-grid">
                    <div class="game-mode-card" onclick="startGame('single')">
                        <div class="game-mode-icon"><i class="fa-solid fa-user"></i></div>
                        <div class="game-mode-name">تک نفره</div>
                        <div class="game-mode-desc">بازی با ربات</div>
                    </div>
                    <div class="game-mode-card" onclick="startGame('offline')">
                        <div class="game-mode-icon"><i class="fa-solid fa-users"></i></div>
                        <div class="game-mode-name">دو نفره (آفلاین)</div>
                        <div class="game-mode-desc">دو نفر با یک گوشی</div>
                    </div>
                    <div class="game-mode-card" onclick="startGame('online')">
                        <div class="game-mode-icon"><i class="fa-solid fa-globe"></i></div>
                        <div class="game-mode-name">دو نفره (آنلاین)</div>
                        <div class="game-mode-desc">بازی با کاربر دیگر</div>
                    </div>
                    <div class="game-mode-card" onclick="startGame('league')">
                        <div class="game-mode-icon"><i class="fa-solid fa-trophy"></i></div>
                        <div class="game-mode-name">لیگ</div>
                        <div class="game-mode-desc">رقابت در لیگ</div>
                    </div>
                </div>
            </div>

            <div class="games-section">
                <div class="section-title">
                    <i class="fa-solid fa-hourglass-half"></i>
                    مسابقات در حال برگزاری
                </div>
                <div class="games-list" id="inProgressGames"></div>
            </div>

            <div class="games-section">
                <div class="section-title">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    مسابقات گذشته
                </div>
                <div class="games-list" id="finishedGames"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item active" onclick="savePage('dashboard')">
            <i class="fa-solid fa-house"></i>
            <span>صفحه اصلی</span>
        </a>
        <a href="../ranking/" class="nav-item" onclick="savePage('ranking')">
            <i class="fa-solid fa-trophy"></i>
            <span>رتبه بندی</span>
        </a>
        <a href="../profile/" class="nav-item" onclick="savePage('profile')">
            <i class="fa-solid fa-user"></i>
            <span>پروفایل من</span>
        </a>
        <a href="../setting/" class="nav-item" onclick="savePage('setting')">
            <i class="fa-solid fa-gear"></i>
            <span>تنظیمات</span>
        </a>
    </nav>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            const API_URL = 'https://script.google.com/macros/s/AKfycbx34bNcwqg5JHqOI6DFbV41d-w0yjdS76kuemQYZcCpuNQqFoMWM7ipFF7zxJFG0EW6-w/exec';
            
            function savePage(page) {
                localStorage.setItem('lastPage', page);
            }

            function getSettings() {
                return JSON.parse(localStorage.getItem('quizicoSettings') || '{}');
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                const rgb = hexToRgb(color);
                const r = Math.max(0, Math.min(255, rgb.r + percent));
                const g = Math.max(0, Math.min(255, rgb.g + percent));
                const b = Math.max(0, Math.min(255, rgb.b + percent));
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
            }

            function applyTheme() {
                const mode = localStorage.getItem('themeMode') || 'light';
                const theme = mode;
                const settings = getSettings();
                const primaryColor = settings.primaryColor || '#a855f7';
                
                document.documentElement.setAttribute('data-theme', theme);
                
                if (theme === 'dark') {
                    const darkPrimary = shadeColor(primaryColor, 40);
                    
                    document.documentElement.style.setProperty('--bg', '#1e1b2e');
                    document.documentElement.style.setProperty('--bg2', '#2d2a3e');
                    document.documentElement.style.setProperty('--bg3', '#3d3a4e');
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-dark', primaryColor);
                    document.documentElement.style.setProperty('--primary-light', shadeColor(primaryColor, 60));
                    document.documentElement.style.setProperty('--primary-rgb', `${hexToRgb(darkPrimary).r}, ${hexToRgb(darkPrimary).g}, ${hexToRgb(darkPrimary).b}`);
                    document.documentElement.style.setProperty('--dark', '#f1f5f9');
                    document.documentElement.style.setProperty('--text', '#cbd5e1');
                    document.documentElement.style.setProperty('--text-light', '#94a3b8');
                    document.documentElement.style.setProperty('--card-bg', '#2d2a3e');
                    document.documentElement.style.setProperty('--header-bg', '#2d2a3e');
                } else {
                    const rgb = hexToRgb(primaryColor);
                    
                    document.documentElement.style.setProperty('--bg', '#faf5ff');
                    document.documentElement.style.setProperty('--bg2', '#f3e8ff');
                    document.documentElement.style.setProperty('--bg3', '#e9d5ff');
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-dark', shadeColor(primaryColor, -30));
                    document.documentElement.style.setProperty('--primary-light', shadeColor(primaryColor, 30));
                    document.documentElement.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                    document.documentElement.style.setProperty('--dark', '#1e1b2e');
                    document.documentElement.style.setProperty('--text', '#4a4458');
                    document.documentElement.style.setProperty('--text-light', '#6b7280');
                    document.documentElement.style.setProperty('--card-bg', '#ffffff');
                    document.documentElement.style.setProperty('--header-bg', '#ffffff');
                }
                
                if (webApp) {
                    webApp.setHeaderColor('bg_color');
                    webApp.setBackgroundColor('bg_color');
                }
            }

            function applySettings() {
                const settings = getSettings();
                
                if (settings.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                }
                
                applyTheme();
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            async function fetchData(action, params = {}) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: '77781793:?4r]T}h-UXSic6Q-uBG@ZJg-WE*GqQL-8OZOSzR-~ehNGgr-6l7Hn6L-{yNSFm0-lbohCpI-soEMY(7-)v~$I22-JCNAVXj-,^x05PQ-&tQ5FQD-5ZXU5fK-iN4{fkz-FYIkfj5-sZ9bizd-sqfOUbw-CJindBM-FvlZYt1-pETvfRr-Vm)aHlo-OyptiU%',
                            action: action,
                            ...params
                        })
                    });
                    return await response.json();
                } catch(e) {
                    return { success: false, message: 'Network error' };
                }
            }

            async function ensureUserExists() {
                const user = getEitaaUser();
                if (!user) return null;
                
                const username = String(user.id);
                
                try {
                    let userData = await fetchData('getUser', { username: username });
                    
                    if (!userData.success) {
                        const createResult = await fetchData('createUser', {
                            user: {
                                username: username,
                                name: (user.first_name || '') + ' ' + (user.last_name || ''),
                                score: 0,
                                coins: 0,
                                diamonds: 0,
                                stats: '',
                                status: 'active'
                            }
                        });
                        
                        if (!createResult.success) {
                            console.error('Failed to create user:', createResult);
                            return null;
                        }
                        
                        userData = await fetchData('getUser', { username: username });
                    }
                    
                    return userData;
                } catch(e) {
                    console.error('Error during user check:', e);
                    return null;
                }
            }

            function startGame(mode) {
                if (webApp) {
                    webApp.HapticFeedback?.impactOccurred('light');
                }
                
                localStorage.setItem('gameMode', mode);
                
                switch(mode) {
                    case 'single':
                    case 'offline':
                    case 'online':
                        window.location.href = '../game/';
                        break;
                    case 'league':
                        window.location.href = '../league/';
                        break;
                }
            }

            function continueGame(id) {
                localStorage.setItem('continueGameId', id);
                window.location.href = '../game/';
            }

            async function loadDashboard() {
                const userData = await ensureUserExists();
                
                if (userData && userData.success) {
                    document.getElementById('coinsHeader').textContent = userData.data.coins || 0;
                    document.getElementById('diamondsHeader').textContent = userData.data.diamonds || 0;
                }
                
                const user = getEitaaUser();
                const username = String(user ? user.id : '');
                
                const gamesData = await fetchData('getGamesByPlayer', { username: username });
                
                if (gamesData.success) {
                    const games = gamesData.data;
                    const inProgress = games.filter(g => g.status === 'in_progress');
                    const finished = games.filter(g => g.status === 'finished');
                    
                    const inProgressList = document.getElementById('inProgressGames');
                    const finishedList = document.getElementById('finishedGames');
                    
                    if (inProgress.length === 0) {
                        inProgressList.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-hourglass-half"></i>
                                <p>مسابقه در حال برگزاری نیست</p>
                            </div>
                        `;
                    } else {
                        inProgressList.innerHTML = inProgress.slice(0, 5).map(game => {
                            const isPlayer1 = game.player1 === username;
                            const opponent = isPlayer1 ? game.player2 : game.player1;
                            
                            return `
                                <div class="game-item" onclick="continueGame('${game.id}')">
                                    <div class="game-item-left">
                                        <div class="game-item-icon"><i class="fa-solid fa-gamepad"></i></div>
                                        <div class="game-item-info">
                                            <div class="game-item-title">${opponent || 'ناشناس'}</div>
                                            <div class="game-item-subtitle">مسابقه نیمه‌تمام</div>
                                        </div>
                                    </div>
                                    <span class="game-item-status in_progress">ادامه</span>
                                </div>
                            `;
                        }).join('');
                    }
                    
                    if (finished.length === 0) {
                        finishedList.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                                <p>مسابقه‌ای یافت نشد</p>
                            </div>
                        `;
                    } else {
                        finishedList.innerHTML = finished.slice(0, 10).map(game => {
                            const isPlayer1 = game.player1 === username;
                            const opponent = isPlayer1 ? game.player2 : game.player1;
                            
                            let result = 'draw';
                            let resultText = 'مساوی';
                            let resultClass = 'draw';
                            
                            if (isPlayer1) {
                                if (game.player1Score > game.player2Score) {
                                    result = 'win';
                                    resultText = 'برد';
                                    resultClass = 'win';
                                } else if (game.player1Score < game.player2Score) {
                                    result = 'loss';
                                    resultText = 'باخت';
                                    resultClass = 'loss';
                                }
                            } else {
                                if (game.player2Score > game.player1Score) {
                                    result = 'win';
                                    resultText = 'برد';
                                    resultClass = 'win';
                                } else if (game.player2Score < game.player1Score) {
                                    result = 'loss';
                                    resultText = 'باخت';
                                    resultClass = 'loss';
                                }
                            }
                            
                            return `
                                <div class="game-item">
                                    <div class="game-item-left">
                                        <div class="game-item-icon"><i class="fa-solid fa-flag-checkered"></i></div>
                                        <div class="game-item-info">
                                            <div class="game-item-title">${opponent || 'ناشناس'}</div>
                                            <div class="game-item-subtitle">مسابقه گذشته</div>
                                        </div>
                                    </div>
                                    <span class="game-item-status ${resultClass}">${resultText}</span>
                                </div>
                            `;
                        }).join('');
                    }
                }
                
                document.getElementById('loaderWrapper').style.display = 'none';
                document.getElementById('dashboardContent').classList.add('show');
            }

            window.startGame = startGame;
            window.continueGame = continueGame;

            if (webApp) {
                webApp.ready();
            }

            applySettings();
            loadDashboard();
        })();
    </script>
</body>
</html>
