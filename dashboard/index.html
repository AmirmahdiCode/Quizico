<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.1);
        }

        .header-title { font-size: 16px; font-weight: 800; }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .header-currency {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: var(--border);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .currency-badge.coins i { color: #f59e0b; }
        .currency-badge.diamonds i { color: #06b6d4; }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 12px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text { font-size: 12px; font-weight: 700; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .dashboard-content { display: none; }
        .dashboard-content.show { display: flex; flex-direction: column; gap: 12px; }

        .banner-row {
            display: flex;
            gap: 12px;
        }

        .banner-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            min-height: 140px;
            flex: 6;
        }

        .banner-card .banner-image {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 90%;
            height: 120%;
            pointer-events: none;
        }

        .banner-card .banner-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: left bottom;
        }

        .banner-card .banner-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .wheel-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            min-height: 140px;
            flex: 4;
        }

        .wheel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .wheel-card .wheel-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            left: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            text-align: center;
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i { color: var(--primary); }

        .game-modes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .game-mode-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow);
            position: relative;
        }

        .game-mode-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .game-mode-card .game-mode-label {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 4px;
            text-align: center;
        }

        .games-section {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .games-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .games-section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .games-section-title i { color: var(--primary); }

        .games-section-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg2);
            border: var(--border);
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .game-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-card:hover { transform: translateX(-3px); }

        .game-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            border: var(--border);
        }

        .game-info { flex: 1; min-width: 0; }

        .game-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-subtitle {
            font-size: 8px;
            color: var(--text-light);
        }

        .game-status-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 10px;
            border: var(--border);
            flex-shrink: 0;
        }

        .game-status-badge.waiting { background: #fef3c7; color: #d97706; }
        .game-status-badge.live { background: #dbeafe; color: #2563eb; animation: pulse 2s infinite; }
        .game-status-badge.finished { background: #d1fae5; color: #059669; }
        .game-status-badge.win { background: #d1fae5; color: #059669; }
        .game-status-badge.loss { background: #fee2e2; color: #dc2626; }
        .game-status-badge.draw { background: #fef3c7; color: #d97706; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .empty-state {
            text-align: center;
            padding: 16px;
            color: var(--text-light);
            font-size: 10px;
        }

        .empty-state img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin: 0 auto 6px;
            display: block;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            padding: 4px 12px;
            font-family: inherit;
            background: none;
            border: none;
        }

        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        .wheel-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .wheel-modal-overlay.show { display: flex; }
        .wheel-modal {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 5px 5px 0 #000;
            max-width: 380px;
            width: 90%;
            position: relative;
        }
        .wheel-modal-close {
            position: absolute; top: 10px; left: 10px;
            width: 28px; height: 28px;
            border: var(--border); border-radius: 50%;
            background: var(--bg2); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .wheel-modal-title { text-align: center; font-size: 15px; font-weight: 800; margin-bottom: 14px; }
        .wheel-container { position: relative; width: 260px; height: 260px; margin: 0 auto 14px; }
        .wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #000; transition: transform 4s cubic-bezier(0.17,0.67,0.12,0.99); }
        .wheel-pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #f59e0b; z-index: 5; }
        .wheel-center-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: var(--primary); border: 3px solid #000;
            color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; z-index: 5;
        }
        .wheel-cost-info { text-align: center; font-size: 10px; font-weight: 700; }
        .wheel-result { text-align: center; font-size: 13px; font-weight: 800; color: var(--primary); min-height: 25px; margin-top: 8px; }

        @media (max-width: 480px) {
            .game-modes-grid { grid-template-columns: repeat(2, 1fr); }
            .header-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle">اطلاعات خودت رو محک بزن</div>
                </div>
            </div>
            <div class="header-currency">
                <span class="currency-badge coins"><i class="fa-solid fa-coins"></i> <span id="coinsHeader">-</span></span>
                <span class="currency-badge diamonds"><i class="fa-solid fa-gem"></i> <span id="diamondsHeader">-</span></span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">در حال دریافت...</div>
        </div>

        <div class="dashboard-content" id="dashboardContent">

            <div class="banner-row">
                <div class="banner-card" onclick="goToPlay('challenge')">
                    <div class="banner-image"><img src="https://cdn.imgurl.ir/uploads/h142945_InShot_20260821_184807337.png" alt=""></div>
                    <div class="banner-label"><i class="fa-solid fa-trophy"></i> مسابقه روزانه</div>
                </div>
                <div class="wheel-card" onclick="openWheelModal()">
                    <img src="https://cdn.imgurl.ir/uploads/m526299_InShot_20260821_182752507.png" alt="">
                    <div class="wheel-label"><i class="fa-solid fa-wand-magic-sparkles"></i> گردونه</div>
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-gamepad"></i> شروع مسابقه</div>

            <div class="game-modes-grid">
                <div class="game-mode-card" onclick="goToPlay('single')"><img src="https://cdn.imgurl.ir/uploads/f711120_InShot_20260821_200930706.jpg" alt=""><div class="game-mode-label">تک‌نفره</div></div>
                <div class="game-mode-card" onclick="goToPlay('offline')"><img src="https://cdn.imgurl.ir/uploads/k5971_InShot_20260821_201008883.jpg" alt=""><div class="game-mode-label">دو نفره</div></div>
                <div class="game-mode-card" onclick="goToPlay('online')"><img src="https://cdn.imgurl.ir/uploads/h2464_InShot_20260821_201207943.jpg" alt=""><div class="game-mode-label">آنلاین</div></div>
                <div class="game-mode-card" onclick="goToPlay('league')"><img src="https://cdn.imgurl.ir/uploads/e135154_InShot_20260821_201323323.jpg" alt=""><div class="game-mode-label">لیگ</div></div>
            </div>

            <div class="games-section">
                <div class="games-section-header">
                    <span class="games-section-title"><i class="fa-solid fa-hourglass-half"></i> بازی‌های در حال برگزاری</span>
                    <span class="games-section-badge" id="inProgressCount">0</span>
                </div>
                <div class="games-list" id="inProgressList"></div>
            </div>

            <div class="games-section">
                <div class="games-section-header">
                    <span class="games-section-title"><i class="fa-solid fa-clock-rotate-left"></i> ۵ بازی گذشته</span>
                    <span class="games-section-badge" id="pastCount">0</span>
                </div>
                <div class="games-list" id="pastList"></div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item active"><i class="fa-solid fa-house"></i><span>خانه</span></a>
        <a href="../ranking/" class="nav-item"><i class="fa-solid fa-trophy"></i><span>رتبه</span></a>
        <a href="../profile/" class="nav-item"><i class="fa-solid fa-user"></i><span>پروفایل</span></a>
        <a href="../setting/" class="nav-item"><i class="fa-solid fa-gear"></i><span>تنظیمات</span></a>
    </nav>

    <div class="wheel-modal-overlay" id="wheelModalOverlay">
        <div class="wheel-modal">
            <div class="wheel-modal-close" onclick="closeWheelModal()"><i class="fa-solid fa-xmark"></i></div>
            <div class="wheel-modal-title"><i class="fa-solid fa-wand-magic-sparkles"></i> گردونه شانس</div>
            <div class="wheel-container">
                <div class="wheel-pointer"><i class="fa-solid fa-location-dot"></i></div>
                <canvas class="wheel-canvas" id="wheelCanvas" width="260" height="260"></canvas>
                <button class="wheel-center-btn" onclick="spinWheel()">چرخش</button>
            </div>
            <div class="wheel-cost-info"><i class="fa-solid fa-coins"></i> هزینه: ۵۰ سکه</div>
            <div class="wheel-result" id="wheelResult"></div>
        </div>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';

            var userCoins = 0, userDiamonds = 0;
            var currentRotation = 0, isSpinning = false;
            var SPIN_COST = 50;
            var wheelPrizes = [
                { label: 'پوچ', type: 'empty', value: 0 },
                { label: '۲۰ سکه', type: 'coins', value: 20 },
                { label: 'پوچ', type: 'empty', value: 0 },
                { label: '۱۰۰ سکه', type: 'coins', value: 100 },
                { label: '۱ الماس', type: 'diamonds', value: 1 },
                { label: '۲۰۰ سکه', type: 'coins', value: 200 },
                { label: '۵ الماس', type: 'diamonds', value: 5 },
                { label: '۱۰ الماس', type: 'diamonds', value: 10 }
            ];
            var wheelColors = ['#ef4444','#f59e0b','#10b981','#06b6d4','#8b5cf6','#ec4899','#84cc16','#f97316'];

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7' };
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    return parsed;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7' }; }
            }
            function hexToRgb(hex) {
                var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:168,g:85,b:247 };
            }
            function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1);}
            function applyTheme(){
                var s=getSettings();var t=s.theme||'light';var p=s.primaryColor||'#a855f7';
                document.documentElement.setAttribute('data-theme',t);
                if(t==='dark'){var dp=shadeColor(p,40);document.documentElement.style.setProperty('--primary',dp);}
                else{document.documentElement.style.setProperty('--primary',p);}
            }
            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }
            function shuffleArray(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
            function goToPlay(mode){localStorage.setItem('gameMode',mode);window.location.href='../play/'+mode+'/';}
            function continueGame(id){localStorage.setItem('onlineRoomCode',id);window.location.href='../play/online/';}
            window.goToPlay=goToPlay;window.continueGame=continueGame;

            function animateCount(el,target,dur){
                var start=0,st=null;
                function step(ts){if(!st)st=ts;var p=Math.min((ts-st)/dur,1);var e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*target);if(p<1)requestAnimationFrame(step);else el.textContent=target;}
                requestAnimationFrame(step);
            }

            function renderEmpty(text){
                return '<div class="empty-state"><img src="'+SAD_IMAGE+'" alt=""><p>'+text+'</p></div>';
            }

            function renderGameCard(g, myId, type) {
                var isP1 = String(g.player1) === String(myId);
                var icon = 'fa-gamepad';
                var statusClass = g.status || 'finished';
                var statusText = g.status === 'waiting' ? 'منتظر حریف' : g.status === 'in_progress' ? 'در جریان' : 'پایان';
                var title = g.id || 'بازی';
                var subtitle = isP1 ? 'تو بازیکن ۱ هستی' : 'تو بازیکن ۲ هستی';
                var onclick = "continueGame('" + g.id + "')";

                if (type === 'past') {
                    icon = 'fa-flag-checkered';
                    statusText = g.status === 'finished' ? 'پایان' : g.status;
                    onclick = '';
                }

                return '<div class="game-card"' + (onclick ? ' onclick="' + onclick + '"' : '') + '>' +
                    '<div class="game-icon"><i class="fa-solid ' + icon + '"></i></div>' +
                    '<div class="game-info"><div class="game-title">' + title + '</div>' +
                    '<div class="game-subtitle">' + subtitle + '</div></div>' +
                    '<span class="game-status-badge ' + statusClass + '">' + statusText + '</span></div>';
            }

            async function loadDashboard() {
                try {
                    var myId = getUserId();
                    if (!myId) {
                        document.getElementById('coinsHeader').textContent = '0';
                        document.getElementById('diamondsHeader').textContent = '0';
                        document.getElementById('loaderWrapper').style.display = 'none';
                        document.getElementById('dashboardContent').classList.add('show');
                        return;
                    }

                    var userData = await fetchData('getUser', {});
                    if (userData.ok && userData.data) {
                        userCoins = userData.data.coins || 0;
                        userDiamonds = userData.data.diamonds || 0;
                        animateCount(document.getElementById('coinsHeader'), userCoins, 800);
                        animateCount(document.getElementById('diamondsHeader'), userDiamonds, 800);
                    }

                    var gamesData = await fetchData('getGamesByPlayer', {});
                    if (gamesData.ok && Array.isArray(gamesData.data)) {
                        var allGames = gamesData.data;
                        var inProgress = allGames.filter(function(g) {
                            return g.status === 'waiting' || g.status === 'in_progress';
                        });
                        var past = allGames.filter(function(g) {
                            return g.status === 'finished' || g.status === 'completed';
                        }).slice(0, 5);

                        document.getElementById('inProgressCount').textContent = inProgress.length;
                        document.getElementById('pastCount').textContent = past.length;

                        var ipList = document.getElementById('inProgressList');
                        if (inProgress.length === 0) {
                            ipList.innerHTML = renderEmpty('بازی در جریانی نیست');
                        } else {
                            ipList.innerHTML = inProgress.map(function(g) {
                                return renderGameCard(g, myId, 'inprogress');
                            }).join('');
                        }

                        var pastList = document.getElementById('pastList');
                        if (past.length === 0) {
                            pastList.innerHTML = renderEmpty('بازی گذشته‌ای نیست');
                        } else {
                            pastList.innerHTML = past.map(function(g) {
                                return renderGameCard(g, myId, 'past');
                            }).join('');
                        }
                    }

                } catch(e) {
                    console.error(e);
                } finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('dashboardContent').classList.add('show');
                }
            }

            function drawWheel() {
                var canvas = document.getElementById('wheelCanvas');
                if (!canvas) return;
                var ctx = canvas.getContext('2d');
                var cx = canvas.width/2, cy = canvas.height/2;
                var radius = canvas.width/2 - 10;
                var seg = (2*Math.PI)/wheelPrizes.length;
                ctx.clearRect(0,0,canvas.width,canvas.height);
                for (var i = 0; i < wheelPrizes.length; i++) {
                    var sa = i*seg, ea = sa+seg;
                    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,sa,ea);ctx.closePath();
                    ctx.fillStyle = wheelColors[i];ctx.fill();
                    ctx.strokeStyle = '#000';ctx.lineWidth = 2;ctx.stroke();
                    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+seg/2);
                    ctx.fillStyle = '#fff';ctx.font = 'bold 11px IRANSans';ctx.textAlign = 'center';
                    ctx.fillText(wheelPrizes[i].label, radius-35, 0);ctx.restore();
                }
            }

            function openWheelModal() {
                shuffleArray(wheelPrizes);
                drawWheel();
                document.getElementById('wheelResult').textContent = '';
                document.getElementById('wheelModalOverlay').classList.add('show');
            }
            function closeWheelModal() {
                if (!isSpinning) document.getElementById('wheelModalOverlay').classList.remove('show');
            }
            window.openWheelModal = openWheelModal;
            window.closeWheelModal = closeWheelModal;

            function spinWheel() {
                if (isSpinning) return;
                if (userCoins < SPIN_COST) { document.getElementById('wheelResult').textContent = 'سکه کافی نداری!'; return; }
                isSpinning = true;
                document.getElementById('wheelResult').textContent = '';
                var seg = 360/wheelPrizes.length;
                var ri = Math.floor(Math.random()*wheelPrizes.length);
                var target = -90 - (ri*seg + seg/2);
                var ca = currentRotation%360;
                var rot = 1800 + (target - ca);
                if (rot < 1800) rot += 360;
                var nr = currentRotation + rot;
                var canvas = document.getElementById('wheelCanvas');
                canvas.style.transform = 'rotate('+nr+'deg)';
                currentRotation = nr;
                setTimeout(function() {
                    var prize = wheelPrizes[ri];
                    if (prize.type === 'empty') { userCoins -= SPIN_COST; document.getElementById('wheelResult').textContent = 'پوچ!'; }
                    else if (prize.type === 'coins') { userCoins = userCoins - SPIN_COST + prize.value; document.getElementById('wheelResult').textContent = prize.label; }
                    else { userDiamonds += prize.value; userCoins -= SPIN_COST; document.getElementById('wheelResult').textContent = prize.label; }
                    document.getElementById('coinsHeader').textContent = userCoins;
                    document.getElementById('diamondsHeader').textContent = userDiamonds;
                    fetchData('updateUser', { coins: userCoins, diamonds: userDiamonds });
                    isSpinning = false;
                }, 4200);
            }
            window.spinWheel = spinWheel;

            if (webApp) { webApp.ready(); webApp.expand(); }
            applyTheme();
            loadDashboard();
        })();
    </script>
</body>
</html>
