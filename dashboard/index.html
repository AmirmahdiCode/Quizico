<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        [data-animation="off"] .header-title .t-letter {
            opacity: 1 !important;
            transform: translateY(0) !important;
            animation: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-title {
            display: flex;
            direction: ltr;
            gap: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
            font-family: 'IRANSans', Tahoma, sans-serif;
            align-self: flex-start;
        }

        .header-title .t-accent {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            align-self: flex-start;
        }

        .header-currency {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: var(--border);
            border-radius: var(--radius);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: var(--shadow);
        }

        .currency-badge.coins i { color: #f59e0b; }
        .currency-badge.diamonds i { color: #06b6d4; }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 16px;
        }

        .loader {
            width: 56px;
            height: 56px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            animation: pulse 1.5s ease infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .dashboard-content { display: none; animation: fadeInUp 0.5s ease; }
        .dashboard-content.show { display: block; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .banner-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .banner-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            min-height: 160px;
            flex: 6;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .banner-card .banner-image {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 90%;
            height: 120%;
            z-index: 1;
            pointer-events: none;
        }

        .banner-card .banner-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: left bottom;
        }

        .banner-card .banner-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 2;
        }

        .wheel-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            min-height: 160px;
            flex: 4;
        }

        .wheel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .wheel-card .wheel-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            left: 8px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            text-align: center;
            z-index: 2;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i { color: var(--primary); }

        .section-divider {
            border: none;
            border-top: 1px dashed var(--text-light);
            opacity: 0.3;
            margin: 4px 0 12px 0;
        }

        .game-modes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 4px;
        }

        .game-mode-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        .game-mode-card:hover {
            transform: translateY(-4px);
            box-shadow: 5px 5px 0 #000000;
        }

        .game-mode-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .game-mode-card .game-mode-label {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 6px 4px;
            text-align: center;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 10px 0 4px;
            margin-top: 16px;
            border-bottom: 1px dashed var(--text-light);
        }

        .section-toggle {
            color: var(--text-light);
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .section-toggle.open { transform: rotate(180deg); }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease, margin-top 0.4s ease;
        }

        .games-list.open {
            max-height: 500px;
            margin-top: 8px;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border: var(--border);
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .game-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-item-icon {
            font-size: 18px;
            color: var(--primary);
            width: 28px;
            text-align: center;
        }

        .game-item-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
        }

        .game-item-subtitle {
            font-size: 9px;
            color: var(--text-light);
        }

        .game-item-status {
            font-size: 9px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: var(--radius);
            border: var(--border);
        }

        .game-item-status.waiting { background: #fef3c7; color: #d97706; }
        .game-item-status.in_progress { background: #dbeafe; color: #2563eb; }
        .game-item-status.finished { background: #d1fae5; color: #059669; }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 11px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            padding: 4px 12px;
            border-radius: var(--radius);
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-2px); }

        .wheel-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wheel-modal-overlay.show { display: flex; }

        .wheel-modal {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 5px 5px 0 #000000;
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        .wheel-modal-close {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border: var(--border);
            border-radius: 50%;
            background: var(--bg2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-modal-title {
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 16px;
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #000;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: #f59e0b;
            z-index: 5;
        }

        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid #000;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            z-index: 5;
        }

        .wheel-cost-info {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .wheel-result {
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--primary);
            min-height: 30px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .game-modes-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .header-title { font-size: 15px; }
            .header-logo { width: 44px; height: 44px; }
            .wheel-container { width: 240px; height: 240px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div class="header-title-wrapper">
                    <div class="header-title"><span>Quiz<span class="t-accent">ico</span></span></div>
                    <div class="header-subtitle">اطلاعات خودت رو محک بزن</div>
                </div>
            </div>
            <div class="header-currency">
                <span class="currency-badge coins"><i class="fa-solid fa-coins"></i> <span id="coinsHeader">-</span></span>
                <span class="currency-badge diamonds"><i class="fa-solid fa-gem"></i> <span id="diamondsHeader">-</span></span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">در حال دریافت اطلاعات...</div>
        </div>

        <div class="dashboard-content" id="dashboardContent">

            <div class="banner-row">
                <div class="banner-card" onclick="goToPlay('challenge')">
                    <div class="banner-image">
                        <img src="https://cdn.imgurl.ir/uploads/h142945_InShot_20260821_184807337.png" alt="مسابقه روزانه">
                    </div>
                    <div class="banner-label"><i class="fa-solid fa-trophy"></i> مسابقه روزانه</div>
                </div>
                <div class="wheel-card" onclick="openWheelModal()">
                    <img src="https://cdn.imgurl.ir/uploads/m526299_InShot_20260821_182752507.png" alt="گردونه شانس">
                    <div class="wheel-label"><i class="fa-solid fa-wand-magic-sparkles"></i> گردونه شانس</div>
                </div>
            </div>

            <div class="section-title">
                <i class="fa-solid fa-gamepad"></i> شروع مسابقه
            </div>
            <hr class="section-divider">

            <div class="game-modes-grid">
                <div class="game-mode-card" onclick="goToPlay('single')">
                    <img src="https://cdn.imgurl.ir/uploads/f711120_InShot_20260821_200930706.jpg" alt="تک‌نفره">
                    <div class="game-mode-label">تک‌نفره</div>
                </div>
                <div class="game-mode-card" onclick="goToPlay('offline')">
                    <img src="https://cdn.imgurl.ir/uploads/k5971_InShot_20260821_201008883.jpg" alt="دو نفره آفلاین">
                    <div class="game-mode-label">دو نفره آفلاین</div>
                </div>
                <div class="game-mode-card" onclick="goToPlay('online')">
                    <img src="https://cdn.imgurl.ir/uploads/h2464_InShot_20260821_201207943.jpg" alt="دو نفره آنلاین">
                    <div class="game-mode-label">دو نفره آنلاین</div>
                </div>
                <div class="game-mode-card" onclick="goToPlay('league')">
                    <img src="https://cdn.imgurl.ir/uploads/e135154_InShot_20260821_201323323.jpg" alt="لیگ">
                    <div class="game-mode-label">لیگ</div>
                </div>
            </div>

            <div class="section-header" onclick="toggleSection('onlineSection')">
                <div class="section-title">
                    <i class="fa-solid fa-globe"></i> بازی‌های آنلاین در حال برگزاری
                </div>
                <i class="fa-solid fa-chevron-down section-toggle" id="onlineToggle"></i>
            </div>
            <div class="games-list" id="onlineSection">
                <div id="onlineGames"></div>
            </div>

            <div class="section-header" onclick="toggleSection('inProgressSection')">
                <div class="section-title">
                    <i class="fa-solid fa-hourglass-half"></i> سایر بازی‌ها
                </div>
                <i class="fa-solid fa-chevron-down section-toggle" id="inProgressToggle"></i>
            </div>
            <div class="games-list" id="inProgressSection">
                <div id="inProgressGames"></div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item active"><i class="fa-solid fa-house"></i><span>خانه</span></a>
        <a href="../ranking/" class="nav-item"><i class="fa-solid fa-trophy"></i><span>رتبه</span></a>
        <a href="../profile/" class="nav-item"><i class="fa-solid fa-user"></i><span>پروفایل</span></a>
        <a href="../setting/" class="nav-item"><i class="fa-solid fa-gear"></i><span>تنظیمات</span></a>
    </nav>

    <div class="wheel-modal-overlay" id="wheelModalOverlay">
        <div class="wheel-modal">
            <div class="wheel-modal-close" onclick="closeWheelModal()"><i class="fa-solid fa-xmark"></i></div>
            <div class="wheel-modal-title"><i class="fa-solid fa-wand-magic-sparkles"></i> گردونه شانس</div>
            <div class="wheel-container">
                <div class="wheel-pointer"><i class="fa-solid fa-location-dot"></i></div>
                <canvas class="wheel-canvas" id="wheelCanvas" width="280" height="280"></canvas>
                <button class="wheel-center-btn" id="spinBtn" onclick="spinWheel()">چرخش</button>
            </div>
            <div class="wheel-cost-info"><i class="fa-solid fa-coins"></i> هزینه هر چرخش: ۵۰ سکه</div>
            <div class="wheel-result" id="wheelResult"></div>
        </div>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';

            var wheelPrizes = [
                { label: 'پوچ', type: 'empty', value: 0 },
                { label: '۲۰ سکه', type: 'coins', value: 20 },
                { label: 'پوچ', type: 'empty', value: 0 },
                { label: '۱۰۰ سکه', type: 'coins', value: 100 },
                { label: '۱ الماس', type: 'diamonds', value: 1 },
                { label: '۲۰۰ سکه', type: 'coins', value: 200 },
                { label: '۵ الماس', type: 'diamonds', value: 5 },
                { label: '۱۰ الماس', type: 'diamonds', value: 10 }
            ];
            var wheelColors = ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899', '#84cc16', '#f97316'];
            var currentRotation = 0;
            var isSpinning = false;
            var userCoins = 0;
            var userDiamonds = 0;
            var SPIN_COST = 50;

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true };
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    if (parsed.animation === undefined) parsed.animation = true;
                    return parsed;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7', animation: true }; }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(darkPrimary).r + ', ' + hexToRgb(darkPrimary).g + ', ' + hexToRgb(darkPrimary).b);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(primaryColor).r + ', ' + hexToRgb(primaryColor).g + ', ' + hexToRgb(primaryColor).b);
                }
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            function fetchData(action, params) {
                var payload = { action: action, username: getUserId() };
                if (params) {
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) payload[key] = params[key];
                    }
                }
                return fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json(); }).catch(function() { return { ok: false }; });
            }

            function goToPlay(mode) {
                if (webApp) webApp.HapticFeedback?.impactOccurred('light');
                localStorage.setItem('gameMode', mode);
                window.location.href = '../play/' + mode + '/';
            }

            function continueOnlineGame(gameId) {
                if (webApp) webApp.HapticFeedback?.impactOccurred('light');
                localStorage.setItem('onlineRoomCode', gameId);
                window.location.href = '../play/online/';
            }

            window.goToPlay = goToPlay;
            window.continueOnlineGame = continueOnlineGame;

            function toggleSection(sectionId) {
                var section = document.getElementById(sectionId);
                var toggle = document.getElementById(sectionId === 'onlineSection' ? 'onlineToggle' : 'inProgressToggle');
                if (section.classList.contains('open')) {
                    section.classList.remove('open');
                    toggle.classList.remove('open');
                } else {
                    section.classList.add('open');
                    toggle.classList.add('open');
                }
            }

            window.toggleSection = toggleSection;

            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            function drawWheel() {
                var canvas = document.getElementById('wheelCanvas');
                var ctx = canvas.getContext('2d');
                var cx = canvas.width / 2, cy = canvas.height / 2;
                var radius = canvas.width / 2 - 10;
                var segmentAngle = (2 * Math.PI) / wheelPrizes.length;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < wheelPrizes.length; i++) {
                    var sa = i * segmentAngle, ea = sa + segmentAngle;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, sa, ea);
                    ctx.closePath();
                    ctx.fillStyle = wheelColors[i % wheelColors.length];
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(sa + segmentAngle / 2);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 13px IRANSans';
                    ctx.fillText(wheelPrizes[i].label, radius - 40, 0);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.stroke();
            }

            function openWheelModal() {
                shuffleArray(wheelPrizes);
                drawWheel();
                document.getElementById('wheelResult').textContent = '';
                document.getElementById('wheelModalOverlay').classList.add('show');
            }

            function closeWheelModal() {
                if (isSpinning) return;
                document.getElementById('wheelModalOverlay').classList.remove('show');
            }

            window.openWheelModal = openWheelModal;
            window.closeWheelModal = closeWheelModal;

            function spinWheel() {
                if (isSpinning) return;
                if (userCoins < SPIN_COST) {
                    document.getElementById('wheelResult').textContent = 'سکه کافی نداری!';
                    return;
                }
                isSpinning = true;
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('wheelResult').textContent = '';

                var segmentAngle = 360 / wheelPrizes.length;
                var randomIndex = Math.floor(Math.random() * wheelPrizes.length);
                var pointerAngle = -90;
                var segmentCenterAngle = randomIndex * segmentAngle + segmentAngle / 2;
                var targetAngle = pointerAngle - segmentCenterAngle;
                var currentAngle = currentRotation % 360;
                var spins = 5;
                var totalRotation = spins * 360 + (targetAngle - currentAngle);
                if (totalRotation < spins * 360) totalRotation += 360;
                var newRotation = currentRotation + totalRotation;
                var canvas = document.getElementById('wheelCanvas');
                canvas.style.transform = 'rotate(' + newRotation + 'deg)';
                currentRotation = newRotation;

                setTimeout(function() {
                    var prize = wheelPrizes[randomIndex];
                    if (prize.type === 'empty') {
                        document.getElementById('wheelResult').textContent = 'پوچ!';
                        userCoins -= SPIN_COST;
                    } else if (prize.type === 'coins') {
                        userCoins = userCoins - SPIN_COST + prize.value;
                        document.getElementById('wheelResult').textContent = prize.label;
                    } else {
                        userDiamonds += prize.value;
                        userCoins -= SPIN_COST;
                        document.getElementById('wheelResult').textContent = prize.label;
                    }
                    document.getElementById('coinsHeader').textContent = userCoins;
                    document.getElementById('diamondsHeader').textContent = userDiamonds;
                    fetchData('updateUser', { coins: userCoins, diamonds: userDiamonds });
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                }, 4200);
            }

            window.spinWheel = spinWheel;

            function animateCount(element, target, duration) {
                var start = 0;
                var startTime = null;
                function step(timestamp) {
                    if (!startTime) startTime = timestamp;
                    var progress = Math.min((timestamp - startTime) / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 3);
                    element.textContent = Math.floor(eased * target);
                    if (progress < 1) requestAnimationFrame(step);
                    else element.textContent = target;
                }
                requestAnimationFrame(step);
            }

            function renderEmptyState(text) {
                return '<div class="empty-state"><img src="' + SAD_IMAGE + '" alt=""><p>' + text + '</p></div>';
            }

            async function loadDashboard() {
                try {
                    var eitaaUser = getEitaaUser();
                    var username = getUserId();
                    if (!eitaaUser || !username) {
                        document.getElementById('coinsHeader').textContent = '0';
                        document.getElementById('diamondsHeader').textContent = '0';
                        document.getElementById('loaderWrapper').style.display = 'none';
                        document.getElementById('dashboardContent').classList.add('show');
                        return;
                    }

                    var userData = await fetchData('getUser', {});
                    if (userData.ok && userData.data) {
                        userCoins = userData.data.coins || 0;
                        userDiamonds = userData.data.diamonds || 0;
                        animateCount(document.getElementById('coinsHeader'), userCoins, 1000);
                        animateCount(document.getElementById('diamondsHeader'), userDiamonds, 1000);
                    } else {
                        var fullName = (eitaaUser.first_name || '') + ' ' + (eitaaUser.last_name || '');
                        await fetchData('registerUser', { name: fullName.trim() || 'کاربر' });
                        document.getElementById('coinsHeader').textContent = '0';
                        document.getElementById('diamondsHeader').textContent = '0';
                    }

                    var gamesData = await fetchData('getGamesByPlayer', {});
                    if (gamesData.ok && Array.isArray(gamesData.data)) {
                        var games = gamesData.data;
                        var onlineGames = games.filter(function(g) {
                            return (g.status === 'waiting' || g.status === 'in_progress') && (g.player2 === 'bot' || g.player1 === 'bot' || g.player2 === 'player2' || g.player1 === 'player2');
                        });
                        var otherGames = games.filter(function(g) {
                            return g.status === 'in_progress' && onlineGames.indexOf(g) === -1;
                        });

                        var onlineList = document.getElementById('onlineGames');
                        if (onlineGames.length === 0) {
                            onlineList.innerHTML = renderEmptyState('بازی آنلاینی در جریان نیست');
                        } else {
                            onlineList.innerHTML = onlineGames.slice(0, 5).map(function(g) {
                                var isP1 = String(g.player1) === String(username);
                                var statusText = g.status === 'waiting' ? 'منتظر حریف' : 'در جریان';
                                var statusClass = g.status === 'waiting' ? 'waiting' : 'in_progress';
                                return '<div class="game-item" onclick="continueOnlineGame(\'' + g.id + '\')">' +
                                    '<div class="game-item-left">' +
                                    '<div class="game-item-icon"><i class="fa-solid fa-globe"></i></div>' +
                                    '<div><div class="game-item-title">' + g.id + '</div>' +
                                    '<div class="game-item-subtitle">' + (isP1 ? 'تو بازیکن ۱ هستی' : 'تو بازیکن ۲ هستی') + '</div></div></div>' +
                                    '<span class="game-item-status ' + statusClass + '">' + statusText + '</span></div>';
                            }).join('');
                        }

                        var ipList = document.getElementById('inProgressGames');
                        if (otherGames.length === 0) {
                            ipList.innerHTML = renderEmptyState('بازی دیگری نیست');
                        } else {
                            ipList.innerHTML = otherGames.slice(0, 5).map(function(g) {
                                return '<div class="game-item">' +
                                    '<div class="game-item-left">' +
                                    '<div class="game-item-icon"><i class="fa-solid fa-gamepad"></i></div>' +
                                    '<div><div class="game-item-title">' + (g.id || 'بازی') + '</div>' +
                                    '<div class="game-item-subtitle">در حال برگزاری</div></div></div>' +
                                    '<span class="game-item-status in_progress">ادامه</span></div>';
                            }).join('');
                        }
                    } else {
                        document.getElementById('onlineGames').innerHTML = renderEmptyState('بازی آنلاینی در جریان نیست');
                        document.getElementById('inProgressGames').innerHTML = renderEmptyState('بازی دیگری نیست');
                    }

                } catch(e) {
                    console.error('Error:', e);
                } finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('dashboardContent').classList.add('show');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.expand();
            }

            drawWheel();
            applyTheme();
            loadDashboard();
        })();
    </script>
</body>
</html>
