<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رتبه‌بندی | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img { width: 95%; height: 95%; object-fit: contain; transform: scale(1.1); }
        .header-title { font-size: 16px; font-weight: 800; color: var(--dark); }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 12px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { font-size: 12px; font-weight: 700; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ranking-content { display: none; }
        .ranking-content.show { display: flex; flex-direction: column; gap: 12px; }

        .search-box { position: relative; }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: var(--border);
            border-radius: var(--radius);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 11px;
            box-shadow: var(--shadow);
            outline: none;
        }

        .search-box i {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .my-rank-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .my-rank-left { display: flex; align-items: center; gap: 12px; }
        .my-rank-number { font-size: 22px; font-weight: 800; color: #fff; min-width: 40px; }
        .my-rank-info { color: #fff; }
        .my-rank-name { font-size: 13px; font-weight: 700; }
        .my-rank-score { font-size: 9px; opacity: 0.8; }
        .my-rank-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .rank-list { display: flex; flex-direction: column; gap: 6px; }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .rank-item:active { transform: translateX(-3px); }
        .rank-item.is-me { border-color: var(--primary); border-width: 2px; background: var(--bg2); }

        .rank-number {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-light);
            min-width: 30px;
            text-align: center;
        }
        .rank-number.gold { color: #f59e0b; font-size: 16px; }
        .rank-number.silver { color: #94a3b8; font-size: 16px; }
        .rank-number.bronze { color: #d97706; font-size: 16px; }

        .rank-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .rank-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .rank-info { flex: 1; min-width: 0; }
        .rank-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rank-score { font-size: 8px; color: var(--text-light); }

        .rank-badge-me {
            font-size: 7px;
            font-weight: 700;
            color: var(--primary);
            background: var(--bg2);
            padding: 2px 8px;
            border-radius: 10px;
            border: var(--border);
        }

        .rank-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 10px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .rank-empty img { width: 60px; height: 60px; object-fit: contain; margin: 0 auto 8px; display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0; right: 0; left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            padding: 4px 12px;
            font-family: inherit;
            background: none;
            border: none;
            font-size: 12px;
        }
        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle" data-i18n="ranking">رتبه‌بندی</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text" data-i18n="loading">در حال دریافت...</div>
        </div>

        <div class="ranking-content" id="rankingContent">

            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="جستجوی کاربر..." oninput="filterRankings()">
            </div>

            <div class="my-rank-card">
                <div class="my-rank-left">
                    <div class="my-rank-number" id="myRankNumber">-</div>
                    <div class="my-rank-info">
                        <div class="my-rank-name" id="myRankName">...</div>
                        <div class="my-rank-score" id="myRankScore"></div>
                    </div>
                </div>
                <div class="my-rank-badge" data-i18n="your_rank">رتبه شما</div>
            </div>

            <div class="rank-list" id="rankList"></div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="home">خانه</span></a>
        <a href="../ranking/" class="nav-item active"><i class="fa-solid fa-trophy"></i><span data-i18n="ranking_nav">رتبه</span></a>
        <a href="../profile/" class="nav-item"><i class="fa-solid fa-user"></i><span data-i18n="profile">پروفایل</span></a>
        <a href="../setting/" class="nav-item"><i class="fa-solid fa-gear"></i><span data-i18n="settings">تنظیمات</span></a>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';
            var allRankings = [];

            var translations = {
                fa: {
                    ranking: 'رتبه‌بندی',
                    loading: 'در حال دریافت...',
                    your_rank: 'رتبه شما',
                    home: 'خانه',
                    ranking_nav: 'رتبه',
                    profile: 'پروفایل',
                    settings: 'تنظیمات',
                    no_users: 'کاربری یافت نشد',
                    search_placeholder: 'جستجوی کاربر...',
                    score: 'امتیاز',
                    you: 'شما',
                    unknown: 'ناشناس'
                },
                en: {
                    ranking: 'Ranking',
                    loading: 'Loading...',
                    your_rank: 'Your Rank',
                    home: 'Home',
                    ranking_nav: 'Ranking',
                    profile: 'Profile',
                    settings: 'Settings',
                    no_users: 'No users found',
                    search_placeholder: 'Search users...',
                    score: 'Score',
                    you: 'You',
                    unknown: 'Unknown'
                },
                ar: {
                    ranking: 'الترتيب',
                    loading: 'جار التحميل...',
                    your_rank: 'رتبتك',
                    home: 'الرئيسية',
                    ranking_nav: 'الترتيب',
                    profile: 'الملف',
                    settings: 'الإعدادات',
                    no_users: 'لا يوجد مستخدمين',
                    search_placeholder: 'ابحث عن مستخدم...',
                    score: 'النقاط',
                    you: 'أنت',
                    unknown: 'غير معروف'
                }
            };

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.primaryColor) p.primaryColor = '#a855f7';
                    if (p.animation === undefined) p.animation = true;
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' }; }
            }

            function getTranslation(key) {
                var s = getSettings();
                var t = translations[s.language] || translations.fa;
                return t[key] || translations.fa[key] || key;
            }

            function hexToRgb(h) {
                var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
                return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:168,g:85,b:247 };
            }
            function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1);}

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k]) el.textContent = t[k];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n-placeholder');
                    if (t[k]) el.placeholder = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                    document.body.style.fontFamily = 'Arial, sans-serif';
                } else if (lang === 'ar') {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = 'Tahoma, sans-serif';
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = "'IRANSans', Tahoma, sans-serif";
                }
            }

            function applyTheme() {
                var s = getSettings();
                var t = s.theme || 'light';
                var p = s.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'dark') {
                    var dp = shadeColor(p, 40);
                    document.documentElement.style.setProperty('--primary', dp);
                } else {
                    document.documentElement.style.setProperty('--primary', p);
                }
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                applyLanguage(s.language);
            }

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }

            function getRankIcon(i) {
                if (i === 0) return '<i class="fa-solid fa-crown" style="color:#f59e0b;"></i>';
                if (i === 1) return '<i class="fa-solid fa-medal" style="color:#94a3b8;"></i>';
                if (i === 2) return '<i class="fa-solid fa-medal" style="color:#d97706;"></i>';
                return '#' + (i + 1);
            }
            function getRankClass(i) {
                if (i === 0) return 'gold';
                if (i === 1) return 'silver';
                if (i === 2) return 'bronze';
                return '';
            }

            function renderRankList(list, myId) {
                var el = document.getElementById('rankList');
                var t = getTranslation('no_users');
                var unknown = getTranslation('unknown');
                var scoreLabel = getTranslation('score');
                var youLabel = getTranslation('you');
                if (list.length === 0) {
                    el.innerHTML = '<div class="rank-empty"><img src="'+SAD_IMAGE+'" alt=""><p>'+t+'</p></div>';
                    return;
                }
                el.innerHTML = list.map(function(item, i) {
                    var isMe = String(item.username) === String(myId);
                    var avatar = item.photo_url ? '<img src="'+item.photo_url+'" alt="">' : '<i class="fa-solid fa-user"></i>';
                    return '<div class="rank-item'+(isMe?' is-me':'')+'">'+
                        '<div class="rank-number '+getRankClass(i)+'">'+getRankIcon(i)+'</div>'+
                        '<div class="rank-avatar">'+avatar+'</div>'+
                        '<div class="rank-info"><div class="rank-name">'+(item.name||item.username||unknown)+'</div>'+
                        '<div class="rank-score">'+scoreLabel+': '+(item.score||0)+'</div></div>'+
                        (isMe?'<span class="rank-badge-me">'+youLabel+'</span>':'')+
                        '</div>';
                }).join('');
            }

            window.filterRankings = function() {
                var q = document.getElementById('searchInput').value.toLowerCase().trim();
                var myId = getUserId();
                if (!q) {
                    renderRankList(allRankings, myId);
                    return;
                }
                var filtered = allRankings.filter(function(item) {
                    var n = (item.name||'').toLowerCase();
                    var u = String(item.username||'').toLowerCase();
                    return n.includes(q) || u.includes(q);
                });
                renderRankList(filtered, myId);
            };

            async function loadRanking() {
                try {
                    var myId = getUserId();
                    var scoreLabel = getTranslation('score');
                    var result = await fetchData('leaderboard', { limit: 100 });
                    if (result.ok && Array.isArray(result.data) && result.data.length > 0) {
                        allRankings = result.data;
                        renderRankList(allRankings, myId);
                        
                        var myRank = null;
                        var myScore = 0;
                        for (var i = 0; i < allRankings.length; i++) {
                            if (String(allRankings[i].username) === String(myId)) {
                                myRank = i + 1;
                                myScore = allRankings[i].score || 0;
                                break;
                            }
                        }
                        document.getElementById('myRankNumber').textContent = myRank ? '#'+myRank : '-';
                        var u = getEitaaUser();
                        var name = u ? ((u.first_name||'')+' '+(u.last_name||'')).trim() : getTranslation('you');
                        document.getElementById('myRankName').textContent = name || getTranslation('you');
                        document.getElementById('myRankScore').textContent = scoreLabel + ': ' + myScore;
                    } else {
                        var noUsers = getTranslation('no_users');
                        document.getElementById('rankList').innerHTML = '<div class="rank-empty"><img src="'+SAD_IMAGE+'" alt=""><p>'+noUsers+'</p></div>';
                    }
                } catch(e) {
                    console.error(e);
                } finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('rankingContent').classList.add('show');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    window.location.href = '../dashboard/';
                });
            }

            applyTheme();
            loadRanking();
        })();
    </script>
</body>
</html>
