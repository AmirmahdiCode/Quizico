<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.5/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --shadow: 4px 4px 0 #000000;
            --shadow-sm: 2px 2px 0 #000000;
            --header-bg: #ffffff;
            --animation-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Vazir, Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .header {
            background: var(--header-bg);
            box-shadow: 0 2px 0 #000000;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #000000;
            transition: all 0.5s ease;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            padding: 4px;
            border: 1px solid #000000;
            transition: transform 0.3s ease;
        }

        .header-logo:hover {
            transform: rotate(5deg) scale(1.05);
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            transition: color 0.5s ease;
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 80px;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: fadeInUp 0.5s ease backwards;
        }

        .settings-card:nth-child(1) { animation-delay: 0.1s; }
        .settings-card:nth-child(2) { animation-delay: 0.2s; }
        .settings-card:nth-child(3) { animation-delay: 0.3s; }
        .settings-card:nth-child(4) { animation-delay: 0.4s; }
        .settings-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-card:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 0 #000000;
        }

        .settings-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.5s ease;
        }

        .settings-title i {
            color: var(--primary);
            font-size: 15px;
            animation: iconPulse 2s ease-in-out infinite;
            transition: color 0.5s ease;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--bg3);
            transition: border-color 0.5s ease;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-info i {
            font-size: 17px;
            color: var(--primary);
            width: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .setting-item:hover .setting-info i {
            transform: rotate(10deg) scale(1.1);
        }

        .setting-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .setting-desc {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--bg3);
            border: 2px solid #000000;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
            flex-shrink: 0;
        }

        .toggle-switch:hover {
            transform: scale(1.05);
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 22px;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toggle-switch.active::after {
            right: 2px;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .color-option {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            border: 2px solid #000000;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
        }

        .color-option:hover {
            transform: translateY(-3px) rotate(5deg);
            box-shadow: 3px 3px 0 #000000;
        }

        .color-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .color-option.active {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
            animation: selectedPulse 1.5s ease-in-out infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { outline-width: 2px; }
            50% { outline-width: 4px; }
        }

        .font-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 0;
        }

        .font-option {
            padding: 10px 14px;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
            background: var(--bg2);
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
        }

        .font-option:hover {
            transform: translateX(-5px);
            box-shadow: 3px 3px 0 #000000;
        }

        .font-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .font-option.active {
            background: var(--primary);
            color: #ffffff;
            animation: fontActive 0.5s ease;
        }

        @keyframes fontActive {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .icon-options {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .icon-option {
            flex: 1;
            padding: 12px;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
            background: var(--bg2);
        }

        .icon-option:hover {
            transform: translateY(-3px);
            box-shadow: 3px 3px 0 #000000;
        }

        .icon-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .icon-option.active {
            background: var(--primary);
            color: #ffffff;
        }

        .icon-option i {
            font-size: 22px;
            display: block;
            margin-bottom: 6px;
            transition: transform 0.3s ease;
        }

        .icon-option:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        .icon-option span {
            font-size: 9px;
            font-weight: 600;
        }

        .preview-box {
            padding: 16px;
            background: var(--bg2);
            border: 2px dashed #000000;
            border-radius: 4px;
            text-align: center;
            margin-top: 12px;
            transition: all 0.5s ease;
        }

        .preview-text {
            font-size: 13px;
            color: var(--dark);
            font-weight: 600;
            transition: color 0.5s ease;
        }

        .preview-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--primary);
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 2px 2px 0 #000000;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .preview-button:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 #000000;
        }

        .preview-button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            animation: navBounce 0.5s ease;
        }

        @keyframes navBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .nav-item:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/y398765_InShot_20260816_163308887.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">تنظیمات</div>
                    <div class="header-subtitle">Quizico</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-moon-stars"></i>
                حالت نمایش
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-circle-half"></i>
                    <div>
                        <div class="setting-label">دارک مود</div>
                        <div class="setting-desc">تغییر به حالت تاریک</div>
                    </div>
                </div>
                <div class="toggle-switch" id="darkModeToggle"></div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-palette"></i>
                تم رنگ
            </div>
            <div class="color-options" id="colorOptions">
                <div class="color-option" data-color="#a855f7" style="background: #a855f7;"></div>
                <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;"></div>
                <div class="color-option" data-color="#10b981" style="background: #10b981;"></div>
                <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                <div class="color-option" data-color="#f97316" style="background: #f97316;"></div>
                <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
            </div>
            <div class="preview-box">
                <div class="preview-text">پیش‌نمایش زنده</div>
                <button class="preview-button">دکمه نمونه</button>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-fonts"></i>
                فونت
            </div>
            <div class="font-options" id="fontOptions">
                <div class="font-option" data-font="Vazir">وزیرمتن</div>
                <div class="font-option" data-font="Samim">صمیم</div>
                <div class="font-option" data-font="Shabnam">شبنم</div>
                <div class="font-option" data-font="IranSans">ایران‌سنس</div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-grid"></i>
                نوع آیکون
            </div>
            <div class="icon-options" id="iconOptions">
                <div class="icon-option" data-icons="bootstrap">
                    <i class="bi bi-bootstrap"></i>
                    <span>بوت‌استرپ</span>
                </div>
                <div class="icon-option" data-icons="fontawesome">
                    <i class="bi bi-flag"></i>
                    <span>فونت‌آسوم</span>
                </div>
                <div class="icon-option" data-icons="emoji">
                    <i class="bi bi-emoji-smile"></i>
                    <span>ایموجی</span>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-sliders"></i>
                سایر تنظیمات
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-lightning-charge"></i>
                    <div>
                        <div class="setting-label">انیمیشن‌ها</div>
                        <div class="setting-desc">افکت‌های حرکتی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="animationToggle"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-phone-vibrate"></i>
                    <div>
                        <div class="setting-label">لرزش (هاپتیک)</div>
                        <div class="setting-desc">بازخورد لمسی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="hapticToggle"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item" onclick="savePage('dashboard')">
            <i class="bi bi-house nav-icon"></i>
            <span>صفحه اصلی</span>
        </a>
        <a href="../ranking/" class="nav-item" onclick="savePage('ranking')">
            <i class="bi bi-trophy nav-icon"></i>
            <span>رتبه بندی</span>
        </a>
        <a href="../profile/" class="nav-item" onclick="savePage('profile')">
            <i class="bi bi-person nav-icon"></i>
            <span>پروفایل من</span>
        </a>
        <a href="../setting/" class="nav-item active" onclick="savePage('setting')">
            <i class="bi bi-gear nav-icon"></i>
            <span>تنظیمات</span>
        </a>
    </nav>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            
            if (webApp) {
                webApp.ready();
                webApp.setHeaderColor('#a855f7');
                webApp.setBackgroundColor('#faf5ff');
            }

            function savePage(page) {
                localStorage.setItem('lastPage', page);
            }

            function getSettings() {
                return JSON.parse(localStorage.getItem('quizicoSettings') || '{}');
            }

            function saveSettings(key, value) {
                const settings = getSettings();
                settings[key] = value;
                localStorage.setItem('quizicoSettings', JSON.stringify(settings));
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                const rgb = hexToRgb(color);
                const r = Math.max(0, Math.min(255, rgb.r + percent));
                const g = Math.max(0, Math.min(255, rgb.g + percent));
                const b = Math.max(0, Math.min(255, rgb.b + percent));
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
            }

            function applyColor(color) {
                const rgb = hexToRgb(color);
                document.documentElement.style.setProperty('--primary', color);
                document.documentElement.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                document.documentElement.style.setProperty('--primary-dark', shadeColor(color, -30));
                document.documentElement.style.setProperty('--primary-light', shadeColor(color, 30));
            }

            function applyFont(font) {
                const fontMap = {
                    'Vazir': 'Vazir, Tahoma, sans-serif',
                    'Samim': 'Samim, Tahoma, sans-serif',
                    'Shabnam': 'Shabnam, Tahoma, sans-serif',
                    'IranSans': 'IRANSans, Tahoma, sans-serif'
                };
                document.body.style.fontFamily = fontMap[font] || 'Vazir, Tahoma, sans-serif';
            }

            function applyIcons(type) {
                if (type === 'emoji') {
                    const iconMap = {
                        'bi-house': '🏠',
                        'bi-trophy': '🏆',
                        'bi-person': '👤',
                        'bi-gear': '⚙️'
                    };
                    document.querySelectorAll('.nav-icon').forEach(el => {
                        const cls = Array.from(el.classList).find(c => c.startsWith('bi-'));
                        if (cls && iconMap[cls]) {
                            el.textContent = iconMap[cls];
                            el.className = 'nav-icon';
                        }
                    });
                } else {
                    document.querySelectorAll('.nav-icon').forEach(el => {
                        if (el.textContent === '🏠') el.className = 'nav-icon bi bi-house';
                        if (el.textContent === '🏆') el.className = 'nav-icon bi bi-trophy';
                        if (el.textContent === '👤') el.className = 'nav-icon bi bi-person';
                        if (el.textContent === '⚙️') el.className = 'nav-icon bi bi-gear';
                    });
                }
            }

            function applyAnimation(enabled) {
                if (enabled) {
                    document.documentElement.removeAttribute('data-animation');
                } else {
                    document.documentElement.setAttribute('data-animation', 'off');
                }
            }

            function triggerHaptic() {
                if (getSettings().haptic !== false && webApp) {
                    webApp.HapticFeedback?.impactOccurred('light');
                }
            }

            function loadSettings() {
                const settings = getSettings();
                
                if (settings.darkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.getElementById('darkModeToggle').classList.add('active');
                }
                
                if (settings.primaryColor) {
                    applyColor(settings.primaryColor);
                    document.querySelectorAll('.color-option').forEach(o => {
                        if (o.dataset.color === settings.primaryColor) {
                            o.classList.add('active');
                        }
                    });
                } else {
                    document.querySelector('.color-option[data-color="#a855f7"]').classList.add('active');
                }
                
                if (settings.font) {
                    applyFont(settings.font);
                    document.querySelectorAll('.font-option').forEach(o => {
                        if (o.dataset.font === settings.font) {
                            o.classList.add('active');
                        }
                    });
                } else {
                    document.querySelector('.font-option[data-font="Vazir"]').classList.add('active');
                }
                
                if (settings.icons) {
                    applyIcons(settings.icons);
                    document.querySelectorAll('.icon-option').forEach(o => {
                        if (o.dataset.icons === settings.icons) {
                            o.classList.add('active');
                        }
                    });
                } else {
                    document.querySelector('.icon-option[data-icons="bootstrap"]').classList.add('active');
                }
                
                if (settings.animation === false) {
                    document.getElementById('animationToggle').classList.remove('active');
                    applyAnimation(false);
                }
                
                if (settings.haptic === false) {
                    document.getElementById('hapticToggle').classList.remove('active');
                }
            }

            document.getElementById('darkModeToggle').addEventListener('click', function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                triggerHaptic();
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    this.classList.remove('active');
                    saveSettings('darkMode', false);
                    if (webApp) {
                        webApp.setBackgroundColor('#faf5ff');
                        webApp.setHeaderColor(getSettings().primaryColor || '#a855f7');
                    }
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    this.classList.add('active');
                    saveSettings('darkMode', true);
                    if (webApp) {
                        webApp.setBackgroundColor('#1e1b2e');
                        webApp.setHeaderColor('#1e1b2e');
                    }
                }
            });

            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    triggerHaptic();
                    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const color = this.dataset.color;
                    applyColor(color);
                    saveSettings('primaryColor', color);
                    if (webApp) {
                        webApp.setHeaderColor(color);
                    }
                });
            });

            document.querySelectorAll('.font-option').forEach(option => {
                option.addEventListener('click', function() {
                    triggerHaptic();
                    document.querySelectorAll('.font-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const font = this.dataset.font;
                    applyFont(font);
                    saveSettings('font', font);
                });
            });

            document.querySelectorAll('.icon-option').forEach(option => {
                option.addEventListener('click', function() {
                    triggerHaptic();
                    document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const icons = this.dataset.icons;
                    applyIcons(icons);
                    saveSettings('icons', icons);
                });
            });

            document.getElementById('animationToggle').addEventListener('click', function() {
                triggerHaptic();
                this.classList.toggle('active');
                const enabled = this.classList.contains('active');
                applyAnimation(enabled);
                saveSettings('animation', enabled);
            });

            document.getElementById('hapticToggle').addEventListener('click', function() {
                this.classList.toggle('active');
                saveSettings('haptic', this.classList.contains('active'));
            });

            loadSettings();
        })();
    </script>
</body>
</html>
