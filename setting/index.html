<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .header {
            background: var(--header-bg);
            box-shadow: 0 2px 0 #000000;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #000000;
            transition: all 0.5s ease;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            padding: 2px;
            border: 1px solid #000000;
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .header-logo:hover {
            transform: rotate(5deg) scale(1.05);
        }

        .header-logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            transition: color 0.5s ease;
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 80px;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: fadeInUp 0.5s ease backwards;
        }

        .settings-card:nth-child(1) { animation-delay: 0.1s; }
        .settings-card:nth-child(2) { animation-delay: 0.2s; }
        .settings-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-card:hover {
            transform: translateY(-3px);
            box-shadow: 5px 5px 0 #000000;
        }

        .settings-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.5s ease;
        }

        .settings-title i {
            color: var(--primary);
            font-size: 15px;
            animation: iconPulse 2s ease-in-out infinite;
            transition: color 0.5s ease;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .theme-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 0;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
            background: var(--bg2);
        }

        .theme-option:hover {
            transform: translateX(-5px);
            box-shadow: 3px 3px 0 #000000;
        }

        .theme-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .theme-option.active {
            background: var(--primary);
        }

        .theme-option.active .theme-option-label {
            color: #ffffff;
        }

        .theme-option.active .theme-option-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        .theme-option.active i {
            color: #ffffff;
        }

        .theme-option i {
            font-size: 18px;
            color: var(--primary);
            width: 24px;
            text-align: center;
            transition: color 0.3s ease;
        }

        .theme-option-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            transition: color 0.3s ease;
        }

        .theme-option-desc {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .color-option {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            border: 2px solid #000000;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: none;
        }

        .color-option:hover {
            transform: translateY(-3px) rotate(5deg);
        }

        .color-option:active {
            transform: translate(2px, 2px);
        }

        .color-option.active {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
            animation: selectedPulse 1.5s ease-in-out infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { outline-width: 2px; }
            50% { outline-width: 4px; }
        }

        .preview-box {
            padding: 16px;
            background: var(--bg2);
            border: 2px dashed #000000;
            border-radius: 4px;
            text-align: center;
            margin-top: 12px;
            transition: all 0.5s ease;
        }

        .preview-text {
            font-size: 13px;
            color: var(--dark);
            font-weight: 600;
            transition: color 0.5s ease;
        }

        .preview-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--primary);
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 2px 2px 0 #000000;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .preview-button:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 #000000;
        }

        .preview-button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--bg3);
            transition: border-color 0.5s ease;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-info i {
            font-size: 17px;
            color: var(--primary);
            width: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .setting-item:hover .setting-info i {
            transform: rotate(10deg) scale(1.1);
        }

        .setting-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .setting-desc {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--bg3);
            border: 2px solid #000000;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 2px 2px 0 #000000;
            flex-shrink: 0;
        }

        .toggle-switch:hover {
            transform: scale(1.05);
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 22px;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toggle-switch.active::after {
            right: 2px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            animation: navBounce 0.5s ease;
        }

        @keyframes navBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .nav-item:active {
            transform: translateY(1px);
        }
    </style>
</
