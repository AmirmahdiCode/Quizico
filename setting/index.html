<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            transition: background 0.8s ease;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.1;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
            animation: slideDown 0.5s ease;
            transition: all 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .header-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
            transition: color 0.5s ease;
            font-family: 'IRANSans', Tahoma, sans-serif;
        }

        .header-title span {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            margin-top: -2px;
            transition: color 0.5s ease;
        }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
        }

        .settings-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            animation: fadeInUp 0.4s ease backwards;
        }

        .settings-card:nth-child(1) { animation-delay: 0.05s; }
        .settings-card:nth-child(2) { animation-delay: 0.1s; }
        .settings-card:nth-child(3) { animation-delay: 0.15s; }

        @keyframes fadeInUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 #000000;
        }

        .settings-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.5s ease;
            border-bottom: 1px dashed var(--text-light);
            padding-bottom: 6px;
        }

        .settings-title i {
            color: var(--primary);
            font-size: 14px;
        }

        .theme-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 4px 0;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: var(--shadow);
            background: var(--bg2);
        }

        .theme-option:hover {
            transform: translateX(-3px);
            box-shadow: 4px 4px 0 #000000;
        }

        .theme-option:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #000000;
        }

        .theme-option.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .theme-option.active .theme-option-label {
            color: #ffffff;
        }

        .theme-option.active .theme-option-desc {
            color: rgba(255, 255, 255, 0.8);
        }

        .theme-option.active i {
            color: #ffffff;
        }

        .theme-option i {
            font-size: 18px;
            color: var(--primary);
            width: 24px;
            text-align: center;
            transition: color 0.3s ease;
        }

        .theme-option-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            transition: color 0.3s ease;
        }

        .theme-option-desc {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 4px 0;
        }

        .color-option {
            width: 34px;
            height: 34px;
            border-radius: var(--radius);
            border: var(--border);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: var(--shadow);
            position: relative;
        }

        .color-option:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 4px 4px 0 #000000;
        }

        .color-option:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #000000;
        }

        .color-option.active {
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary), 3px 3px 0 #000000;
            transform: translateY(-3px) scale(1.05);
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--bg3);
            transition: border-color 0.5s ease;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-info i {
            font-size: 16px;
            color: var(--primary);
            width: 22px;
            text-align: center;
        }

        .setting-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .setting-desc {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: var(--bg3);
            border: var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .toggle-switch:hover {
            transform: scale(1.05);
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 20px;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: var(--border);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toggle-switch.active::after {
            right: 2px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: var(--radius);
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        @media (max-width: 480px) {
            .header-title { font-size: 15px; }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .color-options { gap: 6px; }
            .color-option { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="bg-particles" id="particles"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">Quiz<span>ico</span></div>
                    <div class="header-subtitle">تنظیمات</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="settings-card">
            <div class="settings-title">
                <i class="fa-solid fa-moon"></i>
                حالت نمایش سایت
            </div>
            <div class="theme-options">
                <div class="theme-option" data-theme-mode="light">
                    <i class="fa-regular fa-sun"></i>
                    <div>
                        <div class="theme-option-label">حالت روشن</div>
                        <div class="theme-option-desc">همیشه روشن</div>
                    </div>
                </div>
                <div class="theme-option" data-theme-mode="dark">
                    <i class="fa-regular fa-moon"></i>
                    <div>
                        <div class="theme-option-label">حالت تاریک</div>
                        <div class="theme-option-desc">همیشه تاریک</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="fa-solid fa-palette"></i>
                تم رنگ
            </div>
            <div class="color-options" id="colorOptions">
                <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                <div class="color-option" data-color="#f97316" style="background: #f97316;"></div>
                <div class="color-option" data-color="#f59e0b" style="background: #f59e0b;"></div>
                <div class="color-option" data-color="#84cc16" style="background: #84cc16;"></div>
                <div class="color-option" data-color="#10b981" style="background: #10b981;"></div>
                <div class="color-option" data-color="#14b8a6" style="background: #14b8a6;"></div>
                <div class="color-option" data-color="#06b6d4" style="background: #06b6d4;"></div>
                <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;"></div>
                <div class="color-option" data-color="#6366f1" style="background: #6366f1;"></div>
                <div class="color-option" data-color="#a855f7" style="background: #a855f7;"></div>
                <div class="color-option" data-color="#8b5cf6" style="background: #8b5cf6;"></div>
                <div class="color-option" data-color="#d946ef" style="background: #d946ef;"></div>
                <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
                <div class="color-option" data-color="#f43f5e" style="background: #f43f5e;"></div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="fa-solid fa-sliders"></i>
                سایر تنظیمات
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="fa-solid fa-bolt"></i>
                    <div>
                        <div class="setting-label">انیمیشن‌ها</div>
                        <div class="setting-desc">افکت‌های حرکتی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="animationToggle"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <div>
                        <div class="setting-label">لرزش (هاپتیک)</div>
                        <div class="setting-desc">بازخورد لمسی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="hapticToggle"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>خانه</span>
        </a>
        <a href="../ranking/" class="nav-item">
            <i class="fa-solid fa-trophy"></i>
            <span>رتبه</span>
        </a>
        <a href="../profile/" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>پروفایل</span>
        </a>
        <a href="../setting/" class="nav-item active">
            <i class="fa-solid fa-gear"></i>
            <span>تنظیمات</span>
        </a>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;

            function createParticles() {
                var container = document.getElementById('particles');
                for (var i = 0; i < 20; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle';
                    var size = 3 + Math.random() * 8;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = 15 + Math.random() * 25 + 's';
                    p.style.animationDelay = Math.random() * 20 + 's';
                    container.appendChild(p);
                }
            }
            createParticles();

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) {
                        var defaultSettings = {
                            theme: 'light',
                            primaryColor: '#a855f7',
                            animation: true,
                            haptic: true
                        };
                        localStorage.setItem('quizicoSettings', JSON.stringify(defaultSettings));
                        return defaultSettings;
                    }
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    if (parsed.animation === undefined) parsed.animation = true;
                    if (parsed.haptic === undefined) parsed.haptic = true;
                    return parsed;
                } catch(e) {
                    return { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true };
                }
            }

            function saveSettings(settings) {
                localStorage.setItem('quizicoSettings', JSON.stringify(settings));
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                
                document.documentElement.setAttribute('data-theme', theme);
                
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(darkPrimary).r + ', ' + hexToRgb(darkPrimary).g + ', ' + hexToRgb(darkPrimary).b);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(primaryColor).r + ', ' + hexToRgb(primaryColor).g + ', ' + hexToRgb(primaryColor).b);
                }
                
                if (settings.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                
                if (webApp) {
                    webApp.setHeaderColor('bg_color');
                    webApp.setBackgroundColor('bg_color');
                }

                var themeBtns = document.querySelectorAll('.theme-option');
                themeBtns.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.themeMode === theme);
                });

                var colorBtns = document.querySelectorAll('.color-option');
                colorBtns.forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.color === primaryColor);
                });

                var animToggle = document.getElementById('animationToggle');
                animToggle.classList.toggle('active', settings.animation !== false);

                var hapticToggle = document.getElementById('hapticToggle');
                hapticToggle.classList.toggle('active', settings.haptic !== false);
            }

            function triggerHaptic() {
                var settings = getSettings();
                if (settings.haptic !== false && webApp) {
                    webApp.HapticFeedback?.impactOccurred('light');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    window.location.href = '../dashboard/';
                });
            }

            document.querySelectorAll('.theme-option').forEach(function(option) {
                option.addEventListener('click', function() {
                    triggerHaptic();
                    var settings = getSettings();
                    settings.theme = this.dataset.themeMode;
                    saveSettings(settings);
                    applyTheme();
                });
            });

            document.querySelectorAll('.color-option').forEach(function(option) {
                option.addEventListener('click', function() {
                    triggerHaptic();
                    var settings = getSettings();
                    settings.primaryColor = this.dataset.color;
                    saveSettings(settings);
                    applyTheme();
                });
            });

            document.getElementById('animationToggle').addEventListener('click', function() {
                triggerHaptic();
                var settings = getSettings();
                settings.animation = !this.classList.contains('active');
                saveSettings(settings);
                applyTheme();
            });

            document.getElementById('hapticToggle').addEventListener('click', function() {
                triggerHaptic();
                var settings = getSettings();
                settings.haptic = !this.classList.contains('active');
                saveSettings(settings);
                applyTheme();
            });

            applyTheme();
        })();
    </script>
</body>
</html>
