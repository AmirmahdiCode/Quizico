<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --card-border: #000000;
            --shadow: 4px 4px 0 #000000;
            --shadow-hover: 6px 6px 0 #000000;
            --shadow-sm: 2px 2px 0 #000000;
            --header-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --card-border: #000000;
            --header-bg: #2d2a3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Vazir, Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .header {
            background: var(--header-bg);
            box-shadow: 0 4px 0 #000000;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border: 1px solid #000000;
            border-top: none;
            transition: all 0.3s ease;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0 #000000;
            overflow: hidden;
            padding: 4px;
            border: 1px solid #000000;
        }

        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--text-light);
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 100px;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 4px 4px 0 #000000;
            transition: all 0.3s ease;
        }

        .settings-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-title i {
            color: var(--primary);
            font-size: 16px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--bg3);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-info i {
            font-size: 18px;
            color: var(--primary);
            width: 24px;
            text-align: center;
        }

        .setting-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
        }

        .setting-desc {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--bg3);
            border: 2px solid #000000;
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 2px 2px 0 #000000;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 24px;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-switch.active::after {
            right: 2px;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: 2px solid #000000;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0 #000000;
        }

        .color-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .color-option.active {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        .font-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 0;
        }

        .font-option {
            padding: 10px 14px;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0 #000000;
            background: var(--bg2);
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
        }

        .font-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .font-option.active {
            background: var(--primary);
            color: #ffffff;
        }

        .icon-options {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .icon-option {
            flex: 1;
            padding: 12px;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0 #000000;
            background: var(--bg2);
        }

        .icon-option:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 #000000;
        }

        .icon-option.active {
            background: var(--primary);
            color: #ffffff;
        }

        .icon-option i {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        .icon-option span {
            font-size: 10px;
            font-weight: 600;
        }

        .preview-box {
            padding: 16px;
            background: var(--bg2);
            border: 2px dashed #000000;
            border-radius: 4px;
            text-align: center;
            margin-top: 12px;
        }

        .preview-text {
            font-size: 13px;
            color: var(--dark);
            font-weight: 600;
        }

        .preview-button {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--primary);
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 2px 2px 0 #000000;
            font-family: inherit;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: 2px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 999;
            box-shadow: 0 -4px 0 #000000;
            transition: all 0.3s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.15s ease;
            padding: 6px 16px;
            border-radius: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.15s ease;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/y398765_InShot_20260816_163308887.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">تنظیمات</div>
                    <div class="header-subtitle">Quizico</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-moon-stars"></i>
                حالت نمایش
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-circle-half"></i>
                    <div>
                        <div class="setting-label">دارک مود</div>
                        <div class="setting-desc">تغییر به حالت تاریک</div>
                    </div>
                </div>
                <div class="toggle-switch" id="darkModeToggle"></div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-palette"></i>
                تم رنگ
            </div>
            <div class="color-options" id="colorOptions">
                <div class="color-option" data-color="#a855f7" style="background: #a855f7;"></div>
                <div class="color-option" data-color="#3b82f6" style="background: #3b82f6;"></div>
                <div class="color-option" data-color="#10b981" style="background: #10b981;"></div>
                <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                <div class="color-option" data-color="#f97316" style="background: #f97316;"></div>
                <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
            </div>
            <div class="preview-box">
                <div class="preview-text">پیش‌نمایش زنده</div>
                <button class="preview-button">دکمه نمونه</button>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-fonts"></i>
                فونت
            </div>
            <div class="font-options" id="fontOptions">
                <div class="font-option" data-font="Vazir">وزیرمتن</div>
                <div class="font-option" data-font="Samim">صمیم</div>
                <div class="font-option" data-font="Shabnam">شبنم</div>
                <div class="font-option" data-font="IranSans">ایران‌سنس</div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-grid"></i>
                نوع آیکون
            </div>
            <div class="icon-options" id="iconOptions">
                <div class="icon-option" data-icons="bootstrap">
                    <i class="bi bi-bootstrap"></i>
                    <span>بوت‌استرپ</span>
                </div>
                <div class="icon-option" data-icons="fontawesome">
                    <i class="bi bi-flag"></i>
                    <span>فونت‌آسوم</span>
                </div>
                <div class="icon-option" data-icons="emoji">
                    <i class="bi bi-emoji-smile"></i>
                    <span>ایموجی</span>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-title">
                <i class="bi bi-sliders"></i>
                سایر تنظیمات
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-lightning-charge"></i>
                    <div>
                        <div class="setting-label">انیمیشن‌ها</div>
                        <div class="setting-desc">افکت‌های حرکتی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="animationToggle"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <i class="bi bi-phone-vibrate"></i>
                    <div>
                        <div class="setting-label">لرزش (هاپتیک)</div>
                        <div class="setting-desc">بازخورد لمسی</div>
                    </div>
                </div>
                <div class="toggle-switch active" id="hapticToggle"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item" onclick="savePage('dashboard')">
            <i class="bi bi-house"></i>
            <span>صفحه اصلی</span>
        </a>
        <a href="../ranking/" class="nav-item" onclick="savePage('ranking')">
            <i class="bi bi-trophy"></i>
            <span>رتبه بندی</span>
        </a>
        <a href="../profile/" class="nav-item" onclick="savePage('profile')">
            <i class="bi bi-person"></i>
            <span>پروفایل من</span>
        </a>
        <a href="../setting/" class="nav-item active" onclick="savePage('setting')">
            <i class="bi bi-gear"></i>
            <span>تنظیمات</span>
        </a>
    </nav>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            
            if (webApp) {
                webApp.ready();
                webApp.setHeaderColor('#a855f7');
                webApp.setBackgroundColor('#faf5ff');
            }

            function savePage(page) {
                localStorage.setItem('lastPage', page);
            }

            function loadSettings() {
                const settings = JSON.parse(localStorage.getItem('quizicoSettings') || '{}');
                
                if (settings.darkMode) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.getElementById('darkModeToggle').classList.add('active');
                }
                
                if (settings.primaryColor) {
                    applyColor(settings.primaryColor);
                }
                
                if (settings.font) {
                    applyFont(settings.font);
                }
                
                if (settings.animation === false) {
                    document.getElementById('animationToggle').classList.remove('active');
                }
                
                if (settings.haptic === false) {
                    document.getElementById('hapticToggle').classList.remove('active');
                }
            }

            function applyColor(color) {
                const rgb = hexToRgb(color);
                document.documentElement.style.setProperty('--primary', color);
                document.documentElement.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
                
                const darkColor = shadeColor(color, -20);
                document.documentElement.style.setProperty('--primary-dark', darkColor);
                
                const lightColor = shadeColor(color, 20);
                document.documentElement.style.setProperty('--primary-light', lightColor);
            }

            function applyFont(font) {
                const fontMap = {
                    'Vazir': 'Vazir, Tahoma, sans-serif',
                    'Samim': 'Samim, Tahoma, sans-serif',
                    'Shabnam': 'Shabnam, Tahoma, sans-serif',
                    'IranSans': 'IRANSans, Tahoma, sans-serif'
                };
                document.body.style.fontFamily = fontMap[font] || 'Vazir, Tahoma, sans-serif';
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                const rgb = hexToRgb(color);
                const r = Math.max(0, Math.min(255, rgb.r + percent));
                const g = Math.max(0, Math.min(255, rgb.g + percent));
                const b = Math.max(0, Math.min(255, rgb.b + percent));
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
            }

            function saveSettings(key, value) {
                const settings = JSON.parse(localStorage.getItem('quizicoSettings') || '{}');
                settings[key] = value;
                localStorage.setItem('quizicoSettings', JSON.stringify(settings));
            }

            document.getElementById('darkModeToggle').addEventListener('click', function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    this.classList.remove('active');
                    saveSettings('darkMode', false);
                    if (webApp) webApp.setBackgroundColor('#faf5ff');
                    if (webApp) webApp.setHeaderColor(document.documentElement.style.getPropertyValue('--primary') || '#a855f7');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    this.classList.add('active');
                    saveSettings('darkMode', true);
                    if (webApp) webApp.setBackgroundColor('#1e1b2e');
                    if (webApp) webApp.setHeaderColor('#1e1b2e');
                }
            });

            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const color = this.dataset.color;
                    applyColor(color);
                    saveSettings('primaryColor', color);
                    if (webApp) webApp.setHeaderColor(color);
                });
            });

            document.querySelectorAll('.font-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.font-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const font = this.dataset.font;
                    applyFont(font);
                    saveSettings('font', font);
                });
            });

            document.querySelectorAll('.icon-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    saveSettings('icons', this.dataset.icons);
                });
            });

            document.getElementById('animationToggle').addEventListener('click', function() {
                this.classList.toggle('active');
                saveSettings('animation', this.classList.contains('active'));
            });

            document.getElementById('hapticToggle').addEventListener('click', function() {
                this.classList.toggle('active');
                saveSettings('haptic', this.classList.contains('active'));
            });

            loadSettings();
        })();
    </script>
</body>
</html>
