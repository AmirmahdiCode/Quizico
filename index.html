<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
</head>
<body>
    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            const API_URL = 'https://script.google.com/macros/s/AKfycbx34bNcwqg5JHqOI6DFbV41d-w0yjdS76kuemQYZcCpuNQqFoMWM7ipFF7zxJFG0EW6-w/exec';
            
            async function fetchData(action, params = {}) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: '77781793:?4r]T}h-UXSic6Q-uBG@ZJg-WE*GqQL-8OZOSzR-~ehNGgr-6l7Hn6L-{yNSFm0-lbohCpI-soEMY(7-)v~$I22-JCNAVXj-,^x05PQ-&tQ5FQD-5ZXU5fK-iN4{fkz-FYIkfj5-sZ9bizd-sqfOUbw-CJindBM-FvlZYt1-pETvfRr-Vm)aHlo-OyptiU%',
                            action: action,
                            ...params
                        })
                    });
                    return await response.json();
                } catch(e) {
                    return { success: false, message: 'Network error' };
                }
            }
            
            function redirectToLastPage() {
                const validPages = ['dashboard', 'ranking', 'profile', 'setting'];
                const lastPage = localStorage.getItem('lastPage');
                const targetPage = validPages.includes(lastPage) ? lastPage : 'dashboard';
                window.location.href = `./${targetPage}/`;
            }
            
            async function initUser() {
                if (webApp) {
                    webApp.ready();
                }
                
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    const user = webApp.initDataUnsafe.user;
                    const username = String(user.id);
                    
                    try {
                        const userData = await fetchData('getUser', { username: username });
                        
                        if (!userData.success) {
                            const createResult = await fetchData('createUser', {
                                user: {
                                    username: username,
                                    name: (user.first_name || '') + ' ' + (user.last_name || ''),
                                    score: 0,
                                    coins: 0,
                                    diamonds: 0,
                                    stats: '',
                                    status: 'active'
                                }
                            });
                            
                            if (!createResult.success) {
                                console.error('Failed to create user:', createResult);
                            }
                        }
                    } catch(e) {
                        console.error('Error during user check:', e);
                    }
                }
                
                redirectToLastPage();
            }
            
            initUser();
        })();
    </script>
</body>
</html>
