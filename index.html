<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 40%, #e9d5ff 80%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .logo-letters {
            display: flex;
            gap: 6px;
            direction: ltr;
        }

        .letter {
            font-size: 38px;
            font-weight: 900;
            color: #a855f7;
            opacity: 0;
            transform: translateY(-30px) scale(0.5);
            animation: letterJump 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            font-family: 'IRANSans', Tahoma, sans-serif;
        }

        .letter:nth-child(1) { animation-delay: 0.1s; }
        .letter:nth-child(2) { animation-delay: 0.2s; }
        .letter:nth-child(3) { animation-delay: 0.3s; }
        .letter:nth-child(4) { animation-delay: 0.4s; }
        .letter:nth-child(5) { animation-delay: 0.5s; }
        .letter:nth-child(6) { animation-delay: 0.6s; }
        .letter:nth-child(7) { animation-delay: 0.7s; }

        @keyframes letterJump {
            0% { opacity: 0; transform: translateY(-30px) scale(0.5); }
            50% { opacity: 1; transform: translateY(8px) scale(1.1); }
            70% { transform: translateY(-4px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .progress-wrapper {
            width: 100%;
            background: #fff;
            border: 2px solid #000;
            border-radius: 20px;
            padding: 4px;
            box-shadow: 4px 4px 0 #000;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 14px;
            background: linear-gradient(90deg, #a855f7, #c084fc, #e9d5ff);
            border-radius: 20px;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .status-text {
            font-size: 13px;
            font-weight: 600;
            color: #4a4458;
            text-align: center;
        }

        .status-text span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #6b7280;
            margin-top: 4px;
        }

        .support-notification {
            position: fixed;
            bottom: 20px;
            right: 10px;
            left: 10px;
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            box-shadow: 5px 5px 0 #000;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            cursor: pointer;
        }
        .support-notification img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #000;
            object-fit: cover;
        }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: #1e1b2e; }
        .support-notification .notif-desc { font-size: 8px; color: #6b7280; }
        .support-notification i { color: #6b7280; font-size: 10px; }

        @media (max-width: 480px) {
            .letter { font-size: 30px; }
            .status-text { font-size: 12px; }
            .status-text span { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-letters">
            <span class="letter">Q</span>
            <span class="letter">u</span>
            <span class="letter">i</span>
            <span class="letter">z</span>
            <span class="letter">i</span>
            <span class="letter">c</span>
            <span class="letter">o</span>
        </div>
        
        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-text" id="statusText">
            در حال آماده‌سازی...
            <span id="statusSub">لطفاً صبر کنید</span>
        </div>
    </div>

    <div class="support-notification" id="supportNotification" onclick="openSupportLink()">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
            <div class="notif-desc">از سازنده حمایت کنید</div>
        </div>
        <i class="fa-solid fa-chevron-left"></i>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbyHQXQ0TffhGyW1MdtI-_sWlZMhLSPDCR3Az5dDkuwv9TJt1o6-f_aCOg_aHJnty_8P/exec';

            var progressBar = document.getElementById('progressBar');
            var statusText = document.getElementById('statusText');
            var statusSub = document.getElementById('statusSub');

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });

            function setProgress(pct, mainText, subText) {
                progressBar.style.width = pct + '%';
                if (mainText) statusText.textContent = mainText;
                if (subText) statusSub.textContent = subText;
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            function getStartParam() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
                    return webApp.initDataUnsafe.start_param;
                }
                return '';
            }

            async function fetchData(action, params) {
                var payload = {
                    action: action,
                    username: getUserId(),
                    initData: webApp?.initData || ''
                };
                if (params) {
                    for (var key in params) { payload[key] = params[key]; }
                }
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            }

            function openSupportLink(){
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank');
                }
            }
            window.openSupportLink = openSupportLink;

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                var startParam = getStartParam();
                var user = getEitaaUser();
                var username = getUserId();

                if (!user || !username) {
                    setProgress(0, 'لطفاً از داخل ایتا وارد شوید', '');
                    return;
                }

                var fullName = (user.first_name || '') + ' ' + (user.last_name || '');

                setProgress(20, 'در حال بررسی اطلاعات...', 'چک کردن حساب کاربری');

                var check = await fetchData('getUser', {});

                if (check.ok && check.data) {
                    setProgress(50, 'اطلاعات پیدا شد', 'به‌روزرسانی نام...');
                    var currentName = check.data.name || '';
                    var newName = fullName.trim() || 'کاربر';
                    if (currentName !== newName) {
                        await fetchData('updateUser', { name: newName });
                    }
                } else {
                    setProgress(50, 'حساب جدید', 'در حال ساخت حساب...');
                    await fetchData('registerUser', {
                        name: fullName.trim() || 'کاربر'
                    });
                }

                setProgress(80, 'آماده‌سازی کامل شد', 'در حال انتقال...');

                setTimeout(function() {
                    setProgress(100, 'خوش آمدید!', '');
                    
                    setTimeout(function() {
                        if (startParam) {
                            if (startParam.startsWith('LG_')) {
                                localStorage.setItem('leagueCode', startParam);
                                window.location.href = './play/league/';
                            } else {
                                localStorage.setItem('onlineRoomCode', startParam);
                                window.location.href = './play/online/';
                            }
                        } else {
                            window.location.href = './dashboard/';
                        }
                    }, 400);
                }, 500);
            }

            if (webApp) {
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    webApp.close();
                });
            }

            init();
        })();
    </script>

</body>
</html>
