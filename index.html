<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            transition: background 0.8s ease;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.1;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
            animation: slideDown 0.5s ease;
            transition: all 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
            transition: transform 0.3s ease;
        }

        .header-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .header-logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
            transition: color 0.5s ease;
        }

        .header-title span {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--text-light);
            margin-top: -2px;
        }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        .welcome-box {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            font-size: 64px;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }

        .welcome-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .welcome-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .user-preview {
            background: var(--bg2);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin: 12px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-preview-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }

        .user-preview-info {
            text-align: right;
            flex: 1;
            min-width: 0;
        }

        .user-preview-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
        }

        .user-preview-id {
            font-size: 10px;
            color: var(--text-light);
            direction: ltr;
            text-align: right;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #ffffff;
            border: var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 #000000;
        }

        .btn-primary:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #000000;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary i {
            font-size: 18px;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--text-light);
            border: var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: var(--bg2);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .loader-small {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2), var(--shadow);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            width: 100%;
            pointer-events: auto;
            animation: toastIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .toast i {
            font-size: 18px;
        }

        .toast.success { border-color: #10b981; }
        .toast.success i { color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.error i { color: #ef4444; }
        .toast.info { border-color: var(--primary); }
        .toast.info i { color: var(--primary); }
        .toast.loading { border-color: var(--text-light); }
        .toast.loading i { color: var(--text-light); }

        .toast.hiding {
            animation: toastOut 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s ease;
            padding: 4px 12px;
            border-radius: var(--radius);
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        @media (max-width: 480px) {
            .header-title { font-size: 17px; }
            .welcome-title { font-size: 18px; }
            .welcome-icon { font-size: 48px; }
            .welcome-box { padding: 24px 16px; }
            .toast { font-size: 12px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="bg-particles" id="particles"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-logo">
                <img src="https://cdn.imgurl.ir/uploads/r102593_InShot_20260817_115945628.png" alt="Quizico">
            </div>
            <div>
                <div class="header-title">Quiz<span>ico</span></div>
                <div class="header-subtitle">اطلاعات خودت رو محک بزن</div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="welcome-box">
            <span class="welcome-icon"><i class="fa-solid fa-brain"></i></span>
            <div class="welcome-title">به Quizico خوش آمدی</div>
            <div class="welcome-desc">
                برای شروع بازی، ابتدا اطلاعات خود را ثبت کنید.
                این کار فقط یک بار انجام می‌شود.
            </div>

            <div class="user-preview" id="userPreview">
                <div class="user-preview-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="user-preview-info">
                    <div class="user-preview-name" id="previewName">در حال بارگذاری...</div>
                    <div class="user-preview-id" id="previewId">-</div>
                </div>
            </div>

            <button class="btn-primary" id="registerBtn">
                <i class="fa-solid fa-floppy-disk"></i>
                ثبت اطلاعات
            </button>

            <button class="btn-secondary" id="skipBtn" disabled>
                <i class="fa-solid fa-arrow-left"></i>
                رفتن به داشبورد
            </button>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <nav class="bottom-nav">
        <a href="./" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>خانه</span>
        </a>
        <a href="./dashboard/" class="nav-item">
            <i class="fa-solid fa-gamepad"></i>
            <span>داشبورد</span>
        </a>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbwPu-AuPNYMhmbjbjbozBK4oxRm8HjsU37jYmHY1atQUAm8BV-G3RMh8yIeacVfOHkhug/exec';
            var isRegistered = false;
            var toastTimeout = null;
            var currentUser = null;
            var SECRET_KEY = 'QUIZICO_SECRET_KEY_2024';

            function createParticles() {
                var container = document.getElementById('particles');
                for (var i = 0; i < 20; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle';
                    var size = 3 + Math.random() * 8;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = 15 + Math.random() * 25 + 's';
                    p.style.animationDelay = Math.random() * 20 + 's';
                    container.appendChild(p);
                }
            }
            createParticles();

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) {
                        var defaultSettings = {
                            theme: 'light',
                            primaryColor: '#a855f7',
                            animation: true,
                            haptic: true
                        };
                        localStorage.setItem('quizicoSettings', JSON.stringify(defaultSettings));
                        return defaultSettings;
                    }
                    return JSON.parse(raw);
                } catch(e) {
                    return { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true };
                }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';

                document.documentElement.setAttribute('data-theme', theme);

                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(darkPrimary).r + ', ' + hexToRgb(darkPrimary).g + ', ' + hexToRgb(darkPrimary).b);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(primaryColor).r + ', ' + hexToRgb(primaryColor).g + ', ' + hexToRgb(primaryColor).b);
                }

                if (settings.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }

                if (webApp) {
                    webApp.setHeaderColor('bg_color');
                    webApp.setBackgroundColor('bg_color');
                }
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            async function fetchData(action, params) {
                try {
                    var initData = webApp?.initData || '';
                    var payload = { action: action, initData: initData };
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) {
                            payload[key] = params[key];
                        }
                    }
                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    var data = await response.json();
                    if (data.ok === false) {
                        console.warn('API Error:', data.error);
                        return { ok: false, error: 'خطا در ارتباط با سرور' };
                    }
                    return data;
                } catch(e) {
                    console.warn('Network Error:', e);
                    return { ok: false, error: 'خطا در ارتباط با سرور' };
                }
            }

            function generateSignature(username, initData) {
                var data = username + '|' + initData + '|' + SECRET_KEY;
                return CryptoJS.SHA256(data).toString(CryptoJS.enc.Hex);
            }

            function showToast(message, type, duration) {
                var container = document.getElementById('toastContainer');
                duration = duration || 4000;

                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }

                var existing = container.querySelector('.toast');
                if (existing) {
                    existing.classList.add('hiding');
                    setTimeout(function() {
                        if (existing.parentNode) existing.remove();
                    }, 400);
                }

                setTimeout(function() {
                    var toast = document.createElement('div');
                    toast.className = 'toast ' + type;
                    var icon = '';
                    if (type === 'success') icon = '<i class="fa-regular fa-circle-check"></i>';
                    else if (type === 'error') icon = '<i class="fa-regular fa-circle-xmark"></i>';
                    else if (type === 'info') icon = '<i class="fa-regular fa-circle-info"></i>';
                    else if (type === 'loading') icon = '<span class="loader-small" style="border-color:#fff;border-top-color:transparent;"></span>';
                    toast.innerHTML = icon + ' ' + message;
                    container.appendChild(toast);

                    if (duration > 0) {
                        toastTimeout = setTimeout(function() {
                            toast.classList.add('hiding');
                            setTimeout(function() {
                                if (toast.parentNode) toast.remove();
                            }, 400);
                        }, duration);
                    }
                }, 450);
            }

            function hideToast() {
                var container = document.getElementById('toastContainer');
                var existing = container.querySelector('.toast');
                if (existing) {
                    existing.classList.add('hiding');
                    setTimeout(function() {
                        if (existing.parentNode) existing.remove();
                    }, 400);
                }
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toastTimeout = null;
                }
            }

            async function registerUser() {
                var btn = document.getElementById('registerBtn');
                var skipBtn = document.getElementById('skipBtn');

                if (!currentUser) {
                    showToast('کاربر ایتا شناسایی نشد.', 'error', 5000);
                    return;
                }

                var username = String(currentUser.id);
                var fullName = (currentUser.first_name || '') + ' ' + (currentUser.last_name || '');
                var initData = webApp?.initData || '';
                var signature = generateSignature(username, initData);

                btn.disabled = true;
                btn.innerHTML = '<span class="loader-small"></span> در حال ثبت...';
                showToast('در حال ثبت اطلاعات در سرور...', 'loading', 0);

                try {
                    var result = await fetchData('registerUser', {
                        username: username,
                        name: fullName.trim() || 'کاربر',
                        signature: signature
                    });

                    if (result.ok) {
                        isRegistered = true;
                        hideToast();
                        showToast('اطلاعات شما با موفقیت ثبت شد!', 'success', 2000);
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> ثبت شد';
                        btn.style.background = '#10b981';
                        skipBtn.disabled = false;

                        setTimeout(function() {
                            window.location.href = './dashboard/';
                        }, 2000);
                    } else {
                        hideToast();
                        showToast('خطا در ثبت اطلاعات', 'error', 5000);
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> ثبت اطلاعات';
                    }
                } catch(e) {
                    hideToast();
                    showToast('خطا در ارتباط با سرور', 'error', 5000);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> ثبت اطلاعات';
                }
            }

            async function checkUserExists(username) {
                var result = await fetchData('getUser', { username: username });
                return result.ok && result.data;
            }

            async function initPage() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                currentUser = getEitaaUser();

                if (currentUser) {
                    var fullName = (currentUser.first_name || '') + ' ' + (currentUser.last_name || '');
                    document.getElementById('previewName').textContent = fullName.trim() || 'کاربر ایتا';
                    document.getElementById('previewId').textContent = 'ID: ' + currentUser.id;

                    try {
                        var exists = await checkUserExists(String(currentUser.id));
                        if (exists) {
                            isRegistered = true;
                            var btn = document.getElementById('registerBtn');
                            btn.innerHTML = '<i class="fa-solid fa-check"></i> قبلاً ثبت شده‌اید';
                            btn.style.background = '#10b981';
                            btn.disabled = true;
                            document.getElementById('skipBtn').disabled = false;
                            showToast('شما قبلاً ثبت نام کرده‌اید.', 'success', 2000);
                            setTimeout(function() {
                                window.location.href = './dashboard/';
                            }, 2000);
                        } else {
                            document.getElementById('skipBtn').disabled = true;
                        }
                    } catch(e) {
                        console.error('Error checking user:', e);
                    }
                } else {
                    document.getElementById('previewName').textContent = 'کاربر مهمان';
                    document.getElementById('previewId').textContent = 'وارد ایتا شوید';
                    document.getElementById('registerBtn').disabled = true;
                    document.getElementById('skipBtn').disabled = true;
                    showToast('لطفاً از داخل پیام‌رسان ایتا وارد شوید.', 'error', 5000);
                }

                applyTheme();
            }

            document.getElementById('registerBtn').addEventListener('click', registerUser);

            document.getElementById('skipBtn').addEventListener('click', function() {
                if (isRegistered) {
                    window.location.href = './dashboard/';
                } else {
                    showToast('لطفاً ابتدا ثبت نام کنید.', 'error', 3000);
                }
            });

            if (webApp) {
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    webApp.close();
                });
            }

            initPage();
        })();
    </script>
</body>
</html>
