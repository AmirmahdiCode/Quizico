<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 40%, #e9d5ff 80%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .loader-letters {
            display: flex;
            gap: 6px;
            direction: ltr;
        }

        .letter {
            font-size: 42px;
            font-weight: 900;
            color: #a855f7;
            opacity: 0;
            transform: translateY(-40px) scale(0.5);
            animation: letterJump 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            font-family: 'IRANSans', Tahoma, sans-serif;
        }

        .letter:nth-child(1) { animation-delay: 0.1s; }
        .letter:nth-child(2) { animation-delay: 0.2s; }
        .letter:nth-child(3) { animation-delay: 0.3s; }
        .letter:nth-child(4) { animation-delay: 0.4s; }
        .letter:nth-child(5) { animation-delay: 0.5s; }
        .letter:nth-child(6) { animation-delay: 0.6s; }
        .letter:nth-child(7) { animation-delay: 0.7s; }

        @keyframes letterJump {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translateY(10px) scale(1.1);
            }
            70% {
                transform: translateY(-5px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .text {
            font-size: 15px;
            font-weight: 600;
            color: #4a4458;
            text-align: center;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInText 0.8s ease 1.2s forwards;
        }

        .text span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #6b7280;
            margin-top: 4px;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .letter {
                font-size: 32px;
            }
            .text {
                font-size: 13px;
            }
            .text span {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader-letters">
            <span class="letter">Q</span>
            <span class="letter">u</span>
            <span class="letter">i</span>
            <span class="letter">z</span>
            <span class="letter">i</span>
            <span class="letter">c</span>
            <span class="letter">o</span>
        </div>
        <div class="text">
            در حال ثبت اطلاعات کاربری
            <span>این عملیات فقط یکبار صورت می‌گیرد</span>
        </div>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                
                if (typeof user.id === 'number') {
                    return user.id.toString();
                }
                return String(user.id || '');
            }

            async function fetchData(action, params) {
                try {
                    var username = getUserId();
                    var initData = webApp?.initData || '';

                    var payload = {
                        action: action,
                        username: username,
                        initData: initData
                    };

                    if (params) {
                        for (var key in params) {
                            if (params.hasOwnProperty(key)) {
                                payload[key] = params[key];
                            }
                        }
                    }

                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'text/plain;charset=utf-8'
                        },
                        body: JSON.stringify(payload)
                    });

                    var result = await response.json();
                    return result;
                    
                } catch(e) {
                    console.error('Fetch error:', e);
                    return { ok: false, error: 'Network error: ' + e.message };
                }
            }

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                var user = getEitaaUser();
                var username = getUserId();

                if (!user || !username) {
                    setTimeout(function() {
                        var text = document.querySelector('.text');
                        text.innerHTML = 'لطفاً از داخل ایتا وارد شوید';
                        text.style.opacity = '1';
                        text.style.animation = 'none';
                    }, 1500);
                    return;
                }

                var fullName = (user.first_name || '') + ' ' + (user.last_name || '');

                try {
                    var check = await fetchData('getUser', {});

                    if (check.ok && check.data) {
                        setTimeout(function() {
                            window.location.href = './dashboard/';
                        }, 1000);
                        return;
                    }

                    var result = await fetchData('registerUser', {
                        name: fullName.trim() || 'کاربر'
                    });

                    if (result.ok) {
                        setTimeout(function() {
                            window.location.href = './dashboard/';
                        }, 1000);
                    } else {
                        var text = document.querySelector('.text');
                        text.innerHTML = 'خطا در ثبت اطلاعات: ' + (result.error || 'خطای ناشناخته');
                        text.style.opacity = '1';
                        text.style.animation = 'none';
                    }
                } catch(e) {
                    console.error('Init error:', e);
                    var text = document.querySelector('.text');
                    text.innerHTML = 'خطا در ارتباط با سرور';
                    text.style.opacity = '1';
                    text.style.animation = 'none';
                }
            }

            if (webApp) {
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    webApp.close();
                });
            }

            init();
        })();
    </script>

</body>
</html>
