<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: #faf5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 40%, #e9d5ff 80%);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #e9d5ff;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .text {
            font-size: 16px;
            font-weight: 600;
            color: #4a4458;
            text-align: center;
            line-height: 1.8;
        }

        .text span {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .loader { width: 40px; height: 40px; }
            .text { font-size: 14px; }
            .text span { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <div class="text">
            در حال ثبت اطلاعات کاربری
            <span>این عملیات فقط یکبار صورت می‌گیرد</span>
        </div>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbyq7XyujxE-U8mkDaVkCXl7egLp3P-UGw_3kLa4KYggKdK-zp6vDYN5mic3qKccmTrb1g/exec';
            var SECRET_KEY = 'QUIZICO_SECRET_KEY_2024';

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function generateSignature(username, initData) {
                var data = username + '|' + initData + '|' + SECRET_KEY;
                return CryptoJS.SHA256(data).toString(CryptoJS.enc.Hex);
            }

            async function fetchData(action, params) {
                try {
                    var initData = webApp?.initData || '';
                    var user = getEitaaUser();
                    var username = user ? String(user.id) : '';
                    var signature = generateSignature(username, initData);

                    var payload = {
                        action: action,
                        initData: initData,
                        signature: signature,
                        username: username
                    };

                    for (var key in params) {
                        if (params.hasOwnProperty(key)) {
                            payload[key] = params[key];
                        }
                    }

                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    return await response.json();
                } catch(e) {
                    return { ok: false, error: 'Network error' };
                }
            }

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                var user = getEitaaUser();

                if (!user) {
                    var text = document.querySelector('.text');
                    text.innerHTML = 'لطفاً از داخل ایتا وارد شوید';
                    return;
                }

                var username = String(user.id);
                var fullName = (user.first_name || '') + ' ' + (user.last_name || '');
                var initData = webApp?.initData || '';
                var signature = generateSignature(username, initData);

                try {
                    var check = await fetchData('getUser', {
                        username: username,
                        signature: signature,
                        initData: initData
                    });

                    if (check.ok && check.data) {
                        window.location.href = './dashboard/';
                        return;
                    }

                    var result = await fetchData('registerUser', {
                        username: username,
                        name: fullName.trim() || 'کاربر',
                        signature: signature,
                        initData: initData
                    });

                    if (result.ok) {
                        window.location.href = './dashboard/';
                    } else {
                        var text = document.querySelector('.text');
                        text.innerHTML = 'خطا در ثبت اطلاعات';
                    }
                } catch(e) {
                    var text = document.querySelector('.text');
                    text.innerHTML = 'خطا در ارتباط با سرور';
                }
            }

            if (webApp) {
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    webApp.close();
                });
            }

            init();
        })();
    </script>

</body>
</html>
