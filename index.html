<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
</head>
<body>
    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            const API_URL = 'https://script.google.com/macros/s/AKfycbwwLzjFTIApDGSOljaZKHw3BgcMeIMWn_SljVJL9yt-DfkGxcxxjgP7hTf6dyjMkuk6fQ/exec';
            
            async function fetchData(action, params = {}) {
                try {
                    const initData = webApp?.initData || '';
                    const payload = {
                        action: action,
                        initData: initData,
                        ...params
                    };
                    
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    return await response.json();
                } catch(e) {
                    return { ok: false, error: 'Network error' };
                }
            }
            
            function redirectToLastPage() {
                const validPages = ['dashboard', 'ranking', 'profile', 'setting'];
                const lastPage = localStorage.getItem('lastPage');
                const targetPage = validPages.includes(lastPage) ? lastPage : 'dashboard';
                window.location.href = `./${targetPage}/`;
            }
            
            async function initUser() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }
                
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    const user = webApp.initDataUnsafe.user;
                    const username = String(user.id);
                    
                    try {
                        const userData = await fetchData('getUser', { username: username });
                        
                        if (!userData.ok) {
                            const createResult = await fetchData('updateUser', {
                                username: username,
                                name: (user.first_name || '') + ' ' + (user.last_name || ''),
                                score: 0,
                                coins: 0,
                                diamonds: 0,
                                stats: '{}',
                                status: 'active'
                            });
                            
                            if (!createResult.ok) {
                                console.error('Failed to create user:', createResult);
                            } else {
                                console.log('User created successfully');
                            }
                        } else {
                            console.log('User found:', userData.data);
                        }
                    } catch(e) {
                        console.error('Error during user check:', e);
                    }
                } else {
                    console.warn('No user data from SDK');
                }
                
                redirectToLastPage();
            }
            
            initUser();
        })();
    </script>
</body>
</html>
