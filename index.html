<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: #faf5ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 40%, #e9d5ff 80%);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #e9d5ff;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .text {
            font-size: 16px;
            font-weight: 600;
            color: #4a4458;
            text-align: center;
            line-height: 1.8;
        }

        .text span {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .loader { width: 40px; height: 40px; }
            .text { font-size: 14px; }
            .text span { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <div class="text">
            در حال ثبت اطلاعات کاربری
            <span>این عملیات فقط یکبار صورت می‌گیرد</span>
        </div>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                
                if (typeof user.id === 'number') {
                    return user.id.toString();
                }
                return String(user.id || '');
            }

            async function fetchData(action, params) {
                try {
                    var username = getUserId();
                    var initData = webApp?.initData || '';

                    var payload = {
                        action: action,
                        username: username,
                        initData: initData
                    };

                    if (params) {
                        for (var key in params) {
                            if (params.hasOwnProperty(key)) {
                                payload[key] = params[key];
                            }
                        }
                    }

                    console.log('Username:', username);
                    console.log('Sending payload:', payload);

                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'text/plain;charset=utf-8'
                        },
                        body: JSON.stringify(payload)
                    });

                    var result = await response.json();
                    console.log('Response:', result);
                    return result;
                    
                } catch(e) {
                    console.error('Fetch error:', e);
                    return { ok: false, error: 'Network error: ' + e.message };
                }
            }

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                var user = getEitaaUser();
                var username = getUserId();

                if (!user || !username) {
                    var text = document.querySelector('.text');
                    text.innerHTML = 'لطفاً از داخل ایتا وارد شوید';
                    return;
                }

                var fullName = (user.first_name || '') + ' ' + (user.last_name || '');

                try {
                    var check = await fetchData('getUser', {});
                    
                    console.log('Check result:', check);

                    if (check.ok && check.data) {
                        window.location.href = './dashboard/';
                        return;
                    }

                    var result = await fetchData('registerUser', {
                        name: fullName.trim() || 'کاربر'
                    });

                    console.log('Register result:', result);

                    if (result.ok) {
                        window.location.href = './dashboard/';
                    } else {
                        var text = document.querySelector('.text');
                        text.innerHTML = 'خطا در ثبت اطلاعات: ' + (result.error || 'خطای ناشناخته');
                    }
                } catch(e) {
                    console.error('Init error:', e);
                    var text = document.querySelector('.text');
                    text.innerHTML = 'خطا در ارتباط با سرور';
                }
            }

            if (webApp) {
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    webApp.close();
                });
            }

            init();
        })();
    </script>

</body>
</html>
