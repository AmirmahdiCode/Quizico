<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .header {
            background: var(--header-bg);
            box-shadow: 0 2px 0 #000000;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #000000;
            transition: all 0.5s ease;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            padding: 2px;
            border: 1px solid #000000;
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .header-logo:hover {
            transform: rotate(5deg) scale(1.05);
        }

        .header-logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--dark);
            transition: color 0.5s ease;
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            transition: color 0.5s ease;
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 0 12px 80px;
        }

        .loader-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #000000;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .profile-content {
            display: none;
        }

        .profile-content.show {
            display: block;
        }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 4px 4px 0 #000000;
            animation: fadeInUp 0.5s ease backwards;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            font-size: 24px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-username {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            direction: ltr;
            text-align: right;
        }

        .profile-badges {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 9px;
            color: #ffffff;
            font-weight: 600;
        }

        .badge i {
            font-size: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 3px 3px 0 #000000;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: fadeInUp 0.5s ease backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 4px 4px 0 #000000;
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 6px;
            color: var(--primary);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-light);
            font-weight: 600;
        }

        .league-card {
            background: var(--card-bg);
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 3px 3px 0 #000000;
            animation: fadeInUp 0.5s ease 0.25s backwards;
        }

        .league-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-title i {
            color: var(--primary);
        }

        .league-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .league-item {
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #000000;
            background: var(--bg2);
        }

        .league-item.win {
            background: #10b981;
            color: #ffffff;
        }

        .league-item.draw {
            background: #f59e0b;
            color: #ffffff;
        }

        .league-item.loss {
            background: #ef4444;
            color: #ffffff;
        }

        .league-item-value {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }

        .league-item-label {
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            display: block;
        }

        .chart-card {
            background: var(--card-bg);
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 3px 3px 0 #000000;
            animation: fadeInUp 0.5s ease 0.3s backwards;
        }

        .chart-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title i {
            color: var(--primary);
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            height: 120px;
            padding: 8px;
        }

        .chart-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 70px;
        }

        .chart-bar {
            width: 100%;
            border-radius: 4px;
            border: 2px solid #000000;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: barGrow 1s ease backwards;
            min-height: 8px;
        }

        .chart-bar.win {
            background: #10b981;
            animation-delay: 0.3s;
        }

        .chart-bar.draw {
            background: #f59e0b;
            animation-delay: 0.4s;
        }

        .chart-bar.loss {
            background: #ef4444;
            animation-delay: 0.5s;
        }

        @keyframes barGrow {
            from { height: 0; }
        }

        .chart-bar-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--dark);
        }

        .chart-bar-value {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
        }

        .games-history-card {
            background: var(--card-bg);
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 14px;
            box-shadow: 3px 3px 0 #000000;
            animation: fadeInUp 0.5s ease 0.35s backwards;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border: 1px solid #000000;
            border-radius: 4px;
            background: var(--bg2);
            transition: all 0.3s ease;
        }

        .game-item:hover {
            transform: translateX(-3px);
        }

        .game-players {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--dark);
        }

        .game-score {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #000000;
        }

        .game-score.win {
            background: #10b981;
            color: #ffffff;
        }

        .game-score.loss {
            background: #ef4444;
            color: #ffffff;
        }

        .game-score.draw {
            background: #f59e0b;
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 11px;
        }

        .empty-state i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-light);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            animation: navBounce 0.5s ease;
        }

        @keyframes navBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .nav-item:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/r102593_InShot_20260817_115945628.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">پروفایل من</div>
                    <div class="header-subtitle">Quizico</div>

    <main class="main-container">

        <div class="profile-content" id="profileContent">

        <a href="../ranking/" class="nav-item" onclick="savePage('ranking')">

            <span>رتبه بندی</span>
        </a>
        <a href="../profile/" class="nav-item active" onclick="savePage('profile')">
            <i class="fa-solid fa-user"></i>
            <span>پروفایل من</span>
        </a>

        </a>
    </nav>

    <script>
        (function() {
            const webApp = window.Eitaa?.WebApp;
            const API_URL = 'https://script.google.com/macros/s/AKfycbx34bNcwqg5JHqOI6DFbV41d-w0yjdS76kuemQYZcCpuNQqFoMWM7ipFF7zxJFG0EW6-w/exec';
            
            function savePage(page) {
                localStorage.setItem('lastPage', page);
            }

            function getSettings() {
                return JSON.parse(localStorage.getItem('quizicoSettings') || '{}');
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                const rgb = hexToRgb(color);
                const r = Math.max(0, Math.min(255, rgb.r + percent));
                const g = Math.max(0, Math.min(255, rgb.g + percent));
                const b = Math.max(0, Math.min(255, rgb.b + percent));
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
            }

            function applyTheme() {
                const mode = localStorage.getItem('themeMode') || 'auto';
                let theme;
                
                if (mode === 'auto') {
                    theme = webApp ? (webApp.colorScheme || 'light') : 'light';
                } else {
                    theme = mode;
                }
                
                document.documentElement.setAttribute('data-theme', theme);
                
                if (theme === 'dark') {
                    document.documentElement.style.setProperty('--bg', '#1e1b2e');
                    document.documentElement.style.setProperty('--bg2', '#2d2a3e');
                    document.documentElement.style.setProperty('--bg3', '#3d3a4e');
                    document.documentElement.style.setProperty('--primary', '#c084fc');
                    document.documentElement.style.setProperty('--primary-dark', '#a855f7');
                    document.documentElement.style.setProperty('--primary-light', '#d8b4fe');
                    document.documentElement.style.setProperty('--primary-rgb', '192, 132, 252');
                    document.documentElement.style.setProperty('--dark', '#f1f5f9');
                    document.documentElement.style.setProperty('--text', '#cbd5e1');
                    document.documentElement.style.setProperty('--text-light', '#94a3b8');
                    document.documentElement.style.setProperty('--card-bg', '#2d2a3e');
                    document.documentElement.style.setProperty('--header-bg', '#2d2a3e');
                } else {
                    document.documentElement.style.setProperty('--bg', '#faf5ff');
                    document.documentElement.style.setProperty('--bg2', '#f3e8ff');
                    document.documentElement.style.setProperty('--bg3', '#e9d5ff');
                    document.documentElement.style.setProperty('--primary', getSettings().primaryColor || '#a855f7');
                    document.documentElement.style.setProperty('--primary-dark', shadeColor(getSettings().primaryColor || '#a855f7', -30));
                    document.documentElement.style.setProperty('--primary-light', shadeColor(getSettings().primaryColor || '#a855f7', 30));
                    document.documentElement.style.setProperty('--primary-rgb', `${hexToRgb(getSettings().primaryColor || '#a855f7').r}, ${hexToRgb(getSettings().primaryColor || '#a855f7').g}, ${hexToRgb(getSettings().primaryColor || '#a855f7').b}`);
                    document.documentElement.style.setProperty('--dark', '#1e1b2e');
                    document.documentElement.style.setProperty('--text', '#4a4458');
                    document.documentElement.style.setProperty('--text-light', '#6b7280');
                    document.documentElement.style.setProperty('--card-bg', '#ffffff');
                    document.documentElement.style.setProperty('--header-bg', '#ffffff');
                }
                
                if (webApp) {
                    webApp.setHeaderColor('bg_color');
                    webApp.setBackgroundColor('bg_color');
                }
            }

            function applySettings() {
                const settings = getSettings();
                
                if (settings.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                }
                
                applyTheme();
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            async function fetchData(action, params = {}) {
                try {

            function updateCharts(wins, draws, losses) {
                const total = wins + draws + losses;
                if (total === 0) return;
                
                const maxVal = Math.max(wins, draws, losses);
                const maxHeight = 90;
                
                const winHeight = (wins / maxVal) * maxHeight;
                const drawHeight = (draws / maxVal) * maxHeight;
                const lossHeight = (losses / maxVal) * maxHeight;
                
                const winBar = document.getElementById('winBar');
                const drawBar = document.getElementById('drawBar');
                const lossBar = document.getElementById('lossBar');
                
                winBar.style.height = Math.max(winHeight, 8) + 'px';
                drawBar.style.height = Math.max(drawHeight, 8) + 'px';
                lossBar.style.height = Math.max(lossHeight, 8) + 'px';
                
                document.getElementById('winBarValue').textContent = wins;
                document.getElementById('drawBarValue').textContent = draws;
                document.getElementById('lossBarValue').textContent = losses;
            }

            async function loadProfile() {
                const user = getEitaaUser();
                
                if (user) {
                    const fullName = (user.first_name || '') + ' ' + (user.last_name || '');
                    document.getElementById('profileName').textContent = fullName.trim() || 'کاربر';
                    document.getElementById('profileUsername').textContent = 'ID: ' + user.id;
                }
                
                const username = String(user ? user.id : '');
                
                const [userData, leagueData, gamesData] = await Promise.all([
                    fetchData('getUser', { username: username }),
                    fetchData('getLeague', { username: username }),
                    fetchData('getGamesByPlayer', { username: username })
                ]);
                
                if (userData.success) {
                    const data = userData.data;
                    document.getElementById('totalScore').textContent = data.score || 0;
                    document.getElementById('coinsValue').textContent = data.coins || 0;
                    document.getElementById('diamondsValue').textContent = data.diamonds || 0;
                }
                
                let wins = 0, draws = 0, losses = 0;
                
                if (leagueData.success) {
                    wins = leagueData.data.wins || 0;
                    draws = leagueData.data.draws || 0;
                    losses = leagueData.data.losses || 0;
                    
                    document.getElementById('winsCount').textContent = wins;
                    document.getElementById('drawsCount').textContent = draws;
                    document.getElementById('lossesCount').textContent = losses;
                    
                    updateCharts(wins, draws, losses);
                    
                    const totalLeague = wins + draws + losses;
                    const winRate = totalLeague > 0 ? Math.round((wins / totalLeague) * 100) : 0;
                    document.getElementById('winRate').textContent = winRate + '%';
                }
                
                if (gamesData.success) {
                    const games = gamesData.data;
                    document.getElementById('totalGames').textContent = games.length;
                    
                    const gamesList = document.getElementById('gamesList');
                    
                    if (games.length === 0) {
                        gamesList.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-gamepad"></i>
                                <p>مسابقه‌ای یافت نشد</p>
                            </div>
                        `;
                    } else {
                        gamesList.innerHTML = games.slice(0, 10).reverse().map(game => {
                            const isPlayer1 = game.player1 === username;
                            const opponent = isPlayer1 ? game.player2 : game.player1;
                            
                            let result = 'draw';
                            let resultText = 'مساوی';
                            let resultClass = 'draw';
                            
                            if (game.status === 'finished') {
                                if (isPlayer1) {
                                    if (game.player1Score > game.player2Score) {
                                        result = 'win';
                                        resultText = 'برد';
                                        resultClass = 'win';
                                    } else if (game.player1Score < game.player2Score) {
                                        result = 'loss';
                                        resultText = 'باخت';
                                        resultClass = 'loss';
                                    }
                                } else {
                                    if (game.player2Score > game.player1Score) {
                                        result = 'win';
                                        resultText = 'برد';
                                        resultClass = 'win';
                                    } else if (game.player2Score < game.player1Score) {
                                        result = 'loss';
                                        resultText = 'باخت';
                                        resultClass = 'loss';
                                    }
                                }
                            }
                            
                            return `
                                <div class="game-item">
                                    <div class="game-players">
                                        <i class="fa-solid fa-user"></i>
                                        <span>${opponent || 'ناشناس'}</span>
                                    </div>
                                    <span class="game-score ${resultClass}">${resultText}</span>
                                </div>
                            `;
                        }).join('');
                    }
                }
                
                document.getElementById('loaderWrapper').style.display = 'none';
                document.getElementById('profileContent').classList.add('show');
            }

            if (webApp) {
                webApp.ready();
                
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    window.location.href = '../dashboard/';
                });
                
                webApp.onEvent('themeChanged', function() {
                    const mode = localStorage.getItem('themeMode') || 'auto';
                    if (mode === 'auto') {
                        applyTheme();
                    }
                });
            }

            applySettings();
            loadProfile();
        })();
    </script>
