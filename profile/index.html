<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #475569;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img { width: 95%; height: 95%; object-fit: contain; transform: scale(1.1); }
        .header-title { font-size: 16px; font-weight: 800; color: var(--dark); }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 12px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { font-size: 12px; font-weight: 700; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-content { display: none; }
        .profile-content.show { display: flex; flex-direction: column; gap: 12px; }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .profile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

        .profile-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .profile-avatar:active { transform: scale(0.95); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-info { flex: 1; min-width: 0; }
        .profile-name { font-size: 14px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-username { font-size: 9px; color: rgba(255,255,255,0.7); direction: ltr; text-align: right; }

        .profile-badges { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }
        .badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .stat-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-icon { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 800; color: var(--dark); }
        .stat-label { font-size: 8px; color: var(--text-light); }

        .progress-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .progress-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .progress-title i { color: var(--primary); }
        .progress-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 15px;
            height: 18px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 15px;
            transition: width 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 0%;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            font-size: 8px;
            font-weight: 800;
            color: #fff;
        }

        .league-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .league-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .league-title i { color: var(--primary); }
        .league-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .league-item { text-align: center; padding: 10px; border-radius: 8px; border: var(--border); background: var(--bg2); }
        .league-item.win { background: #10b981; color: #fff; }
        .league-item.draw { background: #f59e0b; color: #fff; }
        .league-item.loss { background: #ef4444; color: #fff; }
        .league-item-value { font-size: 16px; font-weight: 800; display: block; }
        .league-item-label { font-size: 8px; }

        .achievements-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .achievements-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .achievements-title i { color: var(--primary); }
        .achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .achievement-item { text-align: center; padding: 8px 4px; border: var(--border); border-radius: 8px; background: var(--bg2); }
        .achievement-icon { font-size: 20px; display: block; margin-bottom: 3px; }
        .achievement-name { font-size: 7px; font-weight: 700; color: var(--dark); }
        .achievement-item.locked { opacity: 0.3; filter: grayscale(1); }

        .games-history-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .games-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .game-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: var(--border); border-radius: 8px; background: var(--bg2); }
        .game-players { font-size: 9px; font-weight: 700; color: var(--dark); }
        .game-score { font-size: 9px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: var(--border); }
        .game-score.win { background: #10b981; color: #fff; }
        .game-score.loss { background: #ef4444; color: #fff; }
        .game-score.draw { background: #f59e0b; color: #fff; }

        .empty-state { text-align: center; padding: 14px; color: var(--text-light); font-size: 10px; }
        .empty-state img { width: 50px; height: 50px; object-fit: contain; margin: 0 auto 6px; display: block; }

        .avatar-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .avatar-modal-overlay.show { display: flex; }
        .avatar-modal {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 5px 5px 0 #000;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .avatar-modal-close {
            position: sticky;
            top: 0;
            float: left;
            width: 28px;
            height: 28px;
            border: var(--border);
            border-radius: 50%;
            background: var(--bg2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .avatar-modal-title { text-align: center; font-size: 14px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }

        .avatar-category { margin-bottom: 14px; }
        .avatar-category-title {
            font-size: 10px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .avatar-category-title .price-tag {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg2);
            border: var(--border);
            color: var(--dark);
        }
        .avatar-category-title .price-tag.free { background: #d1fae5; color: #059669; }

        .avatar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

        .avatar-item {
            text-align: center;
            padding: 8px 4px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .avatar-item:active { transform: scale(0.95); }
        .avatar-item.active { border-color: var(--gold); border-width: 2px; }
        .avatar-item.owned { border-color: #10b981; }
        .avatar-item-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 4px;
            background: #fff;
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary);
            overflow: hidden;
        }
        .avatar-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-item-price { font-size: 7px; font-weight: 700; color: var(--text-light); }
        .avatar-item-price.free { color: #059669; }
        .avatar-item-price.owned { color: #10b981; }

        .support-notification {
            position: fixed;
            top: 75px;
            right: 10px;
            left: 10px;
            max-width: 400px;
            margin: 0 auto;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: 5px 5px 0 #000;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            animation: slideDownNotif 0.5s ease forwards, slideUpNotif 0.5s ease 4.5s forwards;
            cursor: pointer;
        }
        .support-notification img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: var(--border);
            object-fit: cover;
        }
        .support-notification .notif-info { flex: 1; }
        .support-notification .notif-name { font-size: 10px; font-weight: 800; color: var(--dark); }
        .support-notification .notif-desc { font-size: 8px; color: var(--text-light); }
        .support-notification i { color: var(--text-light); font-size: 10px; }

        @keyframes slideDownNotif {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUpNotif {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; right: 0; left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            padding: 4px 12px;
            font-family: inherit;
            background: none;
            border: none;
            font-size: 12px;
        }
        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        @media (max-width: 480px) {
            .avatar-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle" data-i18n="profile">پروفایل</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text" data-i18n="loading">در حال دریافت...</div>
        </div>

        <div class="profile-content" id="profileContent">

            <div class="profile-header-card">
                <div class="profile-top">
                    <div class="profile-avatar" id="profileAvatar" onclick="openAvatarModal()">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName"></div>
                        <div class="profile-username" id="profileUsername"></div>
                    </div>
                </div>
                <div class="profile-badges">
                    <span class="badge"><i class="fa-solid fa-coins"></i> <span id="coinsValue">0</span> <span data-i18n="coins">سکه</span></span>
                    <span class="badge"><i class="fa-solid fa-gem"></i> <span id="diamondsValue">0</span> <span data-i18n="diamonds">الماس</span></span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-star"></i></div><div class="stat-value" id="totalScore">0</div><div class="stat-label" data-i18n="total_score">امتیاز کل</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-gamepad"></i></div><div class="stat-value" id="totalGames">0</div><div class="stat-label" data-i18n="total_games">تعداد بازی</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div><div class="stat-value" id="winRate">0%</div><div class="stat-label" data-i18n="win_rate">درصد برد</div></div>
            </div>

            <div class="progress-card">
                <div class="progress-title"><i class="fa-solid fa-ranking-star"></i> <span data-i18n="next_rank">پیشرفت به رتبه بعدی</span></div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>

            <div class="league-card">
                <div class="league-title"><i class="fa-solid fa-trophy"></i> <span data-i18n="league_stats">آمار لیگ</span></div>
                <div class="league-stats">
                    <div class="league-item win"><span class="league-item-value" id="winsCount">0</span><span class="league-item-label" data-i18n="wins">برد</span></div>
                    <div class="league-item draw"><span class="league-item-value" id="drawsCount">0</span><span class="league-item-label" data-i18n="draws">مساوی</span></div>
                    <div class="league-item loss"><span class="league-item-value" id="lossesCount">0</span><span class="league-item-label" data-i18n="losses">باخت</span></div>
                </div>
            </div>

            <div class="achievements-card">
                <div class="achievements-title"><i class="fa-solid fa-award"></i> <span data-i18n="achievements">افتخارات</span></div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="games-history-card">
                <div class="achievements-title"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="history">تاریخچه بازی‌ها</span></div>
                <div class="games-list" id="gamesList"></div>
            </div>

        </div>
    </main>

    <div class="avatar-modal-overlay" id="avatarModalOverlay">
        <div class="avatar-modal">
            <div class="avatar-modal-close" onclick="closeAvatarModal()"><i class="fa-solid fa-xmark"></i></div>
            <div class="avatar-modal-title" data-i18n="choose_avatar">انتخاب آواتار</div>
            <div id="avatarCategories"></div>
        </div>
    </div>

    <div class="support-notification" id="supportNotification" onclick="openSupportLink()">
        <img src="https://cdn.imgurl.ir/uploads/v68396_InShot_20260817_190450653.jpg" alt="سازنده">
        <div class="notif-info">
            <div class="notif-name">امیرمهدی | Amirmahdi</div>
            <div class="notif-desc" data-i18n="support">از سازنده حمایت کنید</div>
        </div>
        <i class="fa-solid fa-chevron-left"></i>
    </div>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="home">خانه</span></a>
        <a href="../ranking/" class="nav-item"><i class="fa-solid fa-trophy"></i><span data-i18n="ranking">رتبه</span></a>
        <a href="../profile/" class="nav-item active"><i class="fa-solid fa-user"></i><span data-i18n="profile_nav">پروفایل</span></a>
        <a href="../setting/" class="nav-item"><i class="fa-solid fa-gear"></i><span data-i18n="settings">تنظیمات</span></a>
    </nav>

    <script>

            var webApp = window.Eitaa?.WebApp;

            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';
            var userDiamonds = 0;

            var translations = {

                    next_rank: 'پیشرفت به رتبه بعدی', league_stats: 'آمار لیگ',
                    wins: 'برد', draws: 'مساوی', losses: 'باخت',
                    achievements: 'افتخارات', history: 'تاریخچه بازی‌ها',
                    home: 'خانه', ranking: 'رتبه', profile_nav: 'پروفایل', settings: 'تنظیمات',
                    no_games: 'مسابقه‌ای یافت نشد', choose_avatar: 'انتخاب آواتار',
                    icons: 'آیکون‌ها', boys: 'پسر بچه', girls: 'دختر بچه',
                    free: 'رایگان', diamonds_short: 'الماس',
                    not_enough_diamonds: 'الماس کافی نداری!', avatar_purchased: 'آواتار خریداری شد!',
                    owned: 'خریداری شده', support: 'از سازنده حمایت کنید'

                en: {

                    wins: 'Wins', draws: 'Draws', losses: 'Losses',

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.primaryColor) p.primaryColor = '#a855f7';
                    if (p.animation === undefined) p.animation = true;
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' }; }
            }

            function getTranslation(k) { var t = translations[currentLang] || translations.fa; return t[k] || translations.fa[k] || k; }

            function hexToRgb(h) { var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:168,g:85,b:247 }; }
            function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1);}

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var p = s.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'dark') { document.documentElement.style.setProperty('--primary', shadeColor(p, 40)); }
                else { document.documentElement.style.setProperty('--primary', p); }
                if (s.animation === false) { document.documentElement.setAttribute('data-animation', 'off'); }
                else { document.documentElement.removeAttribute('data-animation'); }
                if (currentLang === 'en') { document.documentElement.setAttribute('dir','ltr'); document.body.style.fontFamily='Arial, sans-serif'; }
                else if (currentLang === 'ar') { document.documentElement.setAttribute('dir','rtl'); document.body.style.fontFamily='Tahoma, sans-serif'; }
                else { document.documentElement.setAttribute('dir','rtl'); document.body.style.fontFamily="'IRANSans', Tahoma, sans-serif"; }
                document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); var t2=translations[currentLang]||translations.fa; if(t2[k]) el.textContent=t2[k]; });
            }

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }

            function animateCount(el,target,dur){
                var st=0,stt=null;
                function step(ts){if(!stt)stt=ts;var p=Math.min((ts-stt)/dur,1);var e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*target);if(p<1)requestAnimationFrame(step);else el.textContent=target;}
                requestAnimationFrame(step);
            }

            function renderEmpty(text){ return '<div class="empty-state"><img src="'+SAD_IMAGE+'" alt=""><p>'+text+'</p></div>'; }

            function isAvatarOwned(itemId) {
                try {
                    var owned = JSON.parse(localStorage.getItem('ownedAvatars') || '[]');
                    return owned.indexOf(itemId) !== -1;
                } catch(e) { return false; }
            }

            function renderAchievements(data) {
                var grid = document.getElementById('achievementsGrid');
                var stats = {};
                try { stats = JSON.parse(data.stats || '{}'); } catch(e) {}
                var earned = stats.achievements || [];
                var score = data.score || 0;
                var games = stats.games || 0;
                var wins = stats.wins || 0;
                if (games >= 1) earned.push('first_game');
                if (games >= 10) earned.push('10_games');
                if (games >= 100) earned.push('100_games');
                if (games >= 1000) earned.push('1000_games');
                if (wins >= 1) earned.push('first_win');
                if (wins >= 10) earned.push('10_wins');
                if (wins >= 100) earned.push('100_wins');
                if (wins >= 1000) earned.push('1000_wins');
                if (score >= 100) earned.push('100_score');
                if (score >= 1000) earned.push('1000_score');
                if (score >= 10000) earned.push('10000_score');
                if (score >= 100000) earned.push('100000_score');
                var uniqueEarned = [];
                earned.forEach(function(e){ if(uniqueEarned.indexOf(e)===-1) uniqueEarned.push(e); });
                grid.innerHTML = allAchievements.map(function(a){
                    var unlocked = uniqueEarned.indexOf(a.id) !== -1;
                    return '<div class="achievement-item'+(unlocked?'':' locked')+'"><span class="achievement-icon">'+a.icon+'</span><span class="achievement-name">'+a.name+'</span></div>';
                }).join('');
            }

            function renderAvatarModal() {
                var html = '';
                avatarCategories.forEach(function(cat) {
                    var label = getTranslation(cat.labelKey);
                    var priceText = cat.price === 0 ? getTranslation('free') : cat.price + ' ' + getTranslation('diamonds_short');
                    var priceClass = cat.price === 0 ? ' free' : '';
                    html += '<div class="avatar-category">';
                    html += '<div class="avatar-category-title">'+label+' <span class="price-tag'+priceClass+'">'+priceText+'</span></div>';
                    html += '<div class="avatar-grid">';
                    cat.items.forEach(function(item) {
                        var isActive = currentAvatar === item.id;
                        var isOwned = isAvatarOwned(item.id);
                        var imgHtml;
                        if (item.icon) {
                            imgHtml = '<i class="fa-solid '+item.icon+'"></i>';
                        } else {
                            imgHtml = '<img src="'+item.url+'" alt="">';
                        }
                        var priceHtml;
                        if (cat.price === 0 || isOwned) {
                            priceHtml = '<span class="avatar-item-price owned">'+(cat.price===0?getTranslation('free'):getTranslation('owned'))+'</span>';
                        } else {
                            priceHtml = '<span class="avatar-item-price">'+cat.price+' 💎</span>';
                        }
                        html += '<div class="avatar-item'+(isActive?' active':'')+(isOwned?' owned':'')+'" onclick="selectAvatar(\''+cat.id+'\',\''+item.id+'\','+cat.price+')">';
                        html += '<div class="avatar-item-img">'+imgHtml+'</div>';
                        html += priceHtml;
                        html += '</div>';
                    });
                    html += '</div></div>';
                });
                document.getElementById('avatarCategories').innerHTML = html;
            }

            function openAvatarModal() {
                renderAvatarModal();
                document.getElementById('avatarModalOverlay').classList.add('show');
            }
            function closeAvatarModal() {
                document.getElementById('avatarModalOverlay').classList.remove('show');
            }
            window.openAvatarModal = openAvatarModal;
            window.closeAvatarModal = closeAvatarModal;

            window.selectAvatar = function(catId, itemId, price) {
                var owned = isAvatarOwned(itemId);
                
                if (price === 0 || owned) {
                    currentAvatar = itemId;
                    fetchData('updateUser', { avatar: itemId });
                    renderAvatarModal();
                    updateProfileAvatar();
                    return;
                }
                
                if (userDiamonds < price) {
                    if (webApp) webApp.showAlert(getTranslation('not_enough_diamonds'));
                    return;
                }
                
                userDiamonds -= price;
                document.getElementById('diamondsValue').textContent = userDiamonds;
                fetchData('updateUser', { diamonds: userDiamonds });
                
                var ownedAvatars = [];
                try { ownedAvatars = JSON.parse(localStorage.getItem('ownedAvatars') || '[]'); } catch(e) {}
                if (ownedAvatars.indexOf(itemId) === -1) {
                    ownedAvatars.push(itemId);
                    localStorage.setItem('ownedAvatars', JSON.stringify(ownedAvatars));
                }
                
                currentAvatar = itemId;
                fetchData('updateUser', { avatar: itemId });
                renderAvatarModal();
                updateProfileAvatar();
                if (webApp) webApp.showAlert(getTranslation('avatar_purchased'));
            };

            function updateProfileAvatar() {
                var avatarEl = document.getElementById('profileAvatar');
                var found = null;
                avatarCategories.forEach(function(cat) {
                    cat.items.forEach(function(item) {
                        if (item.id === currentAvatar) found = { cat: cat, item: item };
                    });
                });
                if (found) {
                    if (found.item.icon) {
                        avatarEl.innerHTML = '<i class="fa-solid '+found.item.icon+'"></i>';
                    } else {
                        avatarEl.innerHTML = '<img src="'+found.item.url+'" alt="">';
                    }
                } else {
                    avatarEl.innerHTML = '<i class="fa-solid fa-user"></i>';
                }
            }

            function openSupportLink(){
                if (webApp && webApp.openEitaaLink) {
                    webApp.openEitaaLink('https://eitaa.com/Amirmahdi_code');
                } else {
                    window.open('https://eitaa.com/Amirmahdi_code', '_blank');
                }
            }
            window.openSupportLink = openSupportLink;

            async function loadProfile() {
                try {
                    var user = getEitaaUser();
                    var username = getUserId();
                    if (user) {
                        var fullName = (user.first_name||'')+' '+(user.last_name||'');
                        document.getElementById('profileName').textContent = fullName.trim() || 'کاربر';
                        document.getElementById('profileUsername').textContent = 'ID: '+username;
                    }
                    var userData = await fetchData('getUser', {});
                    if (userData.ok && userData.data) {
                        var d = userData.data;
                        userDiamonds = d.diamonds || 0;
                        currentAvatar = d.avatar || 'default';
                        animateCount(document.getElementById('totalScore'), d.score||0, 800);
                        animateCount(document.getElementById('coinsValue'), d.coins||0, 800);
                        animateCount(document.getElementById('diamondsValue'), userDiamonds, 800);
                        renderAchievements(d);
                        updateProfileAvatar();
                    }
                    var league = await fetchData('getLeague', {});
                    var wins=0,draws=0,losses=0;
                    if (league.ok && league.data) {
                        wins = league.data.wins||0;
                        draws = league.data.draws||0;
                        losses = league.data.losses||0;
                    }
                    animateCount(document.getElementById('winsCount'), wins, 600);
                    animateCount(document.getElementById('drawsCount'), draws, 600);
                    animateCount(document.getElementById('lossesCount'), losses, 600);
                    var total = wins+draws+losses;
                    var rate = total>0 ? Math.round(wins/total*100) : 0;
                    document.getElementById('winRate').textContent = rate+'%';

                    var games = await fetchData('getGamesByPlayer', {});
                    if (games.ok && Array.isArray(games.data)) {
                        animateCount(document.getElementById('totalGames'), games.data.length, 600);
                        var list = document.getElementById('gamesList');
                        if (games.data.length === 0) {
                            list.innerHTML = renderEmpty(getTranslation('no_games'));
                        } else {
                            list.innerHTML = games.data.slice(0,10).map(function(g){
                                var isP1 = String(g.player1) === String(username);
                                var opp = isP1 ? g.player2 : g.player1;
                                var cls = 'draw', txt = getTranslation('draws');
                                if (g.status === 'finished') { if (isP1) { cls='win'; txt=getTranslation('wins'); } else { cls='loss'; txt=getTranslation('losses'); } }
                                return '<div class="game-item"><span class="game-players">'+(opp||'?')+'</span><span class="game-score '+cls+'">'+txt+'</span></div>';
                            }).join('');
                        }
                    }

                    var leaderboardData = await fetchData('leaderboard', { limit: 100 });
                    if (leaderboardData.ok && Array.isArray(leaderboardData.data)) {
                        var list = leaderboardData.data;
                        var myRank = null, myScore = 0;
                        for (var i = 0; i < list.length; i++) {
                            if (String(list[i].username) === String(username)) { myRank = i+1; myScore = list[i].score||0; break; }
                        }
                        var prog = 0;
                        if (myRank === 1) { prog = 100; }
                        else if (myRank && myRank > 1) {
                            var nextScore = list[myRank-2].score || 0;
                            if (nextScore > 0) { prog = Math.round((myScore/nextScore)*100); if (prog>100) prog=100; }
                        }
                        setTimeout(function() {
                            document.getElementById('progressFill').style.width = prog+'%';
                            document.getElementById('progressText').textContent = prog+'%';
                        }, 400);
                    }

                } catch(e) { console.error(e); }
                finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('profileContent').classList.add('show');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function(){ window.location.href = '../dashboard/'; });
            }

            applyTheme();
            loadProfile();
            
            setTimeout(function() {
                var notif = document.getElementById('supportNotification');
                if (notif) {
                    notif.style.display = 'none';
                }
            }, 5000);
        })();
