function getSettings(){try{var raw=localStorage.getItem('quizicoSettings');if(!raw)return{theme:'light',primaryColor:'#a855f7',animation:true,language:'fa'};var p=JSON.parse(raw);if(!p.theme)p.theme='light';if(!p.primaryColor)p.primaryColor='#a855f7';if(p.animation===undefined)p.animation=true;if(!p.language)p.language='fa';return p;}catch(e){return{theme:'light',primaryColor:'#a855f7',animation:true,language:'fa'}}}
function getTranslation(k){var t=translations[currentLang]||translations.fa;return t[k]||translations.fa[k]||k}
function hexToRgb(h){var r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:168,g:85,b:247}}
function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1)}
function applyTheme(){var s=getSettings();currentLang=s.language||'fa';var t=s.theme||'light';var p=s.primaryColor||'#a855f7';document.documentElement.setAttribute('data-theme',t);if(t==='dark'){document.documentElement.style.setProperty('--primary',shadeColor(p,40));}else{document.documentElement.style.setProperty('--primary',p);}if(s.animation===false){document.documentElement.setAttribute('data-animation','off');}else{document.documentElement.removeAttribute('data-animation');}if(currentLang==='en'){document.documentElement.setAttribute('dir','ltr');document.body.style.fontFamily='Arial, sans-serif';}else if(currentLang==='ar'){document.documentElement.setAttribute('dir','rtl');document.body.style.fontFamily='Tahoma, sans-serif';}else{document.documentElement.setAttribute('dir','rtl');document.body.style.fontFamily="'IRANSans', Tahoma, sans-serif";}document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');var t2=translations[currentLang]||translations.fa;if(t2[k])el.textContent=t2[k];});}
function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null}
function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):''}
function fetchData(action,params){var payload={action:action,username:getUserId()};if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});}
function animateCount(el,target,dur){var st=0,stt=null;function step(ts){if(!stt)stt=ts;var p=Math.min((ts-stt)/dur,1);var e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*target);if(p<1)requestAnimationFrame(step);else el.textContent=target;}requestAnimationFrame(step);}

async function getPlayerInfo(userId){var result=await fetchData('getUser',{username:userId});if(result.ok&&result.data){return{name:result.data.name||userId,avatar:result.data.avatar||'default'};}return{name:userId,avatar:'default'};}
function isAvatarOwned(itemId){try{var owned=JSON.parse(localStorage.getItem('ownedAvatars')||'[]');return owned.indexOf(itemId)!==-1;}catch(e){return false;}}
function renderAchievements(gamesCount,winsCount,score){
var grid=document.getElementById('achievementsGrid');
var earned=[];
if(gamesCount>=1)earned.push('first_game');
if(gamesCount>=10)earned.push('10_games');
if(gamesCount>=100)earned.push('100_games');
if(gamesCount>=1000)earned.push('1000_games');
if(winsCount>=1)earned.push('first_win');
if(winsCount>=10)earned.push('10_wins');
if(winsCount>=100)earned.push('100_wins');
if(winsCount>=1000)earned.push('1000_wins');
if(score>=100)earned.push('100_score');
if(score>=1000)earned.push('1000_score');
if(score>=10000)earned.push('10000_score');
if(score>=100000)earned.push('100000_score');
grid.innerHTML=allAchievements.map(function(a){var unlocked=earned.indexOf(a.id)!==-1;return '<div class="achievement-item'+(unlocked?'':' locked')+'"><span class="achievement-icon">'+a.icon+'</span><span class="achievement-name">'+a.name+'</span></div>';}).join('');
}
function renderAvatarModal(){
var html='';
avatarCategories.forEach(function(cat){
var label=getTranslation(cat.labelKey);
var priceText=cat.price===0?getTranslation('free'):cat.price+' '+getTranslation('diamonds_short');
var priceClass=cat.price===0?' free':'';
html+='<div class="avatar-category">';
html+='<div class="avatar-category-title">'+label+' <span class="price-tag'+priceClass+'">'+priceText+'</span></div>';
html+='<div class="avatar-grid">';
cat.items.forEach(function(item){
var isActive=currentAvatar===item.id;
var isOwned=isAvatarOwned(item.id);
var imgHtml=item.icon?'<i class="fa-solid '+item.icon+'"></i>':'<img src="'+item.url+'" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
var priceHtml=(cat.price===0||isOwned)?'<span class="avatar-item-price owned">'+(cat.price===0?getTranslation('free'):getTranslation('owned'))+'</span>':'<span class="avatar-item-price">'+cat.price+' 💎</span>';
html+='<div class="avatar-item'+(isActive?' active':'')+(isOwned?' owned':'')+'" onclick="selectAvatar(\''+cat.id+'\',\''+item.id+'\','+cat.price+')">';
html+='<div class="avatar-item-img">'+imgHtml+'</div>'+priceHtml+'</div>';
});
html+='</div></div>';
});
document.getElementById('avatarCategories').innerHTML=html;
}
function openAvatarModal(){renderAvatarModal();document.getElementById('avatarModalOverlay').classList.add('show');}
function closeAvatarModal(){document.getElementById('avatarModalOverlay').classList.remove('show');}
window.openAvatarModal=openAvatarModal;
window.closeAvatarModal=closeAvatarModal;
window.selectAvatar=function(catId,itemId,price){
var owned=isAvatarOwned(itemId);
if(price===0||owned){currentAvatar=itemId;fetchData('updateUser',{avatar:itemId});renderAvatarModal();updateProfileAvatar();return;}
if(userDiamonds<price){if(webApp)webApp.showAlert(getTranslation('not_enough_diamonds'));return;}
userDiamonds-=price;
document.getElementById('diamondsValue').textContent=userDiamonds;
fetchData('updateUser',{diamonds:userDiamonds});
var ownedAvatars=[];
try{ownedAvatars=JSON.parse(localStorage.getItem('ownedAvatars')||'[]');}catch(e){}
if(ownedAvatars.indexOf(itemId)===-1){ownedAvatars.push(itemId);localStorage.setItem('ownedAvatars',JSON.stringify(ownedAvatars));}
currentAvatar=itemId;fetchData('updateUser',{avatar:itemId});renderAvatarModal();updateProfileAvatar();
if(webApp)webApp.showAlert(getTranslation('avatar_purchased'));
};
function updateProfileAvatar(){
var avatarEl=document.getElementById('profileAvatar');
var found=null;
avatarCategories.forEach(function(cat){cat.items.forEach(function(item){if(item.id===currentAvatar)found={cat:cat,item:item};});});
if(found){if(found.item.icon){avatarEl.innerHTML='<i class="fa-solid '+found.item.icon+'"></i>';}else{avatarEl.innerHTML='<img src="'+found.item.url+'" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';}}
else{avatarEl.innerHTML='<i class="fa-solid fa-user"></i>';}
}

window.openSupportLink=openSupportLink;

async function loadProfile(){
try{
var user=getEitaaUser();
var username=getUserId();
if(user){var fullName=(user.first_name||'')+' '+(user.last_name||'');document.getElementById('profileName').textContent=fullName.trim()||'کاربر';document.getElementById('profileUsername').textContent='ID: '+username;}
var userData=await fetchData('getUser',{});
if(userData.ok&&userData.data){var d=userData.data;userDiamonds=d.diamonds||0;currentAvatar=d.avatar||'default';animateCount(document.getElementById('totalScore'),d.score||0,800);animateCount(document.getElementById('coinsValue'),d.coins||0,800);animateCount(document.getElementById('diamondsValue'),userDiamonds,800);updateProfileAvatar();}

var gamesData=await fetchData('getGamesByPlayer',{});
var totalGames=0,totalWins=0;
if(gamesData.ok&&Array.isArray(gamesData.data)){
totalGames=gamesData.data.length;
var list=document.getElementById('gamesList');
if(gamesData.data.length===0){list.innerHTML=renderEmpty(getTranslation('no_games'));}
else{
list.innerHTML=gamesData.data.slice(0,10).map(function(g){
var isP1=String(g.player1)===String(username);
var oppId=isP1?g.player2:g.player1;
var cls='draw',txt=getTranslation('draw');
if(g.status==='finished'){if(isP1){cls='win';txt=getTranslation('win');totalWins++;}else{cls='loss';txt=getTranslation('lose');}}
return '<div class="game-item"><span class="game-players" id="opp-'+g.id+'"><span class="game-avatar"><i class="fa-solid fa-user"></i></span> ...</span><span class="game-score '+cls+'">'+txt+'</span></div>';
}).join('');
for(var i=0;i<gamesData.data.slice(0,10).length;i++){
(function(g){
var isP1=String(g.player1)===String(username);
var oppId=isP1?g.player2:g.player1;
getPlayerInfo(oppId).then(function(info){
var el=document.getElementById('opp-'+g.id);
if(el)el.innerHTML='<span class="game-avatar">'+getAvatarHtml(info.avatar)+'</span> '+info.name;
});
})(gamesData.data[i]);
}
}
}
animateCount(document.getElementById('totalGames'),totalGames,600);
var winRate=totalGames>0?Math.round((totalWins/totalGames)*100):0;
document.getElementById('winRate').textContent=winRate+'%';

var championCount=0,runnerupCount=0,leagueLosses=0;
var allLeagues=await fetchData('getLeagueByUser',{});
if(allLeagues.ok&&allLeagues.data){
if(allLeagues.data.winner===username)championCount++;
}
animateCount(document.getElementById('championCount'),championCount,600);
animateCount(document.getElementById('runnerupCount'),runnerupCount,600);
animateCount(document.getElementById('leagueLosses'),leagueLosses,600);

var finalScore=userData.ok&&userData.data?userData.data.score||0:0;
renderAchievements(totalGames,totalWins,finalScore);
}catch(e){console.error(e);}
finally{document.getElementById('loaderWrapper').style.display='none';document.getElementById('profileContent').classList.add('show');}
}

if(webApp){webApp.ready();webApp.BackButton.show();webApp.BackButton.onClick(function(){window.location.href='../dashboard/';});}
applyTheme();
loadProfile();
setTimeout(function(){var notif=document.getElementById('supportNotification');if(notif){notif.style.display='none';}},5000);
})();
</script>
