<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            transition: background 0.3s ease;
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img { width: 95%; height: 95%; object-fit: contain; transform: scale(1.1); }
        .header-title { font-size: 16px; font-weight: 800; color: var(--dark); }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 12px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { font-size: 12px; font-weight: 700; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-content { display: none; }
        .profile-content.show { display: flex; flex-direction: column; gap: 12px; }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #fff;
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-info { flex: 1; min-width: 0; }
        .profile-name { font-size: 14px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-username { font-size: 9px; color: rgba(255,255,255,0.7); direction: ltr; text-align: right; }

        .profile-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 10px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-icon { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .stat-value { font-size: 16px; font-weight: 800; color: var(--dark); }
        .stat-label { font-size: 8px; color: var(--text-light); }

        .progress-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .progress-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .progress-title i { color: var(--primary); }
        .progress-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 15px;
            height: 18px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 15px;
            transition: width 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 0%;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            font-size: 8px;
            font-weight: 800;
            color: #fff;
        }

        .league-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .league-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .league-title i { color: var(--primary); }
        .league-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .league-item {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            border: var(--border);
            background: var(--bg2);
        }
        .league-item.win { background: #10b981; color: #fff; }
        .league-item.draw { background: #f59e0b; color: #fff; }
        .league-item.loss { background: #ef4444; color: #fff; }
        .league-item-value { font-size: 16px; font-weight: 800; display: block; }
        .league-item-label { font-size: 8px; }

        .achievements-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .achievements-title { font-size: 11px; font-weight: 800; color: var(--dark); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .achievements-title i { color: var(--primary); }
        .achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .achievement-item {
            text-align: center;
            padding: 8px 4px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
        }
        .achievement-icon { font-size: 20px; display: block; margin-bottom: 3px; }
        .achievement-name { font-size: 7px; font-weight: 700; color: var(--dark); }
        .achievement-item.locked { opacity: 0.3; filter: grayscale(1); }

        .games-history-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }
        .games-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
        }
        .game-players { font-size: 9px; font-weight: 700; color: var(--dark); }
        .game-score { font-size: 9px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: var(--border); }
        .game-score.win { background: #10b981; color: #fff; }
        .game-score.loss { background: #ef4444; color: #fff; }
        .game-score.draw { background: #f59e0b; color: #fff; }

        .empty-state {
            text-align: center;
            padding: 14px;
            color: var(--text-light);
            font-size: 10px;
        }
        .empty-state img { width: 50px; height: 50px; object-fit: contain; margin: 0 auto 6px; display: block; }

        .bottom-nav {
            position: fixed;
            bottom: 0; right: 0; left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            padding: 4px 12px;
            font-family: inherit;
            background: none;
            border: none;
            font-size: 12px;
        }
        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle" data-i18n="profile">پروفایل</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text" data-i18n="loading">در حال دریافت...</div>
        </div>

        <div class="profile-content" id="profileContent">

            <div class="profile-header-card">
                <div class="profile-top">
                    <div class="profile-avatar" id="profileAvatar"><i class="fa-solid fa-user"></i></div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName"></div>
                        <div class="profile-username" id="profileUsername"></div>
                    </div>
                </div>
                <div class="profile-badges">
                    <span class="badge"><i class="fa-solid fa-coins"></i> <span id="coinsValue">0</span> <span data-i18n="coins">سکه</span></span>
                    <span class="badge"><i class="fa-solid fa-gem"></i> <span id="diamondsValue">0</span> <span data-i18n="diamonds">الماس</span></span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label" data-i18n="total_score">امتیاز کل</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-gamepad"></i></div>
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label" data-i18n="total_games">تعداد بازی</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="stat-value" id="winRate">0%</div>
                    <div class="stat-label" data-i18n="win_rate">درصد برد</div>
                </div>
            </div>

            <div class="progress-card">
                <div class="progress-title"><i class="fa-solid fa-ranking-star"></i> <span data-i18n="next_rank">پیشرفت به رتبه بعدی</span></div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>

            <div class="league-card">
                <div class="league-title"><i class="fa-solid fa-trophy"></i> <span data-i18n="league_stats">آمار لیگ</span></div>
                <div class="league-stats">
                    <div class="league-item win">
                        <span class="league-item-value" id="winsCount">0</span>
                        <span class="league-item-label" data-i18n="wins">برد</span>
                    </div>
                    <div class="league-item draw">
                        <span class="league-item-value" id="drawsCount">0</span>
                        <span class="league-item-label" data-i18n="draws">مساوی</span>
                    </div>
                    <div class="league-item loss">
                        <span class="league-item-value" id="lossesCount">0</span>
                        <span class="league-item-label" data-i18n="losses">باخت</span>
                    </div>
                </div>
            </div>

            <div class="achievements-card">
                <div class="achievements-title"><i class="fa-solid fa-award"></i> <span data-i18n="achievements">افتخارات</span></div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="games-history-card">
                <div class="achievements-title"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="history">تاریخچه بازی‌ها</span></div>
                <div class="games-list" id="gamesList"></div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="home">خانه</span></a>
        <a href="../ranking/" class="nav-item"><i class="fa-solid fa-trophy"></i><span data-i18n="ranking">رتبه</span></a>
        <a href="../profile/" class="nav-item active"><i class="fa-solid fa-user"></i><span data-i18n="profile_nav">پروفایل</span></a>
        <a href="../setting/" class="nav-item"><i class="fa-solid fa-gear"></i><span data-i18n="settings">تنظیمات</span></a>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';

            var translations = {
                fa: {
                    profile: 'پروفایل', loading: 'در حال دریافت...', coins: 'سکه', diamonds: 'الماس',
                    total_score: 'امتیاز کل', total_games: 'تعداد بازی', win_rate: 'درصد برد',
                    next_rank: 'پیشرفت به رتبه بعدی', league_stats: 'آمار لیگ',
                    wins: 'برد', draws: 'مساوی', losses: 'باخت',
                    achievements: 'افتخارات', history: 'تاریخچه بازی‌ها',
                    home: 'خانه', ranking: 'رتبه', profile_nav: 'پروفایل', settings: 'تنظیمات',
                    no_games: 'مسابقه‌ای یافت نشد'
                },
                en: {
                    profile: 'Profile', loading: 'Loading...', coins: 'Coins', diamonds: 'Diamonds',
                    total_score: 'Total Score', total_games: 'Total Games', win_rate: 'Win Rate',
                    next_rank: 'Progress to Next Rank', league_stats: 'League Stats',
                    wins: 'Wins', draws: 'Draws', losses: 'Losses',
                    achievements: 'Achievements', history: 'Game History',
                    home: 'Home', ranking: 'Ranking', profile_nav: 'Profile', settings: 'Settings',
                    no_games: 'No games found'
                },
                ar: {
                    profile: 'الملف', loading: 'جار التحميل...', coins: 'عملات', diamonds: 'ألماس',
                    total_score: 'مجموع النقاط', total_games: 'عدد الألعاب', win_rate: 'نسبة الفوز',
                    next_rank: 'التقدم للرتبة التالية', league_stats: 'إحصائيات الدوري',
                    wins: 'فوز', draws: 'تعادل', losses: 'خسارة',
                    achievements: 'الإنجازات', history: 'سجل الألعاب',
                    home: 'الرئيسية', ranking: 'الترتيب', profile_nav: 'الملف', settings: 'الإعدادات',
                    no_games: 'لا توجد ألعاب'
                }
            };

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true, language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.primaryColor) p.primaryColor = '#a855f7';
                    if (p.animation === undefined) p.animation = true;
                    if (p.haptic === undefined) p.haptic = true;
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true, language: 'fa' }; }
            }

            function hexToRgb(h) {
                var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
                return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:168,g:85,b:247 };
            }
            function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1);}

            function applyLanguage(lang) {
                var t = translations[lang] || translations.fa;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k]) el.textContent = t[k];
                });
                if (lang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                    document.body.style.fontFamily = 'Arial, sans-serif';
                } else if (lang === 'ar') {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = 'Tahoma, sans-serif';
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = "'IRANSans', Tahoma, sans-serif";
                }
            }

            function applyTheme() {
                var s = getSettings();
                var t = s.theme || 'light';
                var p = s.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'dark') {
                    var dp = shadeColor(p, 40);
                    document.documentElement.style.setProperty('--primary', dp);
                } else {
                    document.documentElement.style.setProperty('--primary', p);
                }
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                applyLanguage(s.language);
            }

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }

            function animateCount(el,target,dur){
                var st=0,stt=null;
                function step(ts){if(!stt)stt=ts;var p=Math.min((ts-stt)/dur,1);var e=1-Math.pow(1-p,3);el.textContent=Math.floor(e*target);if(p<1)requestAnimationFrame(step);else el.textContent=target;}
                requestAnimationFrame(step);
            }

            function renderEmpty(text){
                return '<div class="empty-state"><img src="'+SAD_IMAGE+'" alt=""><p>'+text+'</p></div>';
            }

            var allAchievements = [
                { id:'first_game', name:'اولین بازی', icon:'🎮' },
                { id:'10_games', name:'۱۰ بازی', icon:'🔥' },
                { id:'first_win', name:'اولین برد', icon:'🏆' },
                { id:'10_wins', name:'۱۰ برد', icon:'⚡' },
                { id:'100_score', name:'۱۰۰ امتیاز', icon:'⭐' },
                { id:'1000_score', name:'۱۰۰۰ امتیاز', icon:'🌟' },
                { id:'100_coins', name:'۱۰۰ سکه', icon:'🪙' },
                { id:'100_diamonds', name:'۱۰۰ الماس', icon:'💎' }
            ];

            function renderAchievements(data) {
                var grid = document.getElementById('achievementsGrid');
                var stats = {};
                try { stats = JSON.parse(data.stats || '{}'); } catch(e) {}
                var earned = stats.achievements || [];
                var score = data.score || 0;
                var coins = data.coins || 0;
                var diamonds = data.diamonds || 0;
                
                if (score >= 100) earned.push('100_score');
                if (score >= 1000) earned.push('1000_score');
                if (coins >= 100) earned.push('100_coins');
                if (diamonds >= 100) earned.push('100_diamonds');
                if (earned.length > 0) earned.push('first_game');
                if (earned.indexOf('first_game') !== -1) earned.push('first_win');
                if (earned.length >= 10) earned.push('10_games');
                if (earned.indexOf('first_win') !== -1) earned.push('10_wins');
                
                grid.innerHTML = allAchievements.map(function(a) {
                    var unlocked = earned.indexOf(a.id) !== -1;
                    return '<div class="achievement-item'+(unlocked?'':' locked')+'">'+
                        '<span class="achievement-icon">'+a.icon+'</span>'+
                        '<span class="achievement-name">'+a.name+'</span></div>';
                }).join('');
            }

            async function loadProfile() {
                try {
                    var user = getEitaaUser();
                    var username = getUserId();
                    if (user) {
                        var fullName = (user.first_name||'')+' '+(user.last_name||'');
                        document.getElementById('profileName').textContent = fullName.trim() || 'کاربر';
                        document.getElementById('profileUsername').textContent = 'ID: '+username;
                        if (user.photo_url) {
                            document.getElementById('profileAvatar').innerHTML = '<img src="'+user.photo_url+'" alt="">';
                        }
                    }

                    var userData = await fetchData('getUser', {});
                    if (userData.ok && userData.data) {
                        var d = userData.data;
                        animateCount(document.getElementById('totalScore'), d.score||0, 800);
                        animateCount(document.getElementById('coinsValue'), d.coins||0, 800);
                        animateCount(document.getElementById('diamondsValue'), d.diamonds||0, 800);
                        renderAchievements(d);
                        
                        var nextScore = Math.ceil((d.score||0)/1000)*1000;
                        var prog = Math.round(((d.score||0)%1000)/nextScore*100);
                        if (prog > 100) prog = 100;
                        if ((d.score||0) === 0) prog = 0;
                        if ((d.score||0) >= nextScore && nextScore > 0) prog = 100;
                        setTimeout(function() {
                            document.getElementById('progressFill').style.width = prog+'%';
                            document.getElementById('progressText').textContent = prog+'%';
                        }, 300);
                    }

                    var league = await fetchData('getLeague', {});
                    var wins=0,draws=0,losses=0;
                    if (league.ok && league.data) {
                        wins = league.data.wins||0;
                        draws = league.data.draws||0;
                        losses = league.data.losses||0;
                    }
                    animateCount(document.getElementById('winsCount'), wins, 600);
                    animateCount(document.getElementById('drawsCount'), draws, 600);
                    animateCount(document.getElementById('lossesCount'), losses, 600);
                    var total = wins+draws+losses;
                    var rate = total>0 ? Math.round(wins/total*100) : 0;
                    document.getElementById('winRate').textContent = rate+'%';

                    var games = await fetchData('getGamesByPlayer', {});
                    if (games.ok && Array.isArray(games.data)) {
                        animateCount(document.getElementById('totalGames'), games.data.length, 600);
                        var list = document.getElementById('gamesList');
                        if (games.data.length === 0) {
                            list.innerHTML = renderEmpty('مسابقه‌ای یافت نشد');
                        } else {
                            list.innerHTML = games.data.slice(0,10).map(function(g) {
                                var isP1 = String(g.player1) === String(username);
                                var opp = isP1 ? g.player2 : g.player1;
                                var cls = 'draw', txt = 'مساوی';
                                if (g.status === 'finished') {
                                    if (isP1) { cls='win'; txt='برد'; } else { cls='loss'; txt='باخت'; }
                                }
                                return '<div class="game-item"><span class="game-players">'+(opp||'ناشناس')+'</span><span class="game-score '+cls+'">'+txt+'</span></div>';
                            }).join('');
                        }
                    }
                } catch(e) {
                    console.error(e);
                } finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('profileContent').classList.add('show');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    window.location.href = '../dashboard/';
                });
            }

            applyTheme();
            loadProfile();
        })();
    </script>
</body>
</html>
