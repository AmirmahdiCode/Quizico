<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        [data-animation="off"] .header-title .t-letter {
            opacity: 1 !important;
            transform: translateY(0) !important;
            animation: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            transition: background 0.8s ease;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.1;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
            animation: slideDown 0.5s ease;
            transition: all 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .header-logo:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            display: flex;
            direction: ltr;
            gap: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
            transition: color 0.5s ease;
            font-family: 'IRANSans', Tahoma, sans-serif;
            overflow: hidden;
        }

        .header-title .t-letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(-20px);
            animation: titleLetterIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .header-title .t-letter:nth-child(1) { animation-delay: 0.1s; }
        .header-title .t-letter:nth-child(2) { animation-delay: 0.15s; }
        .header-title .t-letter:nth-child(3) { animation-delay: 0.2s; }
        .header-title .t-letter:nth-child(4) { animation-delay: 0.25s; }
        .header-title .t-letter:nth-child(5) { animation-delay: 0.3s; }
        .header-title .t-letter:nth-child(6) { animation-delay: 0.35s; }
        .header-title .t-letter:nth-child(7) { animation-delay: 0.4s; }

        @keyframes titleLetterIn {
            0% { opacity: 0; transform: translateY(-20px); }
            60% { opacity: 1; transform: translateY(3px); }
            80% { transform: translateY(-2px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header-title.animate-out .t-letter {
            animation: titleLetterOut 0.4s ease forwards;
        }

        .header-title.animate-out .t-letter:nth-child(1) { animation-delay: 0s; }
        .header-title.animate-out .t-letter:nth-child(2) { animation-delay: 0.05s; }
        .header-title.animate-out .t-letter:nth-child(3) { animation-delay: 0.1s; }
        .header-title.animate-out .t-letter:nth-child(4) { animation-delay: 0.15s; }
        .header-title.animate-out .t-letter:nth-child(5) { animation-delay: 0.2s; }
        .header-title.animate-out .t-letter:nth-child(6) { animation-delay: 0.25s; }
        .header-title.animate-out .t-letter:nth-child(7) { animation-delay: 0.3s; }

        @keyframes titleLetterOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .header-title .t-letter.t-accent {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
            margin-top: -2px;
            transition: color 0.5s ease;
        }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 600px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 80px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 16px;
        }

        .loader {
            width: 56px;
            height: 56px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.3);
        }

        .loader-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            animation: pulse 1.5s ease infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .profile-content { display: none; animation: fadeInUp 0.5s ease; }
        .profile-content.show { display: block; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ffffff;
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            font-size: 24px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-username {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            direction: ltr;
            text-align: right;
        }

        .profile-badges {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 3px 8px;
            font-size: 9px;
            color: #ffffff;
            font-weight: 600;
        }

        .badge i {
            font-size: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 4px 4px 0 #000000;
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-light);
            font-weight: 600;
        }

        .progress-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .progress-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-title i {
            color: var(--primary);
        }

        .progress-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            transition: width 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: 0%;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            font-size: 9px;
            font-weight: 700;
            color: #fff;
            z-index: 2;
        }

        .league-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .league-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-title i {
            color: var(--primary);
        }

        .league-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .league-item {
            text-align: center;
            padding: 10px;
            border-radius: var(--radius);
            border: var(--border);
            background: var(--bg2);
        }

        .league-item.win { background: #10b981; color: #ffffff; }
        .league-item.draw { background: #f59e0b; color: #ffffff; }
        .league-item.loss { background: #ef4444; color: #ffffff; }

        .league-item-value {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }

        .league-item-label {
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            display: block;
        }

        .achievements-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .achievements-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .achievements-title i {
            color: var(--primary);
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .achievement-item {
            text-align: center;
            padding: 10px 4px;
            border: var(--border);
            border-radius: var(--radius);
            background: var(--bg2);
            transition: all 0.3s ease;
        }

        .achievement-item:hover {
            transform: translateY(-3px);
            box-shadow: 3px 3px 0 #000000;
        }

        .achievement-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        .achievement-name {
            font-size: 8px;
            font-weight: 700;
            color: var(--dark);
        }

        .achievement-item.locked {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .games-history-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border: var(--border);
            border-radius: var(--radius);
            background: var(--bg2);
            transition: all 0.3s ease;
        }

        .game-item:hover {
            transform: translateX(-3px);
        }

        .game-players {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--dark);
        }

        .game-score {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius);
            border: var(--border);
        }

        .game-score.win { background: #10b981; color: #ffffff; }
        .game-score.loss { background: #ef4444; color: #ffffff; }
        .game-score.draw { background: #f59e0b; color: #ffffff; }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 11px;
        }

        .empty-state i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-light);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--header-bg);
            border-top: var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            z-index: 999;
            transition: all 0.5s ease;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 4px 12px;
            border-radius: var(--radius);
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-item i {
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 8px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        @media (max-width: 480px) {
            .header-title { font-size: 15px; }
            .header-logo {
                width: 44px;
                height: 44px;
            }
            .achievements-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="bg-particles" id="particles"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title" id="headerTitle">
                        <span class="t-letter">Q</span>
                        <span class="t-letter">u</span>
                        <span class="t-letter">i</span>
                        <span class="t-letter">z</span>
                        <span class="t-letter t-accent">i</span>
                        <span class="t-letter t-accent">c</span>
                        <span class="t-letter t-accent">o</span>
                    </div>
                    <div class="header-subtitle">پروفایل من</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">در حال دریافت اطلاعات...</div>
        </div>

        <div class="profile-content" id="profileContent">

            <div class="profile-header-card">
                <div class="profile-top">
                    <div class="profile-avatar" id="profileAvatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName"></div>
                        <div class="profile-username" id="profileUsername"></div>
                    </div>
                </div>
                <div class="profile-badges">
                    <span class="badge"><i class="fa-solid fa-coins"></i> <span id="coinsValue">0</span> سکه</span>
                    <span class="badge"><i class="fa-solid fa-gem"></i> <span id="diamondsValue">0</span> الماس</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
                    <div class="stat-value" id="totalScore">0</div>
                    <div class="stat-label">امتیاز کل</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-gamepad"></i></div>
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">تعداد بازی</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="stat-value" id="winRate">0%</div>
                    <div class="stat-label">درصد برد</div>
                </div>
            </div>

            <div class="progress-card">
                <div class="progress-title">
                    <i class="fa-solid fa-ranking-star"></i>
                    پیشرفت به رتبه بعدی
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>

            <div class="league-card">
                <div class="league-title">
                    <i class="fa-solid fa-trophy"></i>
                    آمار لیگ
                </div>
                <div class="league-stats">
                    <div class="league-item win">
                        <span class="league-item-value" id="winsCount">0</span>
                        <span class="league-item-label">برد</span>
                    </div>
                    <div class="league-item draw">
                        <span class="league-item-value" id="drawsCount">0</span>
                        <span class="league-item-label">مساوی</span>
                    </div>
                    <div class="league-item loss">
                        <span class="league-item-value" id="lossesCount">0</span>
                        <span class="league-item-label">باخت</span>
                    </div>
                </div>
            </div>

            <div class="achievements-card">
                <div class="achievements-title">
                    <i class="fa-solid fa-award"></i>
                    افتخارات
                </div>
                <div class="achievements-grid" id="achievementsGrid"></div>
            </div>

            <div class="games-history-card">
                <div class="achievements-title">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    تاریخچه بازی‌ها
                </div>
                <div class="games-list" id="gamesList"></div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="../dashboard/" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>خانه</span>
        </a>
        <a href="../ranking/" class="nav-item">
            <i class="fa-solid fa-trophy"></i>
            <span>رتبه</span>
        </a>
        <a href="../profile/" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>پروفایل</span>
        </a>
        <a href="../setting/" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>تنظیمات</span>
        </a>
    </nav>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            function createParticles() {
                var container = document.getElementById('particles');
                for (var i = 0; i < 20; i++) {
                    var p = document.createElement('div');
                    p.className = 'particle';
                    var size = 3 + Math.random() * 8;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = 15 + Math.random() * 25 + 's';
                    p.style.animationDelay = Math.random() * 20 + 's';
                    container.appendChild(p);
                }
            }
            createParticles();

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) {
                        var defaultSettings = { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true };
                        localStorage.setItem('quizicoSettings', JSON.stringify(defaultSettings));
                        return defaultSettings;
                    }
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    if (parsed.animation === undefined) parsed.animation = true;
                    if (parsed.haptic === undefined) parsed.haptic = true;
                    return parsed;
                } catch(e) {
                    return { theme: 'light', primaryColor: '#a855f7', animation: true, haptic: true };
                }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(darkPrimary).r + ', ' + hexToRgb(darkPrimary).g + ', ' + hexToRgb(darkPrimary).b);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(primaryColor).r + ', ' + hexToRgb(primaryColor).g + ', ' + hexToRgb(primaryColor).b);
                }
                if (settings.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                if (webApp) {
                    webApp.setHeaderColor('bg_color');
                    webApp.setBackgroundColor('bg_color');
                }
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            async function fetchData(action, params) {
                try {
                    var username = getUserId();
                    var initData = webApp?.initData || '';
                    var payload = { action: action, username: username, initData: initData };
                    if (params) {
                        for (var key in params) {
                            if (params.hasOwnProperty(key)) payload[key] = params[key];
                        }
                    }
                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    var result = await response.json();
                    return result;
                } catch(e) {
                    console.error('Fetch error:', e);
                    return { ok: false, error: 'Network error: ' + e.message };
                }
            }

            function animateCount(element, target, duration) {
                var start = 0;
                var startTime = null;
                function step(timestamp) {
                    if (!startTime) startTime = timestamp;
                    var progress = Math.min((timestamp - startTime) / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 3);
                    element.textContent = Math.floor(eased * target);
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        element.textContent = target;
                    }
                }
                requestAnimationFrame(step);
            }

            function renderEmptyState(icon, text) {
                return '<div class="empty-state"><i class="fa-solid ' + icon + '"></i><p>' + text + '</p></div>';
            }

            var allAchievements = [
                { id: 'first_game', name: 'اولین بازی', icon: '🎮' },
                { id: 'first_win', name: 'اولین برد', icon: '🏆' },
                { id: '10_games', name: '۱۰ بازی', icon: '🔥' },
                { id: '10_wins', name: '۱۰ برد', icon: '⚡' },
                { id: '50_games', name: '۵۰ بازی', icon: '💎' },
                { id: '50_wins', name: '۵۰ برد', icon: '👑' },
                { id: '1000_score', name: '۱۰۰۰ امتیاز', icon: '⭐' },
                { id: '5000_score', name: '۵۰۰۰ امتیاز', icon: '🌟' },
                { id: '100_coins', name: '۱۰۰ سکه', icon: '🪙' },
                { id: '500_coins', name: '۵۰۰ سکه', icon: '💰' },
                { id: '100_diamonds', name: '۱۰۰ الماس', icon: '💠' },
                { id: '500_diamonds', name: '۵۰۰ الماس', icon: '🔷' }
            ];

            function renderAchievements(userData) {
                var grid = document.getElementById('achievementsGrid');
                var stats = {};
                try { stats = JSON.parse(userData.stats || '{}'); } catch(e) {}
                
                var unlocked = stats.achievements || [];
                var wins = stats.wins || parseInt(userData.score > 0 ? 1 : 0);
                var games = stats.games || 0;
                
                var earned = [];
                if (userData.score >= 1000) earned.push('1000_score');
                if (userData.score >= 5000) earned.push('5000_score');
                if (userData.coins >= 100) earned.push('100_coins');
                if (userData.coins >= 500) earned.push('500_coins');
                if (userData.diamonds >= 100) earned.push('100_diamonds');
                if (userData.diamonds >= 500) earned.push('500_diamonds');
                if (unlocked.indexOf('first_game') !== -1 || games >= 1) earned.push('first_game');
                if (unlocked.indexOf('first_win') !== -1 || wins >= 1) earned.push('first_win');
                if (games >= 10) earned.push('10_games');
                if (wins >= 10) earned.push('10_wins');
                if (games >= 50) earned.push('50_games');
                if (wins >= 50) earned.push('50_wins');
                
                var allUnlocked = unlocked.concat(earned.filter(function(a) { return unlocked.indexOf(a) === -1; }));

                var items = allAchievements.map(function(ach) {
                    var isUnlocked = allUnlocked.indexOf(ach.id) !== -1;
                    return '<div class="achievement-item' + (isUnlocked ? '' : ' locked') + '">' +
                        '<span class="achievement-icon">' + ach.icon + '</span>' +
                        '<span class="achievement-name">' + ach.name + '</span></div>';
                }).join('');

                grid.innerHTML = items;
            }

            async function loadProfile() {
                var user = getEitaaUser();
                var username = getUserId();

                if (user) {
                    var fullName = (user.first_name || '') + ' ' + (user.last_name || '');
                    document.getElementById('profileName').textContent = fullName.trim() || 'کاربر';
                    document.getElementById('profileUsername').textContent = 'ID: ' + username;
                    
                    if (user.photo_url) {
                        var avatar = document.getElementById('profileAvatar');
                        avatar.innerHTML = '<img src="' + user.photo_url + '" alt="آواتار">';
                    }
                }

                try {
                    var userData = await fetchData('getUser', {});
                    if (userData.ok && userData.data) {
                        var data = userData.data;
                        animateCount(document.getElementById('totalScore'), data.score || 0, 1000);
                        animateCount(document.getElementById('coinsValue'), data.coins || 0, 1000);
                        animateCount(document.getElementById('diamondsValue'), data.diamonds || 0, 1000);
                        renderAchievements(data);
                        
                        var nextLevelScore = Math.ceil((data.score || 0) / 1000) * 1000;
                        var currentLevelProgress = ((data.score || 0) % 1000);
                        var progressPercent = Math.round((currentLevelProgress / nextLevelScore) * 100);
                        if (nextLevelScore === 0) progressPercent = 0;
                        if (progressPercent > 100) progressPercent = 100;
                        
                        setTimeout(function() {
                            document.getElementById('progressFill').style.width = progressPercent + '%';
                            document.getElementById('progressText').textContent = progressPercent + '%';
                        }, 300);
                    }

                    var leagueData = await fetchData('getLeague', {});
                    var wins = 0, draws = 0, losses = 0;
                    if (leagueData.ok && leagueData.data) {
                        wins = leagueData.data.wins || 0;
                        draws = leagueData.data.draws || 0;
                        losses = leagueData.data.losses || 0;
                    }

                    animateCount(document.getElementById('winsCount'), wins, 800);
                    animateCount(document.getElementById('drawsCount'), draws, 800);
                    animateCount(document.getElementById('lossesCount'), losses, 800);

                    var totalLeague = wins + draws + losses;
                    var winRate = totalLeague > 0 ? Math.round((wins / totalLeague) * 100) : 0;
                    animateCount(document.getElementById('winRate'), winRate, 800);
                    document.getElementById('winRate').textContent += '%';

                    var gamesData = await fetchData('getGamesByPlayer', {});
                    if (gamesData.ok && Array.isArray(gamesData.data)) {
                        var games = gamesData.data;
                        animateCount(document.getElementById('totalGames'), games.length, 800);

                        var gamesList = document.getElementById('gamesList');
                        if (games.length === 0) {
                            gamesList.innerHTML = renderEmptyState('fa-gamepad', 'مسابقه‌ای یافت نشد');
                        } else {
                            var items = games.slice(0, 10).reverse().map(function(game) {
                                var isPlayer1 = String(game.player1) === String(username);
                                var opponent = isPlayer1 ? game.player2 : game.player1;
                                var resultText = 'مساوی';
                                var resultClass = 'draw';
                                if (game.status === 'finished') {
                                    if (isPlayer1) { resultText = 'برد'; resultClass = 'win'; }
                                    else { resultText = 'باخت'; resultClass = 'loss'; }
                                }
                                return '<div class="game-item">' +
                                    '<div class="game-players"><i class="fa-solid fa-user"></i><span>' + (opponent || 'ناشناس') + '</span></div>' +
                                    '<span class="game-score ' + resultClass + '">' + resultText + '</span></div>';
                            }).join('');
                            gamesList.innerHTML = items;
                        }
                    } else {
                        document.getElementById('gamesList').innerHTML = renderEmptyState('fa-gamepad', 'مسابقه‌ای یافت نشد');
                    }

                } catch(e) {
                    console.error('Error loading profile:', e);
                } finally {
                    document.getElementById('loaderWrapper').style.display = 'none';
                    document.getElementById('profileContent').classList.add('show');
                }
            }

            if (webApp) {
                webApp.ready();
                webApp.BackButton.show();
                webApp.BackButton.onClick(function() {
                    window.location.href = '../dashboard/';
                });
            }

            applyTheme();
            loadProfile();
        })();
    </script>
</body>
</html>
