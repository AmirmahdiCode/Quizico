<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دو نفره آفلاین | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 8px 16px;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.1);
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
        }

        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 8px auto;
            padding: 0 10px 80px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
        }

        .loader-letters {
            display: flex;
            gap: 3px;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            direction: ltr;
        }

        .loader-letter {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            opacity: 0;
            animation: letterBounce 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .loader-letter:nth-child(1) { animation-delay: 0.1s; }
        .loader-letter:nth-child(2) { animation-delay: 0.15s; }
        .loader-letter:nth-child(3) { animation-delay: 0.2s; }
        .loader-letter:nth-child(4) { animation-delay: 0.25s; }
        .loader-letter:nth-child(5) { animation-delay: 0.3s; color: #f59e0b; }
        .loader-letter:nth-child(6) { animation-delay: 0.35s; color: #f59e0b; }
        .loader-letter:nth-child(7) { animation-delay: 0.4s; color: #f59e0b; }

        @keyframes letterBounce {
            0% { opacity: 0; transform: translateY(-20px) scale(0.3); }
            50% { opacity: 1; transform: translateY(5px) scale(1.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .players-row {
            display: flex;
            gap: 6px;
        }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .player-tag { font-size: 9px; font-weight: 800; }
        .player-score { font-size: 13px; font-weight: 800; color: var(--gold); }

        .rounds-results {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 8px;
            box-shadow: var(--shadow);
        }

        .rounds-title {
            font-size: 9px;
            font-weight: 800;
            margin-bottom: 6px;
            text-align: center;
        }

        .round-result-item {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 6px;
            margin-bottom: 4px;
        }

        .round-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 8px;
            padding: 1px 0;
        }

        .round-result-player { font-weight: 700; min-width: 20px; }
        .round-result-count { font-weight: 800; font-size: 8px; }

        .question-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 10px;
            box-shadow: var(--shadow);
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .question-player-tag {
            font-size: 9px;
            font-weight: 800;
            color: var(--primary);
        }

        .question-text {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 6px;
        }

        .timer-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 8px;
            height: 5px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .timer-bar-fill {
            height: 100%;
            background: #10b981;
            transition: width 1s linear;
        }

        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.danger { background: #ef4444; }

        .timer-text { font-size: 7px; font-weight: 700; text-align: center; margin-bottom: 6px; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border: var(--border);
            border-radius: 6px;
            background: var(--bg2);
            cursor: pointer;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 600;
            text-align: right;
            transition: all 0.2s ease;
            box-shadow: 1px 1px 0 #000;
        }

        .option-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .option-btn.selected-correct { background: #10b981; color: #fff; }
        .option-btn.selected-wrong { background: #ef4444; color: #fff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.6; }

        .option-letter {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .bottom-btn-container {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 8px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
        }

        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 10px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }

        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-banner {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .result-icon { font-size: 40px; margin-bottom: 8px; }
        .result-text { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .result-score { font-size: 10px; color: var(--text-light); margin-bottom: 8px; }

        .result-btn {
            display: inline-block;
            padding: 8px 20px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 6px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle">دو نفره آفلاین</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container" id="mainContainer">
        <div class="loader-letters" id="loaderLetters">
            <span class="loader-letter">Q</span>
            <span class="loader-letter">u</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">z</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">c</span>
            <span class="loader-letter">o</span>
        </div>
    </main>

    <div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع بازی</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 1;
            var QUESTION_TIME = 60;
            var currentRound = 1;
            var p1Questions = [];
            var p2Questions = [];
            var p1Score = 0;
            var p2Score = 0;
            var questions = [];
            var roundResults = [];
            var isGameActive = false;
            var timerInterval = null;
            var timeLeft = QUESTION_TIME;
            var gameId = 'game_' + Date.now();

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7' };
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    return parsed;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7' }; }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                }
            }

            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            function fetchData(action, params) {
                var payload = { action: action };
                if (params) {
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) payload[key] = params[key];
                    }
                }
                return fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json(); }).catch(function() { return { ok: false }; });
            }

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = QUESTION_TIME;
                updateTimerBars();
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimerBars();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        endRound();
                    }
                }, 1000);
            }

            function updateTimerBars() {
                var fills = document.querySelectorAll('.timer-bar-fill');
                var texts = document.querySelectorAll('.timer-text');
                var percent = (timeLeft / QUESTION_TIME) * 100;
                fills.forEach(function(fill) {
                    fill.style.width = percent + '%';
                    fill.className = 'timer-bar-fill' + (timeLeft <= 10 ? ' danger' : timeLeft <= 20 ? ' warning' : '');
                });
                texts.forEach(function(text) {
                    text.textContent = timeLeft + ' ثانیه';
                });
            }

            function renderQuestionCard(playerNum, question, options, correctIndex) {
                var tag = playerNum === 1 ? 'بازیکن ۱' : 'بازیکن ۲';
                var html = '<div class="question-card" id="p' + playerNum + 'Card">';
                html += '<div class="question-header"><span class="question-player-tag">' + tag + '</span></div>';
                html += '<div class="question-text">' + question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" style="width:100%;"></div></div>';
                html += '<div class="timer-text">60 ثانیه</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < options.length; i++) {
                    html += '<button class="option-btn" data-player="' + playerNum + '" data-correct="' + correctIndex + '" onclick="selectOption(' + playerNum + ', ' + i + ', this)">';
                    html += '<span class="option-letter">' + (i + 1) + '</span>';
                    html += '<span>' + options[i] + '</span>';
                    html += '</button>';
                }
                html += '</div>';
                html += '</div>';
                return html;
            }

            function renderGame() {
                var html = '';
                html += '<div class="players-row">';
                html += '<div class="player-card"><div class="player-tag">بازیکن ۱</div><span class="player-score">' + p1Score + '</span></div>';
                html += '<div class="player-card"><div class="player-tag">بازیکن ۲</div><span class="player-score">' + p2Score + '</span></div>';
                html += '</div>';
                
                if (roundResults.length > 0) {
                    html += '<div class="rounds-results">';
                    html += '<div class="rounds-title">نتایج راندها</div>';
                    for (var i = 0; i < roundResults.length; i++) {
                        var r = roundResults[i];
                        html += '<div class="round-result-item">';
                        html += '<div class="round-result-row"><span class="round-result-player">راند ' + (i + 1) + '</span></div>';
                        html += '<div class="round-result-row"><span class="round-result-player">بازیکن ۱</span><span class="round-result-count">' + (r.p1Correct ? 'درست' : 'غلط') + '</span></div>';
                        html += '<div class="round-result-row"><span class="round-result-player">بازیکن ۲</span><span class="round-result-count">' + (r.p2Correct ? 'درست' : 'غلط') + '</span></div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                html += '<div class="question-area">';
                var p1q = p1Questions[currentRound - 1];
                var p2q = p2Questions[currentRound - 1];
                var p1opts = shuffleArray(p1q.options.slice());
                var p1correct = p1opts.indexOf(p1q.options[p1q.correctOption - 1]);
                var p2opts = shuffleArray(p2q.options.slice());
                var p2correct = p2opts.indexOf(p2q.options[p2q.correctOption - 1]);
                
                html += renderQuestionCard(1, p1q.question, p1opts, p1correct);
                html += renderQuestionCard(2, p2q.question, p2opts, p2correct);
                html += '</div>';
                
                document.getElementById('mainContainer').innerHTML = html;
                startTimer();
            }

            window.selectOption = function(playerNum, selectedIndex, btn) {
                var correctIndex = parseInt(btn.getAttribute('data-correct'));
                var card = document.getElementById('p' + playerNum + 'Card');
                var btns = card.querySelectorAll('.option-btn');
                btns.forEach(function(b) { b.classList.add('disabled'); });
                
                if (selectedIndex === correctIndex) {
                    btn.classList.add('selected-correct');
                    if (playerNum === 1) {
                        p1Score += 5;
                    } else {
                        p2Score += 5;
                    }
                } else {
                    btn.classList.add('selected-wrong');
                    btns[correctIndex].classList.add('selected-correct');
                }
                
                var allCards = document.querySelectorAll('.question-card');
                var allAnswered = true;
                allCards.forEach(function(c) {
                    if (c.querySelectorAll('.option-btn.disabled').length < 4) allAnswered = false;
                });
                
                if (allAnswered) {
                    clearInterval(timerInterval);
                    setTimeout(function() {
                        endRound();
                    }, 800);
                }
            };

            function endRound() {
                var p1Correct = false;
                var p2Correct = false;
                
                var p1Card = document.getElementById('p1Card');
                var p2Card = document.getElementById('p2Card');
                if (p1Card && p1Card.querySelector('.selected-correct')) p1Correct = true;
                if (p2Card && p2Card.querySelector('.selected-correct')) p2Correct = true;
                
                roundResults.push({ p1Correct: p1Correct, p2Correct: p2Correct });
                
                currentRound++;
                
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                } else {
                    renderGame();
                }
            }

            function endGame() {
                clearInterval(timerInterval);
                var resultHtml = '';
                if (p1Score > p2Score) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">بازیکن ۱ برنده شد!</div>';
                } else if (p2Score > p1Score) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">بازیکن ۲ برنده شد!</div>';
                } else {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-handshake" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">مساوی شد!</div>';
                }
                resultHtml += '<div class="result-score">بازیکن ۱: ' + p1Score + ' - بازیکن ۲: ' + p2Score + '</div>';
                resultHtml += '<button class="result-btn" onclick="backToDashboard()">بازگشت</button>';
                
                document.getElementById('mainContainer').innerHTML = '<div class="result-banner">' + resultHtml + '</div>';
                document.getElementById('mainBtn').style.display = 'none';
                
                var gameData = {
                    id: gameId,
                    player1: 'player1',
                    player2: 'player2',
                    round1: JSON.stringify(roundResults[0] || {}),
                    round2: JSON.stringify(roundResults[1] || {}),
                    round3: JSON.stringify(roundResults[2] || {}),
                    round4: JSON.stringify(roundResults[3] || {}),
                    round5: JSON.stringify(roundResults[4] || {}),
                    status: 'finished'
                };
                fetchData('saveGame', { gameData: gameData });
            }

            window.backToDashboard = function() {
                window.location.href = '../../dashboard/';
            };

            window.handleMainBtn = function() {
                if (!isGameActive) {
                    isGameActive = true;
                    document.getElementById('mainBtn').textContent = 'بازی در جریان...';
                    document.getElementById('mainBtn').disabled = true;
                    renderGame();
                }
            };

            async function init() {
                applyTheme();
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                    webApp.BackButton.show();
                    webApp.BackButton.onClick(function() {
                        window.location.href = '../../dashboard/';
                    });
                }

                var questionsData = await fetchData('getQuestions', { limit: 100 });
                if (questionsData.ok && Array.isArray(questionsData.data) && questionsData.data.length >= 8) {
                    questions = shuffleArray(questionsData.data);
                    
                    // تقسیم سوالات: نیمه اول برای بازیکن ۱، نیمه دوم برای بازیکن ۲
                    var half = Math.floor(questions.length / 2);
                    var p1Pool = questions.slice(0, half);
                    var p2Pool = questions.slice(half);
                    
                    // انتخاب ۵ سوال برای هر بازیکن بدون تکرار
                    p1Questions = p1Pool.slice(0, TOTAL_ROUNDS);
                    p2Questions = p2Pool.slice(0, TOTAL_ROUNDS);
                    
                    // اگه سوالات کافی نبود، از کل سوالات استفاده کن
                    if (p1Questions.length < TOTAL_ROUNDS || p2Questions.length < TOTAL_ROUNDS) {
                        p1Questions = shuffleArray(questions).slice(0, TOTAL_ROUNDS);
                        p2Questions = shuffleArray(questions).slice(0, TOTAL_ROUNDS);
                        // مطمئن شو سوالات تکراری بین دو بازیکن در همون راند نیست
                        for (var i = 0; i < TOTAL_ROUNDS; i++) {
                            if (p1Questions[i] && p2Questions[i] && p1Questions[i].id === p2Questions[i].id) {
                                var temp = p2Questions[i];
                                var swapIndex = (i + 1) % TOTAL_ROUNDS;
                                p2Questions[i] = p2Questions[swapIndex];
                                p2Questions[swapIndex] = temp;
                            }
                        }
                    }
                    
                    document.getElementById('bottomBtnContainer').style.display = 'block';
                } else {
                    document.getElementById('mainContainer').innerHTML = '<div class="result-banner"><div class="result-text">حداقل ۸ سوال لازم است</div></div>';
                }
            }

            init();
        })();
    </script>
</body>
</html>
