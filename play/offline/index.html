<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دو نفره آفلاین | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #475569;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 10px 16px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
        }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img { width: 95%; height: 95%; object-fit: contain; transform: scale(1.1); }
        .header-title { font-size: 14px; font-weight: 800; color: var(--dark); }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 12px auto;
            padding: 0 10px 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            gap: 10px;
        }
        .loader {
            width: 45px;
            height: 45px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { font-size: 11px; font-weight: 700; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        .game-content { display: none; }
        .game-content.show { display: flex; flex-direction: column; gap: 10px; }

        .players-row { display: flex; gap: 8px; }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 10px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .player-tag { font-size: 9px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
        .player-score { font-size: 13px; font-weight: 800; color: var(--gold); }

        .rounds-results {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
        }
        .rounds-title { font-size: 10px; font-weight: 800; color: var(--dark); margin-bottom: 8px; text-align: center; }
        .round-result-item {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
        }
        .round-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 8px;
            padding: 2px 0;
        }
        .round-result-player { font-weight: 700; color: var(--dark); min-width: 25px; }
        .round-dots { display: flex; gap: 3px; flex: 1; justify-content: center; }
        .result-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
            font-weight: 800;
            border: var(--border);
            background: #10b981;
            color: #fff;
        }
        .result-dot.wrong { background: #ef4444; }
        .round-result-count { font-weight: 800; font-size: 8px; color: var(--dark); }

        .question-area { display: flex; flex-direction: column; gap: 8px; }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: var(--shadow);
        }
        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .question-player-tag { font-size: 9px; font-weight: 800; color: var(--primary); }
        .question-progress { font-size: 7px; font-weight: 700; color: var(--text-light); }
        .question-text {
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.6;
            text-align: center;
            margin-bottom: 6px;
        }
        .timer-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 8px;
            height: 5px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .timer-bar-fill { height: 100%; background: #10b981; transition: width 1s linear; }
        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.danger { background: #ef4444; }
        .timer-text { font-size: 7px; font-weight: 700; color: var(--text-light); text-align: center; margin-bottom: 6px; }

        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border: var(--border);
            border-radius: 6px;
            background: var(--bg2);
            cursor: pointer;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 600;
            color: var(--dark);
            text-align: right;
            transition: all 0.2s ease;
            box-shadow: 1px 1px 0 #000;
        }
        .option-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .option-btn.selected-correct { background: #10b981; color: #fff; }
        .option-btn.selected-wrong { background: #ef4444; color: #fff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.6; }

        .option-letter {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .bottom-btn-container {
            position: fixed;
            bottom: 0; right: 0; left: 0;
            padding: 8px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
        }

        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 10px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .main-btn.green { background: #10b981; }

        .result-banner {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .result-icon { font-size: 40px; margin-bottom: 8px; }
        .result-text { font-size: 14px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
        .result-score { font-size: 10px; color: var(--text-light); margin-bottom: 8px; }
        .result-btn {
            display: inline-block;
            padding: 8px 20px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle" data-i18n="offline">دو نفره آفلاین</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text" data-i18n="loading">در حال دریافت...</div>
        </div>
        <div class="game-content" id="gameContent"></div>
    </main>

    <div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع بازی</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 3;
            var QUESTION_TIME = 60;
            var currentRound = 1;
            var currentQuestionIndex = 0;
            var p1Score = 0, p2Score = 0;
            var p1CorrectCount = 0, p2CorrectCount = 0;
            var questions = [];
            var p1Questions = [], p2Questions = [];
            var roundResults = [];
            var timerInterval = null;
            var timeLeft = QUESTION_TIME;
            var currentLang = 'fa';
            var p1AnsweredQuestions = [];
            var p2AnsweredQuestions = [];

            var translations = {
                fa: {
                    offline: 'دو نفره آفلاین', loading: 'در حال دریافت...', start_game: 'شروع بازی',
                    p1: 'بازیکن ۱', p2: 'بازیکن ۲', results: 'نتایج راندها',
                    round: 'راند', question: 'سوال', of: 'از', next_round: 'شروع راند بعدی',
                    p1_win: 'بازیکن ۱ برنده شد!', p2_win: 'بازیکن ۲ برنده شد!', draw: 'مساوی شد!',
                    back: 'بازگشت', no_questions: 'سوال کافی نیست', score: 'امتیاز'
                },
                en: {
                    offline: '2P Offline', loading: 'Loading...', start_game: 'Start Game',
                    p1: 'Player 1', p2: 'Player 2', results: 'Round Results',
                    round: 'Round', question: 'Question', of: 'of', next_round: 'Next Round',
                    p1_win: 'Player 1 Wins!', p2_win: 'Player 2 Wins!', draw: 'Draw!',
                    back: 'Back', no_questions: 'Not enough questions', score: 'Score'
                },
                ar: {
                    offline: 'ثنائي بدون إنترنت', loading: 'جار التحميل...', start_game: 'ابدأ اللعبة',
                    p1: 'اللاعب ۱', p2: 'اللاعب ۲', results: 'نتائج الجولات',
                    round: 'جولة', question: 'سؤال', of: 'من', next_round: 'الجولة التالية',
                    p1_win: 'اللاعب ۱ فاز!', p2_win: 'اللاعب ۲ فاز!', draw: 'تعادل!',
                    back: 'رجوع', no_questions: 'أسئلة غير كافية', score: 'النقاط'
                }
            };

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' };
                    var p = JSON.parse(raw);
                    if (!p.theme) p.theme = 'light';
                    if (!p.primaryColor) p.primaryColor = '#a855f7';
                    if (p.animation === undefined) p.animation = true;
                    if (!p.language) p.language = 'fa';
                    return p;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7', animation: true, language: 'fa' }; }
            }

            function getTranslation(key) {
                var t = translations[currentLang] || translations.fa;
                return t[key] || translations.fa[key] || key;
            }

            function hexToRgb(h) {
                var r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
                return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:168,g:85,b:247 };
            }
            function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1);}

            function applyTheme() {
                var s = getSettings();
                currentLang = s.language || 'fa';
                var t = s.theme || 'light';
                var p = s.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', t);
                if (t === 'dark') {
                    var dp = shadeColor(p, 40);
                    document.documentElement.style.setProperty('--primary', dp);
                } else {
                    document.documentElement.style.setProperty('--primary', p);
                }
                if (s.animation === false) {
                    document.documentElement.setAttribute('data-animation', 'off');
                } else {
                    document.documentElement.removeAttribute('data-animation');
                }
                if (currentLang === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                    document.body.style.fontFamily = 'Arial, sans-serif';
                } else if (currentLang === 'ar') {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = 'Tahoma, sans-serif';
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.body.style.fontFamily = "'IRANSans', Tahoma, sans-serif";
                }
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var k = el.getAttribute('data-i18n');
                    var t2 = translations[currentLang] || translations.fa;
                    if (t2[k]) el.textContent = t2[k];
                });
            }

            function sleep(ms) {
                return new Promise(function(resolve) { setTimeout(resolve, ms); });
            }

            function translateGoogle(text, targetLang) {
                var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=fa&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);
                return fetch(url).then(function(r){return r.json();}).then(function(d){return d&&d[0]&&d[0][0]?d[0][0][0]:null;}).catch(function(){return null;});
            }

            function translateMyMemory(text, targetLang) {
                var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=fa|' + targetLang;
                return fetch(url).then(function(r){return r.json();}).then(function(d){return d&&d.responseData&&d.responseData.translatedText?d.responseData.translatedText:null;}).catch(function(){return null;});
            }

            async function translateText(text, targetLang) {
                if (targetLang === 'fa') return text;
                var result = await translateGoogle(text, targetLang);
                if (result) return result;
                await sleep(100);
                result = await translateMyMemory(text, targetLang);
                if (result) return result;
                return text;
            }

            async function translateQuestion(q, lang) {
                if (lang === 'fa') return q;
                var target = lang === 'en' ? 'en' : 'ar';
                var tq = await translateText(q.question, target);
                await sleep(80);
                var topts = [];
                for (var i = 0; i < q.options.length; i++) {
                    topts.push(await translateText(q.options[i], target));
                    await sleep(80);
                }
                return { id: q.id, question: tq, options: topts, correctOption: q.correctOption };
            }

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }

            function shuffleArray(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = QUESTION_TIME;
                updateTimerBars();
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimerBars();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        handleTimeout();
                    }
                }, 1000);
            }

            function updateTimerBars() {
                var fills = document.querySelectorAll('.timer-bar-fill');
                var texts = document.querySelectorAll('.timer-text');
                var pct = (timeLeft / QUESTION_TIME) * 100;
                fills.forEach(function(f) {
                    f.style.width = pct + '%';
                    f.className = 'timer-bar-fill' + (timeLeft <= 10 ? ' danger' : timeLeft <= 20 ? ' warning' : '');
                });
                texts.forEach(function(t) { t.textContent = timeLeft + 's'; });
            }

            function handleTimeout() {
                var p1Card = document.getElementById('p1Card');
                var p2Card = document.getElementById('p2Card');
                if (p1Card && p1Card.querySelectorAll('.option-btn.disabled').length < 4) {
                    p1AnsweredQuestions[currentQuestionIndex] = false;
                }
                if (p2Card && p2Card.querySelectorAll('.option-btn.disabled').length < 4) {
                    p2AnsweredQuestions[currentQuestionIndex] = false;
                }
                moveToNext();
            }

            function moveToNext() {
                currentQuestionIndex++;
                if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                    finishRound();
                } else {
                    renderQuestionsScreen();
                }
            }

            function renderRoundsScreen() {
                var t = getTranslation;
                var html = '';
                html += '<div class="players-row">';
                html += '<div class="player-card"><div class="player-tag">' + t('p1') + '</div><span class="player-score">' + p1Score + '</span></div>';
                html += '<div class="player-card"><div class="player-tag">' + t('p2') + '</div><span class="player-score">' + p2Score + '</span></div>';
                html += '</div>';
                
                if (roundResults.length > 0) {
                    html += '<div class="rounds-results">';
                    html += '<div class="rounds-title">' + t('results') + '</div>';
                    for (var i = 0; i < roundResults.length; i++) {
                        var r = roundResults[i];
                        html += '<div class="round-result-item">';
                        html += '<div class="round-result-row"><span class="round-result-player">' + t('round') + ' ' + (i + 1) + '</span></div>';
                        html += '<div class="round-result-row"><span class="round-result-player">' + t('p1') + '</span><div class="round-dots">';
                        for (var j = 0; j < QUESTIONS_PER_ROUND; j++) html += '<span class="result-dot' + (j < r.p1Correct ? '' : ' wrong') + '">' + (j + 1) + '</span>';
                        html += '</div><span class="round-result-count">+' + r.p1Score + '</span></div>';
                        html += '<div class="round-result-row"><span class="round-result-player">' + t('p2') + '</span><div class="round-dots">';
                        for (var k = 0; k < QUESTIONS_PER_ROUND; k++) html += '<span class="result-dot' + (k < r.p2Correct ? '' : ' wrong') + '">' + (k + 1) + '</span>';
                        html += '</div><span class="round-result-count">+' + r.p2Score + '</span></div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                document.getElementById('gameContent').innerHTML = html;
                
                var btn = document.getElementById('mainBtn');
                if (currentRound > TOTAL_ROUNDS) {
                    btn.textContent = t('back');
                    btn.className = 'main-btn';
                } else {
                    btn.textContent = currentRound === 1 ? t('start_game') : t('next_round') + ' ' + currentRound;
                    btn.className = 'main-btn green';
                }
                btn.disabled = false;
                document.getElementById('bottomBtnContainer').style.display = 'block';
            }

            function renderQuestionCard(playerNum, q, qIndex) {
                var tag = getTranslation(playerNum === 1 ? 'p1' : 'p2');
                var opts = shuffleArray(q.options.slice());
                var ci = opts.indexOf(q.options[q.correctOption - 1]);
                var html = '<div class="question-card" id="p' + playerNum + 'Card">';
                html += '<div class="question-header">';
                html += '<span class="question-player-tag">' + tag + '</span>';
                html += '<span class="question-progress">' + getTranslation('question') + ' ' + (qIndex + 1) + ' ' + getTranslation('of') + ' ' + QUESTIONS_PER_ROUND + '</span>';
                html += '</div>';
                html += '<div class="question-text">' + q.question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" style="width:100%;"></div></div>';
                html += '<div class="timer-text">60s</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" data-player="' + playerNum + '" data-correct="' + ci + '" onclick="selectOption(' + playerNum + ',' + i + ',this)">';
                    html += '<span class="option-letter">' + (i + 1) + '</span><span>' + opts[i] + '</span></button>';
                }
                html += '</div></div>';
                return html;
            }

            function renderQuestionsScreen() {
                p1AnsweredQuestions[currentQuestionIndex] = undefined;
                p2AnsweredQuestions[currentQuestionIndex] = undefined;
                var html = '<div class="question-area">';
                html += renderQuestionCard(1, p1Questions[currentQuestionIndex], currentQuestionIndex);
                html += renderQuestionCard(2, p2Questions[currentQuestionIndex], currentQuestionIndex);
                html += '</div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                startTimer();
            }

            window.selectOption = function(playerNum, sel, btn) {
                var ci = parseInt(btn.getAttribute('data-correct'));
                var card = document.getElementById('p' + playerNum + 'Card');
                var btns = card.querySelectorAll('.option-btn');
                btns.forEach(function(b) { b.classList.add('disabled'); });
                if (sel === ci) {
                    btn.classList.add('selected-correct');
                    if (playerNum === 1) { p1Score += 5; p1CorrectCount++; p1AnsweredQuestions[currentQuestionIndex] = true; }
                    else { p2Score += 5; p2CorrectCount++; p2AnsweredQuestions[currentQuestionIndex] = true; }
                } else {
                    btn.classList.add('selected-wrong');
                    btns[ci].classList.add('selected-correct');
                    if (playerNum === 1) { p1AnsweredQuestions[currentQuestionIndex] = false; }
                    else { p2AnsweredQuestions[currentQuestionIndex] = false; }
                }
                
                var allAnswered = true;
                document.querySelectorAll('.question-card').forEach(function(c) {
                    if (c.querySelectorAll('.option-btn.disabled').length < 4) allAnswered = false;
                });
                
                if (allAnswered) {
                    clearInterval(timerInterval);
                    setTimeout(moveToNext, 800);
                }
            };

            function finishRound() {
                var p1Corr = 0, p2Corr = 0;
                for (var i = 0; i < QUESTIONS_PER_ROUND; i++) {
                    if (p1AnsweredQuestions[i] === true) p1Corr++;
                    if (p2AnsweredQuestions[i] === true) p2Corr++;
                }
                roundResults.push({
                    p1Score: p1Corr * 5,
                    p2Score: p2Corr * 5,
                    p1Correct: p1Corr,
                    p2Correct: p2Corr
                });
                p1CorrectCount = 0;
                p2CorrectCount = 0;
                p1AnsweredQuestions = [];
                p2AnsweredQuestions = [];
                currentRound++;
                currentQuestionIndex = 0;
                renderRoundsScreen();
            }

            function endGame() {
                clearInterval(timerInterval);
                var t = getTranslation;
                var html = '<div class="result-banner">';
                if (p1Score > p2Score) html += '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div><div class="result-text">' + t('p1_win') + '</div>';
                else if (p2Score > p1Score) html += '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div><div class="result-text">' + t('p2_win') + '</div>';
                else html += '<div class="result-icon"><i class="fa-solid fa-handshake" style="color:#f59e0b;"></i></div><div class="result-text">' + t('draw') + '</div>';
                html += '<div class="result-score">' + t('p1') + ': ' + p1Score + ' - ' + t('p2') + ': ' + p2Score + '</div>';
                html += '<button class="result-btn" onclick="backToDashboard()">' + t('back') + '</button></div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
            }

            window.backToDashboard = function() {
                window.location.href = '../../dashboard/';
            };

            window.handleMainBtn = function() {
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                } else {
                    renderQuestionsScreen();
                }
            };

            async function init() {
                applyTheme();
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                    webApp.BackButton.show();
                    webApp.BackButton.onClick(function() { window.location.href = '../../dashboard/'; });
                }

                var qd = await fetchData('getQuestions', { limit: 100 });
                if (qd.ok && Array.isArray(qd.data) && qd.data.length >= 8) {
                    questions = qd.data;
                    var totalNeeded = TOTAL_ROUNDS * QUESTIONS_PER_ROUND;
                    var selectedQuestions = shuffleArray(questions).slice(0, totalNeeded * 2);
                    
                    if (currentLang !== 'fa') {
                        var translated = [];
                        for (var i = 0; i < selectedQuestions.length; i++) {
                            translated.push(await translateQuestion(selectedQuestions[i], currentLang));
                        }
                        selectedQuestions = translated;
                    }
                    
                    p1Questions = selectedQuestions.slice(0, totalNeeded);
                    p2Questions = selectedQuestions.slice(totalNeeded, totalNeeded * 2);
                    renderRoundsScreen();
                } else {
                    document.getElementById('gameContent').innerHTML = '<div class="result-banner"><div class="result-text">' + getTranslation('no_questions') + '</div></div>';
                }
                document.getElementById('loaderWrapper').style.display = 'none';
                document.getElementById('gameContent').classList.add('show');
            }

            init();
        })();
    </script>
</body>
</html>
