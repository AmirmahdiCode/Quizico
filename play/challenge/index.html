<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست API های رایگان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
        .title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #333; }
        .output { font-size: 12px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 80px; }
        .btn { padding: 10px 20px; background: #6366f1; color: #fff; border: 1px solid #4f46e5; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 12px; margin: 4px; }
        .loader { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">تست API های رایگان</div>
            <button class="btn" onclick="testOpenRouter()">تست OpenRouter Free</button>
            <button class="btn" onclick="testGroq()">تست Groq</button>
            <button class="btn" onclick="testHuggingFace()">تست HuggingFace</button>
            <button class="btn" onclick="testGeminiFree()">تست Gemini Flash</button>
        </div>
        <div class="card">
            <div class="title">پاسخ:</div>
            <div id="loaderBox" style="display:none; text-align:center; padding:20px;"><div class="loader"></div></div>
            <div class="output" id="output">-</div>
        </div>
    </div>

    <script>
        var API_KEYS = {
            openrouter: 'sk-or-v1-', // باید کلید خودت رو بذاری
            groq: '', // باید کلید خودت رو بذاری
            gemini: '' // باید کلید خودت رو بذاری
        };

        async function testOpenRouter() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            try {
                var res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEYS.openrouter
                    },
                    body: JSON.stringify({
                        model: 'meta-llama/llama-3.1-8b-instruct:free',
                        messages: [{ role: 'user', content: 'Say hello in Persian, one word' }]
                    })
                });
                var data = await res.json();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }

        async function testGroq() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            try {
                var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEYS.groq
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [{ role: 'user', content: 'Say hello in Persian, one word' }]
                    })
                });
                var data = await res.json();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }

        async function testHuggingFace() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            try {
                var res = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inputs: 'Say hello in Persian, one word',
                        parameters: { max_new_tokens: 50 }
                    })
                });
                var data = await res.json();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }

        async function testGeminiFree() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            try {
                var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + API_KEYS.gemini, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: 'Say hello in Persian, one word' }] }]
                    })
                });
                var data = await res.json();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }
    </script>
</body>
</html>
