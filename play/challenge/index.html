<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
        .title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #333; }
        .output { font-size: 12px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 80px; }
        .btn { padding: 10px 20px; background: #6366f1; color: #fff; border: 1px solid #4f46e5; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 12px; }
        .loader { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">تست Pollinations AI - POST Method</div>
            <button class="btn" onclick="testPOST()">تست با POST</button>
            <br><br>
            <button class="btn" onclick="testGET()">تست با GET</button>
        </div>
        <div class="card">
            <div class="title">پاسخ:</div>
            <div id="loaderBox" style="display:none; text-align:center; padding:20px;"><div class="loader"></div></div>
            <div class="output" id="output">-</div>
        </div>
    </div>

    <script>
        var POLLINATIONS_API = 'https://text.pollinations.ai/';

        async function testPOST() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            var prompt = 'Say hello in Persian only, just one word';
            
            try {
                var res = await fetch(POLLINATIONS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: prompt }]
                    })
                });
                var text = await res.text();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + text;
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }

        async function testGET() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            
            var prompt = 'Say hello in Persian only, just one word';
            
            try {
                var url = POLLINATIONS_API + encodeURIComponent(prompt);
                var res = await fetch(url);
                var text = await res.text();
                document.getElementById('output').textContent = 'Status: ' + res.status + '\n\n' + text;
            } catch(e) {
                document.getElementById('output').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }
    </script>
</body>
</html>
