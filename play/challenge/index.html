<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست AI | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --dark: #1e1b2e;
            --text: #4a4458;
            --card-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Digi Kian Grunge', 'IRANSans', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border: var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
        .title { font-size: 13px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }
        .output { font-size: 11px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; background: #f3e8ff; border: var(--border); border-radius: 8px; padding: 12px; min-height: 100px; }
        .btn {
            padding: 10px 20px; background: var(--primary); color: #fff; border: var(--border); border-radius: 8px;
            font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0 #000;
        }
        .loader { width: 30px; height: 30px; border: 4px solid var(--bg3); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">تست هوش مصنوعی - نمایش مستقیم پاسخ</div>
            <button class="btn" onclick="testAI()">درخواست سوال</button>
        </div>
        <div class="card">
            <div class="title">پاسخ خام از AI:</div>
            <div id="loaderBox" style="display:none; text-align:center; padding:20px;"><div class="loader"></div></div>
            <div class="output" id="output">اینجا کلیک کن...</div>
        </div>
        <div class="card">
            <div class="title">خطاها:</div>
            <div class="output" id="errorOutput" style="background:#fef2f2; color:#ef4444;">-</div>
        </div>
    </div>

    <script>
        var AI_URL = 'https://script.google.com/macros/s/AKfycbywc_1sGW5OTCj0mJN2_oMFtrIucP-nq9sY6ywJjB_vea-ItKfzebVDICk2SLibcai6B8g/exec';

        async function testAI() {
            document.getElementById('loaderBox').style.display = 'block';
            document.getElementById('output').textContent = 'در حال دریافت...';
            document.getElementById('errorOutput').textContent = '-';

            var topics = ['تاریخ ایران', 'علوم فضایی', 'فیزیک', 'ورزش'];
            var topic = topics[Math.floor(Math.random()*topics.length)];
            
            var prompt = 'یک سوال ۴ گزینه خیلی سخت درباره ' + topic + ' بده، فقط حتما با فرمت زیر بده و غیر از اون هیچ چیز دیگری ننویس!\n\nQ: متن سوال\nA1: گزینه ۱\nA2: گزینه ۲\nA3: گزینه ۳\nA4: گزینه۴\nCA: شماره گزینه صحیح بصورت عدد فقط';

            try {
                var payload = { action: 'getQuestionWithPrompt', prompt: prompt };
                var response = await fetch(AI_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify(payload)
                });
                var result = await response.json();
                
                document.getElementById('output').textContent = JSON.stringify(result, null, 2);
            } catch(e) {
                document.getElementById('errorOutput').textContent = 'Error: ' + e.message;
            }
            
            document.getElementById('loaderBox').style.display = 'none';
        }
    </script>
</body>
</html>
