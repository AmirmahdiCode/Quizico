<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیگ | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 12px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #475569;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        img {
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: font-family 0.3s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 10px 16px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
        }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img { width: 95%; height: 95%; object-fit: contain; transform: scale(1.1); }
        .header-title { font-size: 14px; font-weight: 800; color: var(--dark); }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: var(--border);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: var(--shadow);
        }
        .currency-badge.coins i { color: #f59e0b; }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 12px auto;
            padding: 0 10px 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            gap: 10px;
        }
        .loader {
            width: 45px;
            height: 45px;
            border: 5px solid var(--bg3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { font-size: 11px; font-weight: 700; color: var(--text); }
        @keyframes spin { to { transform: rotate(360deg); } }

        .game-content { display: none; }
        .game-content.show { display: flex; flex-direction: column; gap: 10px; }

        .waiting-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .waiting-image { width: 100px; height: 100px; object-fit: contain; margin: 0 auto 10px; display: block; }
        .waiting-text { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
        .room-code-display { font-size: 18px; font-weight: 900; color: var(--primary); letter-spacing: 2px; margin-bottom: 10px; }

        .invite-box {
            background: #fff7ed;
            border: 2px solid #f97316;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .invite-box-title { font-size: 10px; font-weight: 800; color: #f97316; margin-bottom: 6px; }
        .invite-box-desc { font-size: 8px; color: #9a3412; margin-bottom: 8px; line-height: 1.6; }
        .invite-link-box { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #f97316; border-radius: 6px; padding: 6px 8px; }
        .invite-link { flex: 1; font-size: 8px; font-weight: 600; color: #9a3412; direction: ltr; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background: #f97316; color: #fff; border: 1px solid #000; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: 'IRANSans', Tahoma, sans-serif; font-size: 8px; font-weight: 700; box-shadow: 2px 2px 0 #000; flex-shrink: 0; }
        .copy-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }

        .players-invite-section {
            margin-top: 12px;
            text-align: right;
            opacity: 0.5;
            pointer-events: none;
            position: relative;
        }
        .players-invite-section .coming-soon-overlay {
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            background: #a855f7;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #000;
            box-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        .players-invite-title { font-size: 10px; font-weight: 800; color: var(--dark); margin-bottom: 8px; text-align: center; }
        .players-search-box { position: relative; margin-bottom: 8px; }
        .players-search-box input { width: 100%; padding: 8px 35px 8px 10px; border: var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); font-family: inherit; font-size: 9px; outline: none; }
        .players-search-box i { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); color: var(--text-light); font-size: 11px; }
        .players-invite-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }

        .league-table {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
        }
        .league-table-title { font-size: 10px; font-weight: 800; color: var(--dark); margin-bottom: 8px; text-align: center; }
        .league-table-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: var(--border);
            border-radius: 6px;
            background: var(--bg2);
            margin-bottom: 4px;
            font-size: 8px;
            font-weight: 700;
            color: var(--dark);
        }
        .league-table-row .rank { min-width: 25px; font-weight: 800; }
        .league-table-row .name { flex: 1; }
        .league-table-row .pts { font-weight: 800; color: var(--primary); }

        .games-list { display: flex; flex-direction: column; gap: 4px; }
        .game-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            font-size: 8px;
            font-weight: 700;
            color: var(--dark);
        }
        .game-item .vs { color: var(--primary); font-weight: 800; }
        .game-item .status { margin-right: auto; font-size: 7px; padding: 2px 8px; border-radius: 8px; border: var(--border); }
        .game-item .status.waiting { background: #fef3c7; color: #d97706; }
        .game-item .status.done { background: #d1fae5; color: #059669; }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
        }
        .question-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.7;
            text-align: center;
            margin-bottom: 8px;
        }
        .timer-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .timer-bar-fill { height: 100%; background: #10b981; transition: width 1s linear; }
        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.danger { background: #ef4444; }
        .timer-text { font-size: 7px; font-weight: 700; color: var(--text-light); text-align: center; margin-bottom: 8px; }

        .options-grid { display: flex; flex-direction: column; gap: 6px; }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: var(--dark);
            text-align: right;
        }
        .option-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .option-btn.selected-correct { background: #10b981; color: #fff; }
        .option-btn.selected-wrong { background: #ef4444; color: #fff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.6; }
        .option-btn.hidden-option { opacity: 0.2; pointer-events: none; text-decoration: line-through; }
        .option-letter {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .actions-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 7px;
            border: var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: var(--dark);
        }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .bottom-btn-container {
            position: fixed;
            bottom: 0; right: 0; left: 0;
            padding: 8px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
        }
        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 10px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .main-btn.green { background: #10b981; }
        .main-btn.waiting { background: var(--text-light); }

        .result-banner {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .result-icon { font-size: 40px; margin-bottom: 8px; }
        .result-text { font-size: 14px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
        .result-score { font-size: 10px; color: var(--text-light); margin-bottom: 8px; }
        .result-btn {
            display: inline-block;
            padding: 8px 20px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle">لیگ</div>
                </div>
            </div>
            <span class="currency-badge coins"><i class="fa-solid fa-coins"></i> <span id="coinsHeader">0</span></span>
        </div>
    </header>

    <main class="main-container">
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <div class="loader-text">در حال دریافت...</div>
        </div>
        <div class="game-content" id="gameContent"></div>
    </main>

    <div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع بازی</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycbyHQXQ0TffhGyW1MdtI-_sWlZMhLSPDCR3Az5dDkuwv9TJt1o6-f_aCOg_aHJnty_8P/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 3;
            var QUESTION_TIME = 60;
            var GAME_TIME_LIMIT = 60;
            var leagueCode = null;
            var isCreator = false;
            var currentRound = 1;
            var currentQuestionIndex = 0;
            var questions = [];
            var currentQuestions = [];
            var isAnswered = false;
            var myScore = 0;
            var myCorrectCount = 0;
            var myAnswers = [];
            var roundResults = [];
            var checkInterval = null;
            var myUserId = '';
            var timerInterval = null;
            var timeLeft = QUESTION_TIME;
            var userCoins = 0;
            var currentGameId = '';
            var isMyTurn = false;
            var isInGame = false;
            var currentGameIndex = 0;
            var currentOpponentId = '';
            var gameCreatedAt = '';
            var actionUsedThisQuestion = false;

            var leagueMatches = [
                [1, 2], [2, 3], [1, 5], [3, 4], [1, 4],
                [2, 5], [1, 3], [4, 5], [3, 5], [2, 4]
            ];

            var turnOrder = [[1,1],[1,2],[2,2],[2,1],[3,1],[3,2],[4,2],[4,1],[5,1],[5,2]];
            var currentTurn = 0;

            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('dragstart', function(e) { e.preventDefault(); });
            document.addEventListener('copy', function(e) { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
            document.addEventListener('cut', function(e) { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

            function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null;}
            function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):'';}
            function getStartParam(){if(webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.start_param)return webApp.initDataUnsafe.start_param;return ''}
            function generateLeagueCode(){var c='LG_';for(var i=0;i<5;i++){c+=Math.floor(Math.random()*10);}return c}
            function fetchData(action,params){
                var payload={action:action,username:getUserId()};
                if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}
                return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};});
            }
            function shuffleArray(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
            function hideLoader(){document.getElementById('loaderWrapper').style.display='none';document.getElementById('gameContent').classList.add('show');}

            async function getPlayerName(userId, fallback) {
                var result = await fetchData('getUser', { username: userId });
                if (result.ok && result.data && result.data.name) {
                    return result.data.name;
                }
                return fallback;
            }

            function checkTimeExpired(createdAt) {
                if (!createdAt) return false;
                var now = new Date();
                var created = new Date(createdAt);
                var diffMinutes = (now - created) / (1000 * 60);
                return diffMinutes >= GAME_TIME_LIMIT;
            }

            function handleTimeExpired() {
                clearInterval(timerInterval);
                clearInterval(checkInterval);
                isInGame = false;
                var result = isMyTurn ? '0' : '3';
                fetchData('updateLeagueResult', { leagueId: leagueCode, gameNum: currentGameIndex + 1, result: result });
                fetchData('updateGame', { gameId: currentGameId, updates: { status: 'finished' } });
                
                var html = '<div class="result-banner">';
                html += '<div class="result-icon"><i class="fa-solid fa-clock" style="color:#ef4444;"></i></div>';
                html += '<div class="result-text">وقت بازی تموم شد!</div>';
                if (isMyTurn) {
                    html += '<div class="result-score">تو نتونستی به موقع جواب بدی، حریفت برنده شد!</div>';
                } else {
                    html += '<div class="result-score">حریفت نتونست به موقع جواب بده، تو برنده شدی!</div>';
                }
                html += '<button class="result-btn" onclick="backToLeague()">بازگشت به لیگ</button></div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
            }

            function renderWaitingScreen() {
                var inviteLink = 'https://eitaa.com/gameland_app/Quizico?startapp=' + leagueCode + '&btn=بزن.بریم.🚀';
                var html = '<div class="waiting-card">';
                html += '<img class="waiting-image" src="' + SAD_IMAGE + '" alt="" draggable="false" oncontextmenu="return false;" ondragstart="return false;">';
                html += '<div class="waiting-text">منتظر ورود بازیکن‌ها...</div>';
                html += '<div class="room-code-display">' + leagueCode + '</div>';
                html += '<div class="invite-box">';
                html += '<div class="invite-box-title">دعوت از دوستان</div>';
                html += '<div class="invite-box-desc">لینک زیر رو کپی کن و برای دوستات بفرست تا وارد لیگ بشن!</div>';
                html += '<div class="invite-link-box">';
                html += '<span class="invite-link" id="inviteLink">' + inviteLink + '</span>';
                html += '<button class="copy-btn" onclick="copyInviteLink()">کپی</button>';
                html += '</div>';
                html += '</div>';
                html += '<div class="players-invite-section">';
                html += '<div class="coming-soon-overlay">به زودی</div>';
                html += '<div class="players-invite-title">انتخاب از لیست بازیکنا</div>';
                html += '<div class="players-search-box"><i class="fa-solid fa-search"></i><input type="text" placeholder="جستجوی بازیکن..."></div>';
                html += '<div class="players-invite-list"></div>';
                html += '</div>';
                html += '<div class="league-table"><div class="league-table-title">بازیکن‌های وارد شده</div><div id="leaguePlayersList"></div></div>';
                html += '</div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
                loadLeaguePlayers();
            }

            window.copyInviteLink = function() {
                var link = document.getElementById('inviteLink').textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(link).then(function() {
                        if (webApp) webApp.showAlert('لینک کپی شد!');
                    });
                }
                if (webApp) webApp.HapticFeedback?.impactOccurred('light');
            };

            async function loadLeaguePlayers() {
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    var playersHtml = '';
                    for (var i = 1; i <= 5; i++) {
                        if (result.data['player' + i]) {
                            var pId = String(result.data['player' + i]).split(',')[0];
                            var pName = await getPlayerName(pId, 'بازیکن ' + i);
                            playersHtml += '<div class="league-table-row"><span class="name">' + pName + ' ✅</span></div>';
                        } else {
                            playersHtml += '<div class="league-table-row"><span class="name">جای خالی ⬜</span></div>';
                        }
                    }
                    document.getElementById('leaguePlayersList').innerHTML = playersHtml;
                }
            }

            function renderLeagueTable() {
                var html = '<div class="league-table"><div class="league-table-title">جدول لیگ</div><div id="leagueTableBody"></div></div>';
                html += '<div class="games-list" id="leagueGamesList"></div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
                loadLeagueData();
            }

            async function loadLeagueData() {
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    var players = [];
                    for (var i = 1; i <= 5; i++) {
                        if (result.data['player' + i]) {
                            var pData = String(result.data['player' + i]).split(',');
                            var pId = pData[0];
                            var pName = await getPlayerName(pId, 'بازیکن ' + i);
                            players.push({ num: i, name: pName, pts: parseInt(pData[1]) || 0 });
                        }
                    }
                    players.sort(function(a, b) { return b.pts - a.pts; });
                    document.getElementById('leagueTableBody').innerHTML = players.map(function(p, idx) {
                        return '<div class="league-table-row"><span class="rank">#' + (idx+1) + '</span><span class="name">' + p.name + '</span><span class="pts">' + p.pts + ' امتیاز</span></div>';
                    }).join('');

                    var results = String(result.data.results || '').split(',').filter(function(r) { return r !== ''; });
                    var gamesHtml = '';
                    for (var j = 0; j < leagueMatches.length; j++) {
                        var m = leagueMatches[j];
                        var gameResult = results[j] || '';
                        var status = gameResult ? 'done' : 'waiting';
                        var statusText = gameResult ? 'انجام شد' : 'در انتظار';
                        
                        var p1Name = await getPlayerName(String(result.data['player' + m[0]]).split(',')[0], 'بازیکن ' + m[0]);
                        var p2Name = await getPlayerName(String(result.data['player' + m[1]]).split(',')[0], 'بازیکن ' + m[1]);
                        
                        gamesHtml += '<div class="game-item"><span>بازی ' + (j+1) + ':</span><span class="vs">' + p1Name + ' vs ' + p2Name + '</span><span class="status ' + status + '">' + statusText + '</span></div>';
                    }
                    document.getElementById('leagueGamesList').innerHTML = gamesHtml;
                }
            }

            function renderQuestionScreen() {
                isAnswered = false;
                isInGame = true;
                actionUsedThisQuestion = false;
                var q = currentQuestions[currentQuestionIndex];
                var opts = shuffleArray(q.options.slice());
                var ci = opts.indexOf(q.options[q.correctOption - 1]);
                var html = '<div class="actions-row">';
                html += '<button class="action-btn" id="btnRemove" onclick="useRemove50()"><i class="fa-solid fa-trash" style="color:#ef4444;"></i> ۵۰</button>';
                html += '<button class="action-btn" id="btnSwap" onclick="useSwapQuestion()"><i class="fa-solid fa-arrows-rotate" style="color:#06b6d4;"></i> ۱۰۰</button>';
                html += '<button class="action-btn" id="btnSkip" onclick="useSkipQuestion()"><i class="fa-solid fa-forward" style="color:#f59e0b;"></i> ۱۵۰</button>';
                html += '</div>';
                html += '<div class="question-card">';
                html += '<div class="question-text">' + q.question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" id="timerFill" style="width:100%;"></div></div>';
                html += '<div class="timer-text" id="timerText">60s</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < opts.length; i++) {
                    html += '<button class="option-btn" data-text="'+opts[i]+'" onclick="selectOption('+i+','+ci+',this)">';
                    html += '<span class="option-letter">'+(i+1)+'</span><span>'+opts[i]+'</span></button>';
                }
                html += '</div></div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
                startTimer();
            }

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = QUESTION_TIME;
                updateTimerBar();
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimerBar();
                    if (timeLeft <= 0) { clearInterval(timerInterval); if (!isAnswered) timeOut(); }
                }, 1000);
            }
            function updateTimerBar() {
                var f = document.getElementById('timerFill');
                var t = document.getElementById('timerText');
                if (!f || !t) return;
                var pct = (timeLeft / QUESTION_TIME) * 100;
                f.style.width = pct + '%';
                t.textContent = timeLeft + 's';
                f.className = 'timer-bar-fill' + (timeLeft <= 10 ? ' danger' : timeLeft <= 20 ? ' warning' : '');
            }
            function timeOut() {
                isAnswered = true;
                var btns = document.querySelectorAll('.option-btn');
                btns.forEach(function(b){b.classList.add('disabled');});
                var q = currentQuestions[currentQuestionIndex];
                var ct = q.options[q.correctOption - 1];
                document.querySelectorAll('.option-btn').forEach(function(b){ if(b.getAttribute('data-text')===ct) b.classList.add('selected-correct'); });
                setTimeout(goToNext, 800);
            }
            function goToNext() {
                currentQuestionIndex++;
                if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                    finishRound();
                } else {
                    renderQuestionScreen();
                }
            }

            window.selectOption = function(sel, ci, btn) {
                if (isAnswered) return;
                isAnswered = true;
                clearInterval(timerInterval);
                var btns = document.querySelectorAll('.option-btn');
                btns.forEach(function(b){b.classList.add('disabled');});
                if (sel === ci) { btn.classList.add('selected-correct'); myScore += 5; myCorrectCount++; myAnswers.push(true); }
                else { btn.classList.add('selected-wrong'); btns[ci].classList.add('selected-correct'); myAnswers.push(false); }
                setTimeout(goToNext, 800);
            };

            window.useRemove50 = function() {
                if (isAnswered || actionUsedThisQuestion) return;
                if (userCoins < 50) { if (webApp) webApp.showAlert('سکه کافی نداری!'); return; }
                userCoins -= 50;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                var q = currentQuestions[currentQuestionIndex];
                var ct = q.options[q.correctOption - 1];
                var wo = q.options.filter(function(o){return o!==ct;});
                var th = shuffleArray(wo).slice(0,2);
                document.querySelectorAll('.option-btn').forEach(function(b){ if(th.indexOf(b.getAttribute('data-text'))!==-1) b.classList.add('hidden-option'); });
                disableActions();
                fetchData('updateUser', { coins: userCoins });
            };

            window.useSwapQuestion = function() {
                if (isAnswered || actionUsedThisQuestion) return;
                if (userCoins < 100) { if (webApp) webApp.showAlert('سکه کافی نداری!'); return; }
                userCoins -= 100;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                var rem = questions.filter(function(q){return currentQuestions.indexOf(q)===-1;});
                if (rem.length > 0) currentQuestions[currentQuestionIndex] = shuffleArray(rem)[0];
                disableActions();
                fetchData('updateUser', { coins: userCoins });
                renderQuestionScreen();
            };

            window.useSkipQuestion = function() {
                if (isAnswered || actionUsedThisQuestion) return;
                if (userCoins < 150) { if (webApp) webApp.showAlert('سکه کافی نداری!'); return; }
                userCoins -= 150;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                myScore += 5;
                myCorrectCount++;
                myAnswers.push(true);
                disableActions();
                fetchData('updateUser', { coins: userCoins });
                clearInterval(timerInterval);
                setTimeout(goToNext, 300);
            };

            function disableActions(){ document.querySelectorAll('.action-btn').forEach(function(b){b.disabled=true;}); }

            function finishRound() {
                isInGame = false;
                roundResults.push({ myScore: myCorrectCount * 5, myCorrect: myCorrectCount, myAnswers: myAnswers });
                var ansStr = myAnswers.map(function(a) { return a ? 'T' : 'F'; }).join(',');
                var updateData = {};
                updateData['round' + currentRound + '_p' + (isCreator ? '1' : '2')] = ansStr;
                fetchData('updateGame', { gameId: currentGameId, updates: updateData });
                myCorrectCount = 0;
                myAnswers = [];
                currentRound++;
                currentQuestionIndex = 0;
                currentTurn++;
                
                if (currentRound > TOTAL_ROUNDS) {
                    endLeagueGame();
                } else {
                    checkTurn();
                }
            }

            function endLeagueGame() {
                isInGame = false;
                clearInterval(checkInterval);
                var result = '1';
                if (myScore > 0) result = '3';
                fetchData('updateLeagueResult', { leagueId: leagueCode, gameNum: currentGameIndex + 1, result: result });
                fetchData('updateGame', { gameId: currentGameId, updates: { status: 'finished' } });
                
                var html = '<div class="result-banner">';
                html += '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                html += '<div class="result-text">بازی تموم شد!</div>';
                html += '<div class="result-score">امتیاز تو: ' + myScore + '</div>';
                html += '<button class="result-btn" onclick="backToLeague()">بازگشت به لیگ</button></div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
            }

            window.backToLeague = function() {
                renderLeagueTable();
                checkInterval = setInterval(async function() {
                    var result = await fetchData('getLeague', { leagueId: leagueCode });
                    if (result.ok && result.data && result.data.winner) {
                        clearInterval(checkInterval);
                        showLeagueResults();
                    }
                }, 5000);
            };

            function checkTurn() {
                var myNum = isCreator ? 1 : 2;
                var isMyTurnNow = false;
                for (var i = 0; i < turnOrder.length; i++) {
                    if (turnOrder[i][0] === currentRound && turnOrder[i][1] === myNum) {
                        isMyTurnNow = (i === currentTurn);
                        break;
                    }
                }
                isMyTurn = isMyTurnNow;
                if (isMyTurnNow) {
                    loadRoundQuestions();
                    renderQuestionScreen();
                } else {
                    renderWaitingTurnScreen();
                }
            }

            function renderWaitingTurnScreen() {
                isInGame = false;
                var html = '<div class="result-banner">';
                html += '<div class="result-text">منتظر حریف...</div>';
                html += '<div class="result-score">بازی حداکثر ۶۰ دقیقه وقت داره</div>';
                html += '</div>';
                document.getElementById('gameContent').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                hideLoader();
            }

            function loadRoundQuestions() {
                var allShuffled = shuffleArray(questions);
                currentQuestions = allShuffled.slice(0, QUESTIONS_PER_ROUND);
            }

            window.handleMainBtn = function() {
                if (isMyTurn) {
                    loadRoundQuestions();
                    renderQuestionScreen();
                }
            };

            async function startLeagueGame(gameIndex) {
                currentGameIndex = gameIndex;
                currentGameId = leagueCode + '_game' + (gameIndex + 1);
                currentRound = 1;
                currentTurn = 0;
                myScore = 0;
                myCorrectCount = 0;
                myAnswers = [];
                roundResults = [];
                
                var match = leagueMatches[gameIndex];
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    var p1Data = String(result.data['player' + match[0]]).split(',');
                    var p2Data = String(result.data['player' + match[1]]).split(',');
                    
                    if (p1Data[0] === myUserId) { isCreator = true; currentOpponentId = p2Data[0]; }
                    else if (p2Data[0] === myUserId) { isCreator = false; currentOpponentId = p1Data[0]; }
                    else {
                        renderLeagueTable();
                        return;
                    }
                    
                    await fetchData('saveGame', {
                        gameData: {
                            id: currentGameId,
                            player1: p1Data[0],
                            player2: p2Data[0],
                            round1: '',
                            round2: '',
                            round3: '',
                            round4: '',
                            round5: '',
                            status: 'in_progress',
                            createdAt: new Date().toISOString()
                        }
                    });
                    
                    gameCreatedAt = new Date().toISOString();
                    
                    var qd = await fetchData('getQuestions', { limit: 50 });
                    if (qd.ok && Array.isArray(qd.data) && qd.data.length >= QUESTIONS_PER_ROUND) {
                        questions = qd.data;
                        checkTurn();
                        startTimeCheck();
                    }
                }
            }

            function startTimeCheck() {
                clearInterval(checkInterval);
                checkInterval = setInterval(async function() {
                    if (checkTimeExpired(gameCreatedAt)) {
                        handleTimeExpired();
                    }
                }, 30000);
            }

            async function showLeagueResults() {
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    var html = '<div class="result-banner">';
                    html += '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                    html += '<div class="result-text">لیگ تموم شد!</div>';
                    html += '<button class="result-btn" onclick="backToDashboard()">بازگشت</button></div>';
                    document.getElementById('gameContent').innerHTML = html;
                    document.getElementById('bottomBtnContainer').style.display = 'none';
                    hideLoader();
                }
            }

            window.backToDashboard = function() { window.location.href = '../../dashboard/'; };

            function handleBackButton() {
                if (isInGame) {
                    webApp.showConfirm('اگه خارج بشی این راند رو با ۰ تمام می‌کنی!', function(confirmed) {
                        if (confirmed) {
                            clearInterval(timerInterval);
                            var ansStr = 'F,F,F';
                            var updateData = {};
                            updateData['round' + currentRound + '_p' + (isCreator ? '1' : '2')] = ansStr;
                            fetchData('updateGame', { gameId: currentGameId, updates: updateData });
                            window.location.href = '../../dashboard/';
                        }
                    });
                } else {
                    window.location.href = '../../dashboard/';
                }
            }

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                    webApp.BackButton.show();
                    webApp.BackButton.onClick(handleBackButton);
                }
                
                var ud = await fetchData('getUser', {});
                if (ud.ok && ud.data) {
                    userCoins = ud.data.coins || 0;
                    document.getElementById('coinsHeader').textContent = userCoins;
                }
                
                myUserId = getUserId();
                var startParam = getStartParam();
                var savedLeague = localStorage.getItem('leagueCode');
                
                if (startParam) {
                    leagueCode = startParam;
                    localStorage.removeItem('leagueCode');
                    await initPlayer2();
                } else if (savedLeague) {
                    leagueCode = savedLeague;
                    localStorage.removeItem('leagueCode');
                    await initPlayer2();
                } else {
                    await initPlayer1();
                }
            }

            async function initPlayer1() {
                leagueCode = generateLeagueCode();
                isCreator = true;
                myUserId = getUserId();
                await fetchData('saveLeague', {
                    leagueId: leagueCode,
                    creator: myUserId
                });
                renderWaitingScreen();
                checkInterval = setInterval(async function() {
                    var result = await fetchData('getLeague', { leagueId: leagueCode });
                    if (result.ok && result.data) {
                        var count = 0;
                        for (var i = 1; i <= 5; i++) {
                            if (result.data['player' + i]) count++;
                        }
                        if (count === 5) {
                            clearInterval(checkInterval);
                            await startNextGame();
                        }
                    }
                }, 3000);
            }

            async function initPlayer2() {
                isCreator = false;
                myUserId = getUserId();
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    if (String(result.data.player1).split(',')[0] === myUserId) {
                        isCreator = true;
                        renderWaitingScreen();
                        checkInterval = setInterval(async function() {
                            var checkResult = await fetchData('getLeague', { leagueId: leagueCode });
                            if (checkResult.ok && checkResult.data) {
                                var count = 0;
                                for (var i = 1; i <= 5; i++) {
                                    if (checkResult.data['player' + i]) count++;
                                }
                                if (count === 5) {
                                    clearInterval(checkInterval);
                                    await startNextGame();
                                }
                            }
                        }, 3000);
                        return;
                    }
                    
                    var alreadyIn = false;
                    for (var j = 1; j <= 5; j++) {
                        if (result.data['player' + j] && String(result.data['player' + j]).split(',')[0] === myUserId) {
                            alreadyIn = true;
                            break;
                        }
                    }
                    
                    if (!alreadyIn) {
                        var joined = false;
                        for (var i = 2; i <= 5; i++) {
                            if (!result.data['player' + i]) {
                                await fetchData('joinLeague', { leagueId: leagueCode, userId: myUserId });
                                joined = true;
                                break;
                            }
                        }
                        
                        if (!joined) {
                            document.getElementById('gameContent').innerHTML = '<div class="result-banner"><div class="result-text">لیگ پره!</div></div>';
                            document.getElementById('bottomBtnContainer').style.display = 'none';
                            hideLoader();
                            return;
                        }
                    }
                    
                    renderWaitingScreen();
                    checkInterval = setInterval(async function() {
                        var checkResult = await fetchData('getLeague', { leagueId: leagueCode });
                        if (checkResult.ok && checkResult.data) {
                            var count = 0;
                            for (var i = 1; i <= 5; i++) {
                                if (checkResult.data['player' + i]) count++;
                            }
                            if (count === 5) {
                                clearInterval(checkInterval);
                                await startNextGame();
                            }
                        }
                    }, 3000);
                }
            }

            async function startNextGame() {
                var result = await fetchData('getLeague', { leagueId: leagueCode });
                if (result.ok && result.data) {
                    var results = String(result.data.results || '').split(',').filter(function(r) { return r !== ''; });
                    var nextGame = results.length;
                    
                    if (nextGame < 10) {
                        var match = leagueMatches[nextGame];
                        var p1Data = String(result.data['player' + match[0]]).split(',');
                        var p2Data = String(result.data['player' + match[1]]).split(',');
                        
                        if (p1Data[0] === myUserId || p2Data[0] === myUserId) {
                            await startLeagueGame(nextGame);
                        } else {
                            renderLeagueTable();
                            checkInterval = setInterval(async function() {
                                var checkResult = await fetchData('getLeague', { leagueId: leagueCode });
                                if (checkResult.ok && checkResult.data) {
                                    var checkResults = String(checkResult.data.results || '').split(',').filter(function(r) { return r !== ''; });
                                    if (checkResults.length > nextGame) {
                                        clearInterval(checkInterval);
                                        await startNextGame();
                                    }
                                }
                            }, 5000);
                        }
                    } else {
                        renderLeagueTable();
                        checkInterval = setInterval(async function() {
                            var checkResult = await fetchData('getLeague', { leagueId: leagueCode });
                            if (checkResult.ok && checkResult.data && checkResult.data.winner) {
                                clearInterval(checkInterval);
                                showLeagueResults();
                            }
                        }, 5000);
                    }
                }
            }

            init();
        })();
    </script>
</body>
</html>
