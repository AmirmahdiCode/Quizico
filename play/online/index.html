<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root{--bg:#faf5ff;--bg2:#f3e8ff;--bg3:#e9d5ff;--primary:#a855f7;--primary-dark:#9333ea;--primary-light:#c084fc;--primary-rgb:168,85,247;--dark:#1e1b2e;--text:#4a4458;--text-light:#6b7280;--white:#fff;--card-bg:#fff;--header-bg:#fff;--shadow:3px 3px 0 #000;--radius:12px;--border:1px solid #000;--gold:#f59e0b}
        [data-theme="dark"]{--bg:#1e1b2e;--bg2:#2d2a3e;--bg3:#3d3a4e;--primary:#c084fc;--primary-dark:#a855f7;--primary-light:#d8b4fe;--primary-rgb:192,132,252;--dark:#f1f5f9;--text:#e2e8f0;--text-light:#94a3b8;--white:#2d2a3e;--card-bg:#2d2a3e;--header-bg:#2d2a3e;--shadow:3px 3px 0 #000;--border:1px solid #475569}

        .bg-animation{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 40%,var(--bg3) 80%)}
        .header{position:relative;z-index:10;background:var(--header-bg);border-bottom:var(--border);padding:10px 16px;position:sticky;top:0;box-shadow:var(--shadow)}
        .header-inner{display:flex;align-items:center;justify-content:space-between;max-width:500px;margin:0 auto}
        .header-right{display:flex;align-items:center;gap:8px}
        .header-logo{width:38px;height:38px;border-radius:var(--radius);background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden;padding:2px;border:var(--border)}
        .header-logo img{width:95%;height:95%;object-fit:contain;transform:scale(1.1)}
        .header-title{font-size:14px;font-weight:800;color:var(--dark)}

        .loader{width:45px;height:45px;border:5px solid var(--bg3);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
        .loader-text{font-size:11px;font-weight:700;color:var(--text)}

        .game-content{display:none}
        .game-content.show{display:flex;flex-direction:column;gap:10px}
        .waiting-card{background:var(--card-bg);border:var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center}
        .waiting-image{width:100px;height:100px;object-fit:contain;margin:0 auto 10px;display:block}

        .invite-box-desc{font-size:8px;color:#9a3412;margin-bottom:8px;line-height:1.6}

        .invite-link{flex:1;font-size:8px;font-weight:600;color:#9a3412;direction:ltr;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .copy-btn{background:#f97316;color:#fff;border:1px solid #000;border-radius:6px;padding:6px 10px;cursor:pointer;font-family:'IRANSans',Tahoma,sans-serif;font-size:8px;font-weight:700;box-shadow:2px 2px 0 #000;flex-shrink:0}
        .copy-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
        .players-invite-section{margin-top:12px;text-align:right;opacity:0.5;pointer-events:none;position:relative}
        .players-invite-section .coming-soon-overlay{position:absolute;top:50%;right:50%;transform:translate(50%,-50%);background:#a855f7;color:#fff;font-size:9px;font-weight:800;padding:4px 16px;border-radius:20px;border:1px solid #000;box-shadow:2px 2px 0 #000;z-index:10}
        .players-invite-title{font-size:10px;font-weight:800;color:var(--dark);margin-bottom:8px;text-align:center}
        .players-search-box{position:relative;margin-bottom:8px}
        .players-search-box input{width:100%;padding:8px 35px 8px 10px;border:var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-family:inherit;font-size:9px;outline:none}
        .players-search-box i{position:absolute;top:50%;right:10px;transform:translateY(-50%);color:var(--text-light);font-size:11px}
        .players-invite-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
        .players-row{display:flex;gap:8px}
        .player-card{flex:1;background:var(--card-bg);border:var(--border);border-radius:var(--radius);padding:10px;text-align:center;box-shadow:var(--shadow)}
        .player-card.active{border-color:var(--gold);border-width:2px}
        .player-tag{font-size:9px;font-weight:800;color:var(--dark);margin-bottom:4px}
        .player-score{font-size:13px;font-weight:800;color:var(--gold)}
        .rounds-results{background:var(--card-bg);border:var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
        .rounds-title{font-size:10px;font-weight:800;color:var(--dark);margin-bottom:8px;text-align:center}
        .round-result-item{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:8px;padding:8px;margin-bottom:6px}
        .round-result-row{display:flex;align-items:center;justify-content:space-between;font-size:8px;padding:2px 0}
        .round-result-player{font-weight:700;color:var(--dark);min-width:25px}
        .round-dots{display:flex;gap:3px;flex:1;justify-content:center}
        .result-dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:800;border:var(--border);background:#10b981;color:#fff}
        .result-dot.wrong{background:#ef4444}
        .round-result-count{font-weight:800;font-size:8px;color:var(--dark)}
        .question-card{background:var(--card-bg);border:var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
        .question-text{font-size:11px;font-weight:700;color:var(--dark);line-height:1.7;text-align:center;margin-bottom:8px}
        .timer-bar-container{background:var(--bg3);border:var(--border);border-radius:8px;height:6px;overflow:hidden;margin-bottom:4px}
        .timer-bar-fill{height:100%;background:#10b981;transition:width 1s linear}
        .timer-bar-fill.warning{background:#f59e0b}
        .timer-bar-fill.danger{background:#ef4444}
        .timer-text{font-size:7px;font-weight:700;color:var(--text-light);text-align:center;margin-bottom:8px}
        .options-grid{display:flex;flex-direction:column;gap:6px}
        .option-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border:var(--border);border-radius:8px;background:var(--bg2);cursor:pointer;transition:all .2s ease;box-shadow:2px 2px 0 #000;font-family:'IRANSans',Tahoma,sans-serif;font-size:10px;font-weight:600;color:var(--dark);text-align:right}
        .option-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
        .option-btn.selected-correct{background:#10b981;color:#fff}
        .option-btn.selected-wrong{background:#ef4444;color:#fff}
        .option-btn.disabled{pointer-events:none;opacity:.6}
        .option-btn.hidden-option{opacity:.2;pointer-events:none;text-decoration:line-through}
        .option-letter{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;border:var(--border)}
        .actions-row{display:flex;gap:6px;margin-bottom:8px}
        .action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;padding:7px;border:var(--border);border-radius:8px;background:var(--card-bg);cursor:pointer;box-shadow:2px 2px 0 #000;font-family:'IRANSans',Tahoma,sans-serif;font-size:8px;font-weight:700;color:var(--dark)}
        .action-btn:disabled{opacity:.3;cursor:not-allowed}
        .bottom-btn-container{position:fixed;bottom:0;right:0;left:0;padding:8px 16px;background:var(--header-bg);border-top:var(--border);z-index:100}
        .main-btn{width:100%;max-width:500px;margin:0 auto;display:block;padding:10px;background:var(--gold);color:#fff;border:var(--border);border-radius:8px;font-family:'IRANSans',Tahoma,sans-serif;font-size:11px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 #000}
        .main-btn:disabled{opacity:.5;cursor:not-allowed}
        .main-btn.green{background:#10b981}
        .main-btn.waiting{background:var(--text-light)}
        .result-banner{text-align:center;padding:20px;background:var(--card-bg);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
        .result-icon{font-size:40px;margin-bottom:8px}
        .result-text{font-size:14px;font-weight:800;color:var(--dark);margin-bottom:6px}
        .result-score{font-size:10px;color:var(--text-light);margin-bottom:10px}
        .result-btn{display:inline-block;padding:8px 20px;background:var(--primary);color:#fff;border:var(--border);border-radius:8px;font-family:'IRANSans',Tahoma,sans-serif;font-size:10px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 #000;margin:4px}
        .submitting-loader{width:50px;height:50px;border:5px solid var(--bg3);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
    </style>
</head>
<body>
<div class="bg-animation"></div>
<header class="header">
    <div class="header-inner">
        <div class="header-right">
            <div class="header-logo"><img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico" draggable="false" oncontextmenu="return false;" ondragstart="return false;"></div>
            <div>
                <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                <div class="header-subtitle" data-i18n="online">آنلاین</div>
            </div>
        </div>
        <span class="currency-badge coins"><i class="fa-solid fa-coins"></i> <span id="coinsHeader">0</span></span>
    </div>
</header>
<main class="main-container">

        <div class="loader"></div>
        <div class="loader-text" data-i18n="loading">در حال دریافت...</div>
    </div>
    <div class="game-content" id="gameContent"></div>
</main>
<div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
    <button class="main-btn" id="mainBtn" onclick="handleMainBtn()" data-i18n="start_game">شروع بازی</button>
</div>
<script>
(function(){
var webApp=window.Eitaa?.WebApp;
var API_URL='https://script.google.com/macros/s/AKfycbyHQXQ0TffhGyW1MdtI-_sWlZMhLSPDCR3Az5dDkuwv9TJt1o6-f_aCOg_aHJnty_8P/exec';
var SAD_IMAGE='https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';
var TOTAL_ROUNDS=5;
var QUESTIONS_PER_ROUND=3;
var QUESTION_TIME=60;
var GAME_TIME_LIMIT=60;
var currentRound=1;
var currentQuestionIndex=0;
var myScore=0;
var myCorrectCount=0;
var questions=[];
var roundQuestions=[];
var roundResults=[];
var timerInterval=null;
var timeLeft=QUESTION_TIME;
var roomCode=null;
var isPlayer1=false;
var checkInterval=null;
var myUserId='';
var myAnswers=[];
var isAnswered=false;
var currentLang='fa';
var userCoins=0;
var actionUsedThisQuestion=false;
var isInGame=false;
var isSubmitting=false;
var gameCreatedAt='';
var myName='';
var opponentName='';
var turnOrder=[[1,1],[1,2],[2,2],[2,1],[3,1],[3,2],[4,2],[4,1],[5,1],[5,2]];
var currentTurn=0;

var translations={
fa:{online:'آنلاین',loading:'در حال دریافت...',start_game:'شروع بازی',you:'تو',opponent:'حریف',results:'نتایج راندها',round:'راند',finished:'بازی تمام شد!',score:'امتیاز',back:'بازگشت',no_questions:'سوال کافی نیست',room_full:'دیر اومدی! یکی دیگه زودتر وارد شده',create_new_room:'ساخت اتاق جدید',waiting_opponent:'هنوز حریفت وارد نشده...',invite_title:'دعوت از دوست',invite_desc:'لینک زیر رو کپی کن و برای دوستت بفرست!',copy:'کپی',link_copied:'لینک کپی شد!',invite_from_players:'انتخاب از لیست بازیکنا',search_players:'جستجوی بازیکن...',not_enough:'سکه کافی نداری!',waiting_turn:'منتظر حریف...',your_turn:'نوبت توست',coming_soon:'به زودی',room_not_found:'اتاق یافت نشد',time_expired:'وقت بازی تموم شد!',exit_confirm:'اگه خارج بشی این راند رو با ۰ تمام می‌کنی!',submitting:'در حال ثبت پاسخ‌ها...',submitting_wait:'لطفاً صبر کنید'},
en:{online:'Online',loading:'Loading...',start_game:'Start Game',you:'You',opponent:'Opponent',results:'Round Results',round:'Round',finished:'Game Over!',score:'Score',back:'Back',no_questions:'Not enough questions',room_full:'Too late! Someone else joined',create_new_room:'Create New Room',waiting_opponent:'Waiting for opponent...',invite_title:'Invite Friend',invite_desc:'Copy the link below and send it to your friend!',copy:'Copy',link_copied:'Link copied!',invite_from_players:'Invite from players',search_players:'Search players...',not_enough:'Not enough coins!',waiting_turn:'Waiting for opponent...',your_turn:'Your turn',coming_soon:'Coming Soon',room_not_found:'Room not found',time_expired:'Time expired!',exit_confirm:'If you leave, this round will be 0!',submitting:'Saving answers...',submitting_wait:'Please wait'},
ar:{online:'عبر الإنترنت',loading:'جار التحميل...',start_game:'ابدأ اللعبة',you:'أنت',opponent:'الخصم',results:'نتائج الجولات',round:'جولة',finished:'انتهت اللعبة!',score:'النقاط',back:'رجوع',no_questions:'أسئلة غير كافية',room_full:'متأخر! شخص آخر انضم',create_new_room:'إنشاء غرفة جديدة',waiting_opponent:'بانتظار الخصم...',invite_title:'دعوة صديق',invite_desc:'انسخ الرابط أدناه وأرسله إلى صديقك!',copy:'نسخ',link_copied:'تم نسخ الرابط!',invite_from_players:'اختر من اللاعبين',search_players:'ابحث عن لاعب...',not_enough:'عملات غير كافية!',waiting_turn:'بانتظار الخصم...',your_turn:'دورك',coming_soon:'قريبًا',room_not_found:'الغرفة غير موجودة',time_expired:'انتهى الوقت!',exit_confirm:'إذا غادرت، ستكون هذه الجولة 0!',submitting:'جار حفظ الإجابات...',submitting_wait:'يرجى الانتظار'}
};

function getSettings(){try{var raw=localStorage.getItem('quizicoSettings');if(!raw)return{theme:'light',primaryColor:'#a855f7',animation:true,language:'fa'};var p=JSON.parse(raw);if(!p.theme)p.theme='light';if(!p.primaryColor)p.primaryColor='#a855f7';if(p.animation===undefined)p.animation=true;if(!p.language)p.language='fa';return p;}catch(e){return{theme:'light',primaryColor:'#a855f7',animation:true,language:'fa'}}}
function getTranslation(k){var t=translations[currentLang]||translations.fa;return t[k]||translations.fa[k]||k}
function hexToRgb(h){var r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:168,g:85,b:247}}
function shadeColor(c,p){var r=hexToRgb(c);var rr=Math.max(0,Math.min(255,r.r+p));var gg=Math.max(0,Math.min(255,r.g+p));var bb=Math.max(0,Math.min(255,r.b+p));return '#'+((1<<24)+(rr<<16)+(gg<<8)+bb).toString(16).slice(1)}
function applyTheme(){var s=getSettings();currentLang=s.language||'fa';var t=s.theme||'light';var p=s.primaryColor||'#a855f7';document.documentElement.setAttribute('data-theme',t);if(t==='dark'){document.documentElement.style.setProperty('--primary',shadeColor(p,40));}else{document.documentElement.style.setProperty('--primary',p);}if(s.animation===false){document.documentElement.setAttribute('data-animation','off');}else{document.documentElement.removeAttribute('data-animation');}if(currentLang==='en'){document.documentElement.setAttribute('dir','ltr');document.body.style.fontFamily='Arial, sans-serif';}else if(currentLang==='ar'){document.documentElement.setAttribute('dir','rtl');document.body.style.fontFamily='Tahoma, sans-serif';}else{document.documentElement.setAttribute('dir','rtl');document.body.style.fontFamily="'IRANSans', Tahoma, sans-serif";}document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');var t2=translations[currentLang]||translations.fa;if(t2[k])el.textContent=t2[k];});}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function translateGoogle(text,tl){var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=fa&tl='+tl+'&dt=t&q='+encodeURIComponent(text);return fetch(url).then(function(r){return r.json();}).then(function(d){return d&&d[0]&&d[0][0]?d[0][0][0]:null;}).catch(function(){return null;});}
function translateMyMemory(text,tl){var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=fa|'+tl;return fetch(url).then(function(r){return r.json();}).then(function(d){return d&&d.responseData&&d.responseData.translatedText?d.responseData.translatedText:null;}).catch(function(){return null;});}
async function translateText(text,tl){if(tl==='fa')return text;var r=await translateGoogle(text,tl);if(r)return r;await sleep(100);r=await translateMyMemory(text,tl);if(r)return r;return text;}
async function translateQuestion(q,lang){if(lang==='fa')return q;var tl=lang==='en'?'en':'ar';var tq=await translateText(q.question,tl);await sleep(80);var topts=[];for(var i=0;i<q.options.length;i++){topts.push(await translateText(q.options[i],tl));await sleep(80);}return{id:q.id,question:tq,options:topts,correctOption:q.correctOption};}

document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('copy',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault();});
document.addEventListener('cut',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault();});

function getEitaaUser(){return webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.user?webApp.initDataUnsafe.user:null}
function getUserId(){var u=getEitaaUser();return u?(typeof u.id==='number'?u.id.toString():String(u.id||'')):''}
function getStartParam(){if(webApp&&webApp.initDataUnsafe&&webApp.initDataUnsafe.start_param)return webApp.initDataUnsafe.start_param;return ''}
function generateRoomCode(){var c='G';for(var i=0;i<5;i++){c+=Math.floor(Math.random()*10);}return c}
function fetchData(action,params){var payload={action:action,username:getUserId()};if(params){for(var k in params){if(params.hasOwnProperty(k))payload[k]=params[k];}}return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{ok:false};})}
function shuffleArray(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
function hideLoader(){document.getElementById('loaderWrapper').style.display='none';document.getElementById('gameContent').classList.add('show');}
function getMyPlayerNum(){return isPlayer1?1:2}

function checkTimeExpired(createdAt){if(!createdAt)return false;var now=new Date();var created=new Date(createdAt);return (now-created)/(1000*60)>=GAME_TIME_LIMIT;}

function handleTimeExpired(){
    clearInterval(timerInterval);clearInterval(checkInterval);isInGame=false;isSubmitting=false;
    fetchData('updateGame',{gameId:roomCode,updates:{status:'finished'}});
    var t=getTranslation;
    var html='<div class="result-banner">';
    html+='<div class="result-icon"><i class="fa-solid fa-clock" style="color:#ef4444;"></i></div>';
    html+='<div class="result-text">'+t('time_expired')+'</div>';
    html+='<button class="result-btn" onclick="backToDashboard()">'+t('back')+'</button></div>';
    document.getElementById('gameContent').innerHTML=html;
    document.getElementById('bottomBtnContainer').style.display='none';
    hideLoader();
}

function renderWaitingScreen(){
    var t=getTranslation;
    var inviteLink='https://eitaa.com/gameland_app/Quizico?startapp='+roomCode+'&btn=بزن.بریم.🚀';

    html+='<div class="invite-box">';
    html+='<div class="invite-box-title">'+t('invite_title')+'</div>';
    html+='<div class="invite-box-desc">'+t('invite_desc')+'</div>';

    html+='<span class="invite-link" id="inviteLink">'+inviteLink+'</span>';

};

function renderRoomFullScreen(){
    var t=getTranslation;
    var html='<div class="result-banner">';
    html+='<div class="result-icon"><i class="fa-solid fa-user-clock" style="color:#f59e0b;"></i></div>';
    html+='<div class="result-text">'+t('room_full')+'</div>';
    html+='<button class="result-btn" onclick="createNewRoom()">'+t('create_new_room')+'</button></div>';
    document.getElementById('gameContent').innerHTML=html;
    document.getElementById('bottomBtnContainer').style.display='none';
    hideLoader();
}
window.createNewRoom=function(){initPlayer1();};

function renderRoundsScreen(){
    var t=getTranslation;
    var html='';
    html+='<div class="players-row">';
    html+='<div class="player-card"><div class="player-tag">'+myName+'</div><span class="player-score">'+myScore+'</span></div>';
    html+='<div class="player-card"><div class="player-tag">'+opponentName+'</div><span class="player-score">?</span></div>';
    html+='</div>';
    if(roundResults.length>0){
        html+='<div class="rounds-results"><div class="rounds-title">'+t('results')+'</div>';
        for(var i=0;i<roundResults.length;i++){
            var r=roundResults[i];
            html+='<div class="round-result-item">';
            html+='<div class="round-result-row"><span class="round-result-player">'+t('round')+' '+(i+1)+'</span></div>';
            html+='<div class="round-result-row"><span class="round-result-player">'+myName+'</span><div class="round-dots">';
            for(var j=0;j<QUESTIONS_PER_ROUND;j++)html+='<span class="result-dot'+(j<r.myCorrect?'':' wrong')+'">'+(j+1)+'</span>';
            html+='</div><span class="round-result-count">+'+r.myScore+'</span></div></div>';
        }
        html+='</div>';
    }
    document.getElementById('gameContent').innerHTML=html;
    var btn=document.getElementById('mainBtn');
    var myNum=getMyPlayerNum();
    var isMyTurnNow=false;
    for(var i=0;i<turnOrder.length;i++){if(turnOrder[i][0]===currentRound&&turnOrder[i][1]===myNum){isMyTurnNow=(i===currentTurn);break;}}
    if(isMyTurnNow){btn.textContent=t('your_turn')+' - '+t('start_game')+' '+currentRound;btn.className='main-btn green';btn.disabled=false;}
    else{btn.textContent=t('waiting_turn');btn.className='main-btn waiting';btn.disabled=true;}
    document.getElementById('bottomBtnContainer').style.display='block';
    hideLoader();
}

function renderQuestionScreen(){
    var t=getTranslation;
    isAnswered=false;isInGame=true;actionUsedThisQuestion=false;
    var q=roundQuestions[currentQuestionIndex];
    var opts=shuffleArray(q.options.slice());
    var ci=opts.indexOf(q.options[q.correctOption-1]);
    var html='<div class="actions-row">';
    html+='<button class="action-btn" onclick="useRemove50()"><i class="fa-solid fa-trash" style="color:#ef4444;"></i> ۵۰</button>';
    html+='<button class="action-btn" onclick="useSwapQuestion()"><i class="fa-solid fa-arrows-rotate" style="color:#06b6d4;"></i> ۱۰۰</button>';
    html+='<button class="action-btn" onclick="useSkipQuestion()"><i class="fa-solid fa-forward" style="color:#f59e0b;"></i> ۱۵۰</button></div>';
    html+='<div class="question-card">';
    html+='<div class="question-text">'+q.question+'</div>';
    html+='<div class="timer-bar-container"><div class="timer-bar-fill" id="timerFill" style="width:100%;"></div></div>';
    html+='<div class="timer-text" id="timerText">60s</div>';
    html+='<div class="options-grid">';
    for(var i=0;i<opts.length;i++){
        html+='<button class="option-btn" data-text="'+opts[i]+'" onclick="selectOption('+i+','+ci+',this)">';
        html+='<span class="option-letter">'+(i+1)+'</span><span>'+opts[i]+'</span></button>';
    }
    html+='</div></div>';
    document.getElementById('gameContent').innerHTML=html;
    document.getElementById('bottomBtnContainer').style.display='none';
    hideLoader();
    startTimer();
}

function startTimer(){clearInterval(timerInterval);timeLeft=QUESTION_TIME;updateTimerBar();timerInterval=setInterval(function(){timeLeft--;updateTimerBar();if(timeLeft<=0){clearInterval(timerInterval);if(!isAnswered)timeOut();}},1000);}
function updateTimerBar(){var f=document.getElementById('timerFill');var t=document.getElementById('timerText');if(!f||!t)return;var pct=(timeLeft/QUESTION_TIME)*100;f.style.width=pct+'%';t.textContent=timeLeft+'s';f.className='timer-bar-fill'+(timeLeft<=10?' danger':timeLeft<=20?' warning':'');}
function timeOut(){isAnswered=true;var btns=document.querySelectorAll('.option-btn');btns.forEach(function(b){b.classList.add('disabled');});var q=roundQuestions[currentQuestionIndex];var ct=q.options[q.correctOption-1];document.querySelectorAll('.option-btn').forEach(function(b){if(b.getAttribute('data-text')===ct)b.classList.add('selected-correct');});setTimeout(goToNext,800);}
function goToNext(){currentQuestionIndex++;if(currentQuestionIndex>=QUESTIONS_PER_ROUND){finishRound();}else{renderQuestionScreen();}}

window.selectOption=function(sel,ci,btn){
    if(isAnswered)return;
    isAnswered=true;clearInterval(timerInterval);
    var btns=document.querySelectorAll('.option-btn');btns.forEach(function(b){b.classList.add('disabled');});
    if(sel===ci){btn.classList.add('selected-correct');myScore+=5;myCorrectCount++;myAnswers.push(true);}
    else{btn.classList.add('selected-wrong');btns[ci].classList.add('selected-correct');myAnswers.push(false);}
    setTimeout(goToNext,800);
};

window.useRemove50=function(){
    if(isAnswered||actionUsedThisQuestion)return;
    if(userCoins<50){if(webApp)webApp.showAlert(getTranslation('not_enough'));return;}
    userCoins-=50;actionUsedThisQuestion=true;document.getElementById('coinsHeader').textContent=userCoins;
    var q=roundQuestions[currentQuestionIndex];var ct=q.options[q.correctOption-1];
    var wo=q.options.filter(function(o){return o!==ct;});var th=shuffleArray(wo).slice(0,2);
    document.querySelectorAll('.option-btn').forEach(function(b){if(th.indexOf(b.getAttribute('data-text'))!==-1)b.classList.add('hidden-option');});
    disableActions();fetchData('updateUser',{coins:userCoins});
};
window.useSwapQuestion=function(){
    if(isAnswered||actionUsedThisQuestion)return;
    if(userCoins<100){if(webApp)webApp.showAlert(getTranslation('not_enough'));return;}
    userCoins-=100;actionUsedThisQuestion=true;document.getElementById('coinsHeader').textContent=userCoins;
    var rem=questions.filter(function(q){return roundQuestions.indexOf(q)===-1;});
    if(rem.length>0)roundQuestions[currentQuestionIndex]=shuffleArray(rem)[0];
    disableActions();fetchData('updateUser',{coins:userCoins});renderQuestionScreen();
};
window.useSkipQuestion=function(){
    if(isAnswered||actionUsedThisQuestion)return;
    if(userCoins<150){if(webApp)webApp.showAlert(getTranslation('not_enough'));return;}
    userCoins-=150;actionUsedThisQuestion=true;document.getElementById('coinsHeader').textContent=userCoins;
    myScore+=5;myCorrectCount++;myAnswers.push(true);
    disableActions();fetchData('updateUser',{coins:userCoins});clearInterval(timerInterval);setTimeout(goToNext,300);
};
function disableActions(){document.querySelectorAll('.action-btn').forEach(function(b){b.disabled=true;});}

function showSubmittingScreen(){
    var t=getTranslation;
    var html='<div class="result-banner">';
    html+='<div class="submitting-loader"></div>';
    html+='<div class="result-text">'+t('submitting')+'</div>';
    html+='<div class="result-score">'+t('submitting_wait')+'</div></div>';
    document.getElementById('gameContent').innerHTML=html;
    document.getElementById('bottomBtnContainer').style.display='none';
    hideLoader();
}

function finishRound(){
    isInGame=false;isSubmitting=true;
    showSubmittingScreen();
    
    var qIds=roundQuestions.map(function(q){return q.id;}).join(',');
    var ansStr=myAnswers.map(function(a){return a?'T':'F';}).join(',');
    var myNum=getMyPlayerNum();
    
    fetchData('getGame',{gameId:roomCode}).then(function(gameResult){
        if(gameResult.ok&&gameResult.data){
            var currentRoundData=gameResult.data['round'+currentRound]||'';
            
            if(currentRoundData===''){
                if(myNum===1){
                    currentRoundData='['+qIds+']['+ansStr+'][waiting]';
                }else{
                    currentRoundData='['+qIds+'][waiting]['+ansStr+']';
                }
            }else{
                var parts=currentRoundData.split('][');
                if(myNum===1){
                    var p2Ans=parts[2]?parts[2].replace(']','').replace('[',''):'waiting';
                    currentRoundData='['+qIds+']['+ansStr+']['+p2Ans+']';
                }else{
                    var p1Ans=parts[1]?parts[1].replace(']','').replace('[',''):'waiting';
                    currentRoundData='['+qIds+']['+p1Ans+']['+ansStr+']';
                }
            }
            
            var updateData={};
            updateData['round'+currentRound]=currentRoundData;
            
            fetchData('updateGame',{gameId:roomCode,updates:updateData}).then(function(result){
                isSubmitting=false;
                if(result.ok){
                    roundResults.push({myAnswers:myAnswers,myScore:myCorrectCount*5,myCorrect:myCorrectCount});
                    myCorrectCount=0;myAnswers=[];currentRound++;currentQuestionIndex=0;currentTurn++;
                    if(currentRound>TOTAL_ROUNDS){endGame();}else{renderRoundsScreen();}
                }else{
                    showSubmittingScreen();
                    setTimeout(function(){finishRound();},2000);
                }
            });
        }else{
            isSubmitting=false;
            showSubmittingScreen();
            setTimeout(function(){finishRound();},2000);
        }
    });
}

function endGame(){
    isInGame=false;clearInterval(timerInterval);clearInterval(checkInterval);
    var t=getTranslation;
    var html='<div class="result-banner">';
    html+='<div class="result-icon"><i class="fa-solid fa-flag-checkered" style="color:#f59e0b;"></i></div>';
    html+='<div class="result-text">'+t('finished')+'</div>';
    html+='<div class="result-score">'+t('score')+': '+myScore+'</div>';
    html+='<button class="result-btn" onclick="backToDashboard()">'+t('back')+'</button></div>';
    document.getElementById('gameContent').innerHTML=html;
    document.getElementById('bottomBtnContainer').style.display='none';
    hideLoader();fetchData('updateGame',{gameId:roomCode,updates:{status:'finished'}});
}
window.backToDashboard=function(){window.location.href='../../dashboard/';};

window.handleMainBtn=function(){
    var myNum=getMyPlayerNum();var isMyTurnNow=false;
    for(var i=0;i<turnOrder.length;i++){if(turnOrder[i][0]===currentRound&&turnOrder[i][1]===myNum){isMyTurnNow=(i===currentTurn);break;}}
    if(isMyTurnNow){
        var allShuffled=shuffleArray(questions);
        roundQuestions=allShuffled.slice(0,QUESTIONS_PER_ROUND);
        renderQuestionScreen();
    }
};

async function getPlayerName(userId,fallback){
    var result=await fetchData('getUser',{username:userId});
    if(result.ok&&result.data&&result.data.name)return result.data.name;
    return fallback;
}

async function initPlayer1(){
    roomCode=generateRoomCode();isPlayer1=true;myUserId=getUserId();
    myName=await getPlayerName(myUserId,getTranslation('you'));
    await fetchData('saveGame',{gameData:{id:roomCode,player1:myUserId,player2:'',round1:'',round2:'',round3:'',round4:'',round5:'',status:'waiting',createdAt:new Date().toISOString()}});
    gameCreatedAt=new Date().toISOString();
    renderWaitingScreen();
    checkInterval=setInterval(async function(){
        var gameResult=await fetchData('getGame',{gameId:roomCode});
        if(gameResult.ok&&gameResult.data){
            var data=gameResult.data;
            if(data.player2&&data.player2!==''&&String(data.player2)!==String(myUserId)){
                clearInterval(checkInterval);
                opponentName=await getPlayerName(data.player2,getTranslation('opponent'));
                await fetchData('updateGame',{gameId:roomCode,updates:{status:'in_progress'}});
                await startOnlineGame();
            }
        }
        if(checkTimeExpired(gameCreatedAt)){clearInterval(checkInterval);fetchData('updateGame',{gameId:roomCode,updates:{status:'finished'}});}
    },3000);
}

async function initPlayer2(){
    isPlayer1=false;myUserId=getUserId();
    myName=await getPlayerName(myUserId,getTranslation('you'));
    var gameResult=await fetchData('getGame',{gameId:roomCode});
    if(!gameResult.ok||!gameResult.data){
        var t=getTranslation;
        document.getElementById('gameContent').innerHTML='<div class="result-banner"><div class="result-text">'+t('room_not_found')+'</div></div>';
        document.getElementById('bottomBtnContainer').style.display='none';hideLoader();return;
    }
    var data=gameResult.data;
    gameCreatedAt=data.createdAt||new Date().toISOString();
    
    if(String(data.player1)===String(myUserId)){
        isPlayer1=true;
        if(data.player2)opponentName=await getPlayerName(data.player2,getTranslation('opponent'));
        await startOnlineGame();
        return;
    }
    
    if(data.player2&&String(data.player2)===String(myUserId)){
        isPlayer1=false;
        opponentName=await getPlayerName(data.player1,getTranslation('opponent'));
        await startOnlineGame();
        return;
    }
    
    if(!data.player2||data.player2===''){
        await fetchData('updateGame',{gameId:roomCode,updates:{player2:myUserId,status:'in_progress'}});
        isPlayer1=false;
        opponentName=await getPlayerName(data.player1,getTranslation('opponent'));
        await startOnlineGame();
        return;
    }
    
    renderRoomFullScreen();
}

async function startOnlineGame(){
    if(!opponentName)opponentName=getTranslation('opponent');
    if(!myName)myName=getTranslation('you');
    
    var ud=await fetchData('getUser',{});
    if(ud.ok&&ud.data){userCoins=ud.data.coins||0;document.getElementById('coinsHeader').textContent=userCoins;}
    var qd=await fetchData('getQuestions',{limit:50});
    if(qd.ok&&Array.isArray(qd.data)&&qd.data.length>=QUESTIONS_PER_ROUND){
        questions=qd.data;
        if(currentLang!=='fa'){var translated=[];for(var i=0;i<questions.length;i++){translated.push(await translateQuestion(questions[i],currentLang));}questions=translated;}
        renderRoundsScreen();startPolling();
    }else{
        var t=getTranslation;
        document.getElementById('gameContent').innerHTML='<div class="result-banner"><div class="result-text">'+t('no_questions')+'</div></div>';
        document.getElementById('bottomBtnContainer').style.display='none';hideLoader();
    }
}

function startPolling(){
    clearInterval(checkInterval);
    checkInterval=setInterval(async function(){
        if(checkTimeExpired(gameCreatedAt)){handleTimeExpired();return;}
        var gameResult=await fetchData('getGame',{gameId:roomCode});
        if(gameResult.ok&&gameResult.data){
            var data=gameResult.data;
            if(data.status==='finished'){clearInterval(checkInterval);endGame();return;}
            
            var currentRoundData=data['round'+currentRound]||'';
            if(currentRoundData!==''&&!currentRoundData.includes('waiting')){
                var btn=document.getElementById('mainBtn');
                if(btn&&btn.disabled){
                    renderRoundsScreen();
                }
            }
        }
    },3000);
}

function handleBackButton(){
    if(isSubmitting){
        if(webApp)webApp.showAlert(getTranslation('submitting'));
        return;
    }
    if(isInGame){
        webApp.showConfirm(getTranslation('exit_confirm'),function(confirmed){
            if(confirmed){
                clearInterval(timerInterval);
                var ansStr='F,F,F';
                var qIds=roundQuestions.map(function(q){return q.id;}).join(',');
                var myNum=getMyPlayerNum();
                var updateData={};
                updateData['round'+currentRound+'_p'+myNum]=ansStr;
                fetchData('updateGame',{gameId:roomCode,updates:updateData});
                window.location.href='../../dashboard/';
            }
        });
    }else{
        window.location.href='../../dashboard/';
    }
}

async function init(){
    applyTheme();
    if(webApp){webApp.ready();webApp.expand();webApp.BackButton.show();webApp.BackButton.onClick(handleBackButton);}
    myUserId=getUserId();
    var startParam=getStartParam();
    var savedRoom=localStorage.getItem('onlineRoomCode');
    if(startParam){roomCode=startParam;localStorage.removeItem('onlineRoomCode');await initPlayer2();}
    else if(savedRoom){roomCode=savedRoom;localStorage.removeItem('onlineRoomCode');await initPlayer2();}
    else{await initPlayer1();}
}

init();
})();
</script>
