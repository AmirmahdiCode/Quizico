<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دو نفره آنلاین | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 8px 16px;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 500px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.1);
        }

        .header-title { font-size: 14px; font-weight: 800; }
        .header-title .t-accent { color: var(--primary); }
        .header-subtitle { font-size: 8px; color: var(--text-light); }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 8px auto;
            padding: 0 10px 80px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .loader-letters {
            display: flex;
            gap: 3px;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            direction: ltr;
        }

        .loader-letter {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            opacity: 0;
            animation: letterBounce 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .loader-letter:nth-child(1) { animation-delay: 0.1s; }
        .loader-letter:nth-child(2) { animation-delay: 0.15s; }
        .loader-letter:nth-child(3) { animation-delay: 0.2s; }
        .loader-letter:nth-child(4) { animation-delay: 0.25s; }
        .loader-letter:nth-child(5) { animation-delay: 0.3s; color: #f59e0b; }
        .loader-letter:nth-child(6) { animation-delay: 0.35s; color: #f59e0b; }
        .loader-letter:nth-child(7) { animation-delay: 0.4s; color: #f59e0b; }

        @keyframes letterBounce {
            0% { opacity: 0; transform: translateY(-20px) scale(0.3); }
            50% { opacity: 1; transform: translateY(5px) scale(1.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .waiting-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .waiting-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 10px;
            display: block;
        }

        .waiting-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .invite-link-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg2);
            border: var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
        }

        .invite-link {
            flex: 1;
            font-size: 9px;
            font-weight: 600;
            color: var(--text);
            direction: ltr;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 700;
            box-shadow: 2px 2px 0 #000;
            flex-shrink: 0;
        }

        .copy-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }

        .players-row {
            display: flex;
            gap: 6px;
        }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .player-tag { font-size: 9px; font-weight: 800; }
        .player-score { font-size: 13px; font-weight: 800; color: var(--gold); }

        .rounds-results {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 8px;
            box-shadow: var(--shadow);
        }

        .rounds-title { font-size: 9px; font-weight: 800; margin-bottom: 6px; text-align: center; }

        .round-result-item {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 6px;
            margin-bottom: 4px;
        }

        .round-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 8px;
            padding: 1px 0;
        }

        .round-result-player { font-weight: 700; min-width: 25px; }

        .round-dots {
            display: flex;
            gap: 3px;
            flex: 1;
            justify-content: center;
        }

        .result-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
            font-weight: 800;
            border: 1px solid #000;
            background: #10b981;
            color: #fff;
        }

        .result-dot.wrong { background: #ef4444; }

        .round-result-count { font-weight: 800; font-size: 8px; }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            padding: 10px;
            box-shadow: var(--shadow);
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .question-player-tag { font-size: 9px; font-weight: 800; color: var(--primary); }
        .question-progress { font-size: 7px; font-weight: 700; color: var(--text-light); }

        .question-text {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 6px;
        }

        .timer-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 8px;
            height: 5px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .timer-bar-fill { height: 100%; background: #10b981; transition: width 1s linear; }
        .timer-bar-fill.warning { background: #f59e0b; }
        .timer-bar-fill.danger { background: #ef4444; }

        .timer-text { font-size: 7px; font-weight: 700; text-align: center; margin-bottom: 6px; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            border: var(--border);
            border-radius: 6px;
            background: var(--bg2);
            cursor: pointer;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 600;
            text-align: right;
            transition: all 0.2s ease;
            box-shadow: 1px 1px 0 #000;
        }

        .option-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .option-btn.selected-correct { background: #10b981; color: #fff; }
        .option-btn.selected-wrong { background: #ef4444; color: #fff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.6; }

        .option-letter {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .bottom-btn-container {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 8px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
        }

        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 10px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }

        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-banner {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .result-icon { font-size: 40px; margin-bottom: 8px; }
        .result-text { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .result-score { font-size: 10px; color: var(--text-light); margin-bottom: 8px; }

        .result-btn {
            display: inline-block;
            padding: 8px 20px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 6px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }

        .error-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle">دو نفره آنلاین</div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container" id="mainContainer">
        <div class="loader-letters" id="loaderLetters">
            <span class="loader-letter">Q</span>
            <span class="loader-letter">u</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">z</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">c</span>
            <span class="loader-letter">o</span>
        </div>
    </main>

    <div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع بازی</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';
            var SAD_IMAGE = 'https://cdn.imgurl.ir/uploads/g58935_InShot_20260822_140943752.png';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 3;
            var QUESTION_TIME = 60;
            var currentRound = 1;
            var currentQuestionIndex = 0;
            var myScore = 0;
            var opponentScore = 0;
            var myCorrectCount = 0;
            var opponentCorrectCount = 0;
            var questions = [];
            var roundQuestions = [];
            var roundResults = [];
            var isGameActive = false;
            var timerInterval = null;
            var timeLeft = QUESTION_TIME;
            var roomCode = null;
            var isPlayer1 = false;
            var checkInterval = null;
            var myUserId = '';
            var myAnswers = [];

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7' };
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    return parsed;
                } catch(e) { return { theme: 'light', primaryColor: '#a855f7' }; }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                }
            }

            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            function getStartParam() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
                    return webApp.initDataUnsafe.start_param;
                }
                return '';
            }

            function generateRoomCode() {
                var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                var code = 'G';
                for (var i = 0; i < 5; i++) {
                    code += Math.floor(Math.random() * 10);
                }
                return code;
            }

            function fetchData(action, params) {
                var payload = { action: action };
                if (params) {
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) payload[key] = params[key];
                    }
                }
                return fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json(); }).catch(function() { return { ok: false }; });
            }

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = QUESTION_TIME;
                updateTimerBars();
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimerBars();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        endRound();
                    }
                }, 1000);
            }

            function updateTimerBars() {
                var fills = document.querySelectorAll('.timer-bar-fill');
                var texts = document.querySelectorAll('.timer-text');
                var percent = (timeLeft / QUESTION_TIME) * 100;
                fills.forEach(function(fill) {
                    fill.style.width = percent + '%';
                    fill.className = 'timer-bar-fill' + (timeLeft <= 10 ? ' danger' : timeLeft <= 20 ? ' warning' : '');
                });
                texts.forEach(function(text) {
                    text.textContent = timeLeft + ' ثانیه';
                });
            }

            function renderWaitingScreen() {
                var inviteLink = 'https://eitaa.com/gameland_app/Quizico?startapp=' + roomCode;
                var html = '<div class="waiting-card">';
                html += '<img class="waiting-image" src="' + SAD_IMAGE + '" alt="">';
                html += '<div class="waiting-text">هنوز حریفت وارد نشده</div>';
                html += '<div class="invite-link-box">';
                html += '<span class="invite-link" id="inviteLink">' + inviteLink + '</span>';
                html += '<button class="copy-btn" onclick="copyInviteLink()">کپی</button>';
                html += '</div>';
                html += '</div>';
                document.getElementById('mainContainer').innerHTML = html;
                document.getElementById('bottomBtnContainer').style.display = 'none';
            }

            window.copyInviteLink = function() {
                var link = document.getElementById('inviteLink').textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(link).then(function() {
                        if (webApp) webApp.HapticFeedback?.impactOccurred('light');
                    });
                }
                if (webApp) webApp.HapticFeedback?.impactOccurred('light');
            };

            function renderQuestionCard(playerNum, question, options, correctIndex, qIndex) {
                var tag = playerNum === 1 ? 'شما' : 'حریف';
                var html = '<div class="question-card" id="p' + playerNum + 'Card">';
                html += '<div class="question-header">';
                html += '<span class="question-player-tag">' + tag + '</span>';
                html += '<span class="question-progress">سوال ' + (qIndex + 1) + ' از ' + QUESTIONS_PER_ROUND + '</span>';
                html += '</div>';
                html += '<div class="question-text">' + question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" style="width:100%;"></div></div>';
                html += '<div class="timer-text">60 ثانیه</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < options.length; i++) {
                    html += '<button class="option-btn" data-player="' + playerNum + '" data-correct="' + correctIndex + '" onclick="selectOption(' + playerNum + ', ' + i + ', this)">';
                    html += '<span class="option-letter">' + (i + 1) + '</span>';
                    html += '<span>' + options[i] + '</span>';
                    html += '</button>';
                }
                html += '</div>';
                html += '</div>';
                return html;
            }

            function renderGame() {
                var html = '';
                html += '<div class="players-row">';
                html += '<div class="player-card"><div class="player-tag">شما</div><span class="player-score">' + myScore + '</span></div>';
                html += '<div class="player-card"><div class="player-tag">حریف</div><span class="player-score">' + opponentScore + '</span></div>';
                html += '</div>';
                
                if (roundResults.length > 0) {
                    html += '<div class="rounds-results">';
                    html += '<div class="rounds-title">نتایج راندها</div>';
                    for (var i = 0; i < roundResults.length; i++) {
                        var r = roundResults[i];
                        html += '<div class="round-result-item">';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">راند ' + (i + 1) + '</span>';
                        html += '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">شما</span>';
                        html += '<div class="round-dots">';
                        for (var j = 0; j < QUESTIONS_PER_ROUND; j++) {
                            html += '<span class="result-dot' + (r.myAnswers[j] ? '' : ' wrong') + '">' + (j + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count">+' + r.myScore + '</span>';
                        html += '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">حریف</span>';
                        html += '<div class="round-dots">';
                        for (var k = 0; k < QUESTIONS_PER_ROUND; k++) {
                            html += '<span class="result-dot' + (r.opponentAnswers[k] ? '' : ' wrong') + '">' + (k + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count">+' + r.opponentScore + '</span>';
                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                var q = roundQuestions[currentQuestionIndex];
                var options = shuffleArray(q.options.slice());
                var correctIndex = options.indexOf(q.options[q.correctOption - 1]);
                var correctIdx = options.indexOf(q.options[q.correctOption - 1]);
                
                html += '<div class="question-card">';
                html += '<div class="question-header">';
                html += '<span class="question-player-tag">سوال ' + (currentQuestionIndex + 1) + '</span>';
                html += '<span class="question-progress">راند ' + currentRound + ' از ' + TOTAL_ROUNDS + '</span>';
                html += '</div>';
                html += '<div class="question-text">' + q.question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" style="width:100%;"></div></div>';
                html += '<div class="timer-text">60 ثانیه</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < options.length; i++) {
                    html += '<button class="option-btn" data-correct="' + correctIdx + '" onclick="selectMyOption(' + i + ', this)">';
                    html += '<span class="option-letter">' + (i + 1) + '</span>';
                    html += '<span>' + options[i] + '</span>';
                    html += '</button>';
                }
                html += '</div>';
                html += '</div>';
                
                document.getElementById('mainContainer').innerHTML = html;
                startTimer();
            }

            window.selectMyOption = function(selectedIndex, btn) {
                var correctIndex = parseInt(btn.getAttribute('data-correct'));
                var btns = document.querySelectorAll('.option-btn');
                btns.forEach(function(b) { b.classList.add('disabled'); });
                
                var isCorrect = selectedIndex === correctIndex;
                if (isCorrect) {
                    btn.classList.add('selected-correct');
                    myScore += 5;
                    myCorrectCount++;
                    myAnswers.push(true);
                } else {
                    btn.classList.add('selected-wrong');
                    btns[correctIndex].classList.add('selected-correct');
                    myAnswers.push(false);
                }
                
                clearInterval(timerInterval);
                setTimeout(function() {
                    currentQuestionIndex++;
                    if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                        endRound();
                    } else {
                        renderGame();
                    }
                }, 800);
            };

            function endRound() {
                roundResults.push({
                    myAnswers: myAnswers,
                    opponentAnswers: [],
                    myScore: myCorrectCount * 5,
                    opponentScore: 0
                });
                
                // ذخیره در شیت
                var questionIds = roundQuestions.map(function(q) { return q.id; }).join(',');
                var myAnsStr = myAnswers.map(function(a) { return a ? 'T' : 'F'; }).join(',');
                var roundData = '[' + questionIds + '][' + myAnsStr + '][]';
                
                fetchData('updateGame', {
                    gameId: roomCode,
                    updates: { round1: roundData, status: 'in_progress' }
                });
                
                myCorrectCount = 0;
                myAnswers = [];
                currentRound++;
                currentQuestionIndex = 0;
                
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                } else {
                    loadRoundQuestions();
                    renderGame();
                }
            }

            function loadRoundQuestions() {
                var allShuffled = shuffleArray(questions);
                roundQuestions = allShuffled.slice(0, QUESTIONS_PER_ROUND);
            }

            function endGame() {
                clearInterval(timerInterval);
                var resultHtml = '';
                resultHtml = '<div class="result-icon"><i class="fa-solid fa-flag-checkered" style="color:#f59e0b;"></i></div>';
                resultHtml += '<div class="result-text">بازی تمام شد!</div>';
                resultHtml += '<div class="result-score">شما: ' + myScore + ' - حریف: ' + opponentScore + '</div>';
                resultHtml += '<button class="result-btn" onclick="backToDashboard()">بازگشت</button>';
                
                document.getElementById('mainContainer').innerHTML = '<div class="result-banner">' + resultHtml + '</div>';
                document.getElementById('bottomBtnContainer').style.display = 'none';
                
                fetchData('updateGame', {
                    gameId: roomCode,
                    updates: { status: 'finished' }
                });
            }

            window.backToDashboard = function() {
                window.location.href = '../../dashboard/';
            };

            window.handleMainBtn = function() {};

            async function initPlayer1() {
                roomCode = generateRoomCode();
                isPlayer1 = true;
                myUserId = getUserId();
                
                // ذخیره بازی جدید
                fetchData('saveGame', {
                    gameData: {
                        id: roomCode,
                        player1: myUserId,
                        player2: '',
                        round1: '',
                        round2: '',
                        round3: '',
                        round4: '',
                        round5: '',
                        status: 'waiting'
                    }
                });
                
                renderWaitingScreen();
                
                // چک هر ۵ ثانیه
                checkInterval = setInterval(async function() {
                    var gameResult = await fetchData('getGame', { gameId: roomCode });
                    if (gameResult.ok && gameResult.data && gameResult.data.player2) {
                        clearInterval(checkInterval);
                        startOnlineGame();
                    }
                }, 5000);
            }

            async function initPlayer2() {
                roomCode = getStartParam();
                isPlayer1 = false;
                myUserId = getUserId();
                
                // اول چک کن کاربر ثبت شده
                var userData = await fetchData('getUser', { username: myUserId });
                if (!userData.ok || !userData.data) {
                    var user = getEitaaUser();
                    var fullName = (user.first_name || '') + ' ' + (user.last_name || '');
                    await fetchData('registerUser', { name: fullName.trim() || 'کاربر' });
                }
                
                // وارد بازی شو
                fetchData('updateGame', {
                    gameId: roomCode,
                    updates: { player2: myUserId, status: 'in_progress' }
                });
                
                startOnlineGame();
            }

            async function startOnlineGame() {
                isGameActive = true;
                document.getElementById('bottomBtnContainer').style.display = 'none';
                
                var questionsData = await fetchData('getQuestions', { limit: 50 });
                if (questionsData.ok && Array.isArray(questionsData.data) && questionsData.data.length >= QUESTIONS_PER_ROUND) {
                    questions = questionsData.data;
                    loadRoundQuestions();
                    renderGame();
                } else {
                    document.getElementById('mainContainer').innerHTML = '<div class="result-banner"><div class="result-text">سوال کافی نیست</div></div>';
                }
            }

            async function init() {
                applyTheme();
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                    webApp.BackButton.show();
                    webApp.BackButton.onClick(function() {
                        window.location.href = '../../dashboard/';
                    });
                }

                var startParam = getStartParam();
                if (startParam) {
                    initPlayer2();
                } else {
                    initPlayer1();
                }
            }

            init();
        })();
    </script>
</body>
</html>
