<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تک‌نفره | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .players-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            transition: all 0.3s ease;
        }

        .player-card.active {
            border-color: var(--gold);
            border-width: 3px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .player-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }

        .player-card.active .player-tag {
            color: var(--gold);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            overflow: hidden;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-score {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
            display: block;
        }

        .player-score.hidden {
            visibility: hidden;
        }

        .player-progress {
            font-size: 8px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .message-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: var(--shadow);
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
        }

        .rounds-results {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .rounds-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 10px;
            text-align: center;
        }

        .round-result-item {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .round-result-item:last-child {
            margin-bottom: 0;
        }

        .round-result-header {
            font-size: 9px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .round-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 9px;
        }

        .round-result-player {
            font-weight: 700;
            color: var(--text);
            min-width: 30px;
        }

        .round-dots {
            display: flex;
            gap: 4px;
            flex: 1;
            justify-content: center;
        }

        .result-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 800;
            border: 1px solid #000;
            background: #10b981;
            color: #fff;
        }

        .result-dot.wrong {
            background: #ef4444;
        }

        .round-result-count {
            font-weight: 800;
            font-size: 10px;
            min-width: 20px;
            text-align: center;
        }

        .round-result-count.good {
            color: #10b981;
        }

        .round-result-count.bad {
            color: #ef4444;
        }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.8;
            text-align: center;
            margin-bottom: 12px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--dark);
            text-align: right;
        }

        .option-btn:hover {
            transform: translateX(-3px);
            box-shadow: 3px 3px 0 #000;
            background: var(--bg3);
        }

        .option-btn.selected-correct {
            background: #10b981;
            color: #fff;
        }

        .option-btn.selected-wrong {
            background: #ef4444;
            color: #fff;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .option-btn.hidden-option {
            opacity: 0.3;
            pointer-events: none;
            text-decoration: line-through;
        }

        .option-letter {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .actions-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border: var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 700;
            color: var(--text);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 #000;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 2px 2px 0 #000;
        }

        .bottom-btn-container {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 12px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
            box-shadow: 0 -3px 0 #000;
        }

        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 12px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            transition: all 0.3s ease;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 #000;
        }

        .main-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #000;
        }

        .main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 #000;
        }

        .main-btn.waiting {
            background: var(--text-light);
        }

        .result-banner {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .result-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .result-score {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .result-btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <main class="main-container" id="mainContainer">
    </main>

    <div class="bottom-btn-container">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع راند 1</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 3;
            var currentRound = 1;
            var currentQuestionIndex = 0;
            var yourScore = 0;
            var botScore = 0;
            var questions = [];
            var currentQuestions = [];
            var isAnswered = false;
            var userCoins = 0;
            var userDiamonds = 0;
            var userTotalScore = 0;
            var isYourTurn = true;
            var roundResults = [];
            var isRoundActive = false;
            var yourCorrectCount = 0;
            var botCorrectCount = 0;

            var letters = ['۱', '۲', '۳', '۴'];

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            async function fetchData(action, params) {
                try {
                    var username = getUserId();
                    var initData = webApp?.initData || '';
                    var payload = { action: action, username: username, initData: initData };
                    if (params) {
                        for (var key in params) {
                            if (params.hasOwnProperty(key)) payload[key] = params[key];
                        }
                    }
                    var response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    var result = await response.json();
                    return result;
                } catch(e) {
                    return { ok: false, error: 'Network error' };
                }
            }

            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            function botAnswer(correctIndex) {
                return Math.random() < 0.7 ? correctIndex : Math.floor(Math.random() * 4);
            }

            function renderMainScreen() {
                var html = '';
                
                html += '<div class="players-row">';
                html += '<div class="player-card' + (isYourTurn && isRoundActive ? ' active' : '') + '">';
                html += '<div class="player-tag">تو</div>';
                html += '<div class="player-avatar"><i class="fa-solid fa-user"></i></div>';
                html += '<span class="player-score">' + yourScore + '</span>';
                html += '<div class="player-progress">امتیاز ' + yourCorrectCount + ' از ' + (currentRound > 1 ? (currentRound - 1) * QUESTIONS_PER_ROUND : 0) + ' تا الان</div>';
                html += '</div>';
                
                html += '<div class="player-card' + (!isYourTurn && isRoundActive ? ' active' : '') + '">';
                html += '<div class="player-tag">حریف</div>';
                html += '<div class="player-avatar"><i class="fa-solid fa-robot"></i></div>';
                if (isYourTurn || !isRoundActive) {
                    html += '<span class="player-score hidden">.</span>';
                } else {
                    html += '<span class="player-score">' + botScore + '</span>';
                }
                html += '<div class="player-progress">امتیاز ' + botCorrectCount + ' از ' + (currentRound > 1 ? (currentRound - 1) * QUESTIONS_PER_ROUND : 0) + ' تا الان</div>';
                html += '</div>';
                html += '</div>';
                
                html += '<div class="message-card">حریف رو برتر تا امتیاز کسب کنی! هرچی سوالای بیشتری درست جواب بدی، شانس ت برای برنده شدن بیشتر میشه.</div>';
                
                if (roundResults.length > 0) {
                    html += '<div class="rounds-results">';
                    html += '<div class="rounds-title">نتایج راندهای پاسخ‌داده‌شده</div>';
                    for (var i = 0; i < roundResults.length; i++) {
                        var result = roundResults[i];
                        html += '<div class="round-result-item">';
                        html += '<div class="round-result-header"><i class="fa-solid fa-gamepad"></i> راند ' + (i + 1) + '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">تو</span>';
                        html += '<div class="round-dots">';
                        for (var j = 0; j < QUESTIONS_PER_ROUND; j++) {
                            html += '<span class="result-dot' + (j < result.yourCorrect ? '' : ' wrong') + '">' + (j + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count good">+' + result.yourRoundScore + '</span>';
                        html += '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">حریف</span>';
                        html += '<div class="round-dots">';
                        for (var k = 0; k < QUESTIONS_PER_ROUND; k++) {
                            html += '<span class="result-dot' + (k < result.botCorrect ? '' : ' wrong') + '">' + (k + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count good">+' + result.botRoundScore + '</span>';
                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                document.getElementById('mainContainer').innerHTML = html;
            }

            function renderQuestionScreen() {
                var q = currentQuestions[currentQuestionIndex];
                var options = shuffleArray(q.options.slice());
                var correctText = q.options[q.correctOption - 1];
                var correctIndex = options.indexOf(correctText);

                var html = '<div class="actions-row">';
                html += '<button class="action-btn" onclick="useRemove50()" id="btnRemove"><i class="fa-solid fa-trash"></i> ۵۰</button>';
                html += '<button class="action-btn" onclick="useSwapQuestion()" id="btnSwap"><i class="fa-solid fa-arrows-rotate"></i> ۱۰۰</button>';
                html += '<button class="action-btn" onclick="useSkipQuestion()" id="btnSkip"><i class="fa-solid fa-forward"></i> ۱۵۰</button>';
                html += '</div>';
                html += '<div class="question-card">';
                html += '<div class="question-text">' + q.question + '</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < options.length; i++) {
                    html += '<button class="option-btn" onclick="selectOption(' + i + ', ' + correctIndex + ', this)">';
                    html += '<span class="option-letter">' + letters[i] + '</span>';
                    html += '<span>' + options[i] + '</span>';
                    html += '</button>';
                }
                html += '</div>';
                html += '</div>';
                
                document.getElementById('mainContainer').innerHTML = html;
            }

            function updateBtnState(text, state) {
                var btn = document.getElementById('mainBtn');
                btn.textContent = text;
                btn.className = 'main-btn' + (state ? ' ' + state : '');
            }

            function renderRoundsResults() {
                renderMainScreen();
            }

            window.handleMainBtn = function() {
                if (!isRoundActive) {
                    startYourRound();
                } else if (isYourTurn && currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                    endYourRound();
                } else if (!isYourTurn) {
                    // waiting for bot
                }
            };

            function startYourRound() {
                isRoundActive = true;
                isYourTurn = true;
                currentQuestionIndex = 0;
                yourCorrectCount = 0;
                botCorrectCount = 0;
                
                var allQuestions = shuffleArray(questions);
                currentQuestions = allQuestions.slice(0, QUESTIONS_PER_ROUND);
                
                updateBtnState('نوبت توست', '');
                renderQuestionScreen();
            }

            window.selectOption = function(selectedIndex, correctIndex, btn) {
                if (isAnswered) return;
                isAnswered = true;

                var allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(function(b) { b.classList.add('disabled'); });

                if (selectedIndex === correctIndex) {
                    btn.classList.add('selected-correct');
                    yourScore += 5;
                    yourCorrectCount++;
                } else {
                    btn.classList.add('selected-wrong');
                    allBtns[correctIndex].classList.add('selected-correct');
                }

                setTimeout(function() {
                    currentQuestionIndex++;
                    if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                        updateBtnState('دست تمام شد! بریم دست بعد', 'waiting');
                        setTimeout(function() {
                            endYourRound();
                        }, 1000);
                    } else {
                        renderQuestionScreen();
                    }
                }, 1000);
            };

            function endYourRound() {
                isYourTurn = false;
                isAnswered = false;
                updateBtnState('نوبت حریفه...', 'waiting');
                
                var botRoundScore = 0;
                for (var i = 0; i < QUESTIONS_PER_ROUND; i++) {
                    var q = currentQuestions[i];
                    var correctIndex = q.correctOption - 1;
                    if (botAnswer(correctIndex) === correctIndex) {
                        botRoundScore += 5;
                        botCorrectCount++;
                    }
                }
                botScore += botRoundScore;
                
                roundResults.push({
                    yourRoundScore: yourCorrectCount * 5,
                    botRoundScore: botRoundScore,
                    yourCorrect: yourCorrectCount,
                    botCorrect: botCorrectCount
                });
                
                currentRound++;
                isRoundActive = false;
                
                renderMainScreen();
                
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                } else {
                    updateBtnState('شروع راند ' + currentRound, '');
                }
            }

            window.useRemove50 = function() {
                if (userCoins < 50 || isAnswered) return;
                userCoins -= 50;
                document.getElementById('btnRemove').disabled = true;
                
                var q = currentQuestions[currentQuestionIndex];
                var correctText = q.options[q.correctOption - 1];
                var wrongOptions = q.options.filter(function(o) { return o !== correctText; });
                var toHide = shuffleArray(wrongOptions).slice(0, 2);
                
                var allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(function(btn) {
                    var text = btn.querySelector('span:last-child').textContent;
                    if (toHide.indexOf(text) !== -1) {
                        btn.classList.add('hidden-option');
                    }
                });
            };

            window.useSwapQuestion = function() {
                if (userCoins < 100 || isAnswered) return;
                userCoins -= 100;
                document.getElementById('btnSwap').disabled = true;
                
                var remaining = questions.filter(function(q) {
                    return currentQuestions.indexOf(q) === -1;
                });
                if (remaining.length > 0) {
                    currentQuestions[currentQuestionIndex] = shuffleArray(remaining)[0];
                    renderQuestionScreen();
                }
            };

            window.useSkipQuestion = function() {
                if (userCoins < 150 || isAnswered) return;
                userCoins -= 150;
                document.getElementById('btnSkip').disabled = true;
                
                yourScore += 5;
                yourCorrectCount++;
                
                setTimeout(function() {
                    currentQuestionIndex++;
                    if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                        updateBtnState('دست تمام شد! بریم دست بعد', 'waiting');
                        setTimeout(function() {
                            endYourRound();
                        }, 1000);
                    } else {
                        renderQuestionScreen();
                    }
                }, 300);
            };

            function endGame() {
                var resultHtml = '';
                var scoreChange = 0;
                var coinReward = 0;

                if (yourScore > botScore) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">بردی!</div>';
                    scoreChange = 75;
                    coinReward = 300;
                } else if (yourScore < botScore) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-face-frown" style="color:#ef4444;"></i></div>';
                    resultHtml += '<div class="result-text">باختی!</div>';
                    scoreChange = -25;
                } else {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-handshake" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">مساوی شدی!</div>';
                    scoreChange = 25;
                }

                resultHtml += '<div class="result-score">شما: ' + yourScore + ' - ربات: ' + botScore + '</div>';
                resultHtml += '<div class="result-score">امتیاز: ' + (scoreChange >= 0 ? '+' : '') + scoreChange + '</div>';
                if (coinReward > 0) {
                    resultHtml += '<div class="result-score">سکه: +' + coinReward + '</div>';
                }
                resultHtml += '<button class="result-btn" onclick="backToDashboard()">بازگشت</button>';

                document.getElementById('mainContainer').innerHTML = '<div class="result-banner">' + resultHtml + '</div>';
                document.getElementById('mainBtn').style.display = 'none';

                userTotalScore += scoreChange;
                userCoins += coinReward;

                fetchData('updateUser', {
                    score: userTotalScore,
                    coins: userCoins
                }).then(function() {});
            }

            window.backToDashboard = function() {
                window.location.href = '../../dashboard/';
            };

            async function init() {
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                }

                var userData = await fetchData('getUser', {});
                if (userData.ok && userData.data) {
                    userCoins = userData.data.coins || 0;
                    userDiamonds = userData.data.diamonds || 0;
                    userTotalScore = userData.data.score || 0;
                }

                var questionsData = await fetchData('getQuestions', { limit: 50 });
                if (questionsData.ok && Array.isArray(questionsData.data) && questionsData.data.length > 0) {
                    questions = questionsData.data;
                    renderMainScreen();
                    updateBtnState('شروع راند 1', '');
                } else {
                    document.getElementById('mainContainer').innerHTML = '<div class="result-banner"><div class="result-text">سوالی یافت نشد</div></div>';
                    document.getElementById('mainBtn').style.display = 'none';
                }
            }

            init();
        })();
    </script>
</body>
</html>
