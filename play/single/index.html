<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تک‌نفره | Quizico</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-sans-font@v1.0.0/dist/font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #faf5ff;
            --bg2: #f3e8ff;
            --bg3: #e9d5ff;
            --primary: #a855f7;
            --primary-dark: #9333ea;
            --primary-light: #c084fc;
            --primary-rgb: 168, 85, 247;
            --dark: #1e1b2e;
            --text: #4a4458;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: 3px 3px 0 #000000;
            --radius: 4px;
            --border: 1px solid #000000;
            --gold: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #1e1b2e;
            --bg2: #2d2a3e;
            --bg3: #3d3a4e;
            --primary: #c084fc;
            --primary-dark: #a855f7;
            --primary-light: #d8b4fe;
            --primary-rgb: 192, 132, 252;
            --dark: #f1f5f9;
            --text: #cbd5e1;
            --text-light: #94a3b8;
            --white: #2d2a3e;
            --card-bg: #2d2a3e;
            --header-bg: #2d2a3e;
            --shadow: 3px 3px 0 #000000;
            --border: 1px solid #000000;
        }

        [data-animation="off"] * {
            animation: none !important;
            transition: none !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANSans', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 80%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            position: relative;
            z-index: 10;
            background: var(--header-bg);
            border-bottom: var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            box-shadow: var(--shadow);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            overflow: hidden;
            padding: 2px;
            border: var(--border);
        }

        .header-logo img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            transform: scale(1.15);
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--dark);
        }

        .header-title .t-accent {
            color: var(--primary);
        }

        .header-subtitle {
            font-size: 9px;
            color: var(--text-light);
        }

        .currency-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: var(--border);
            border-radius: var(--radius);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--dark);
            box-shadow: var(--shadow);
        }

        .currency-badge.coins i { color: #f59e0b; }

        .main-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            width: 100%;
            margin: 16px auto;
            padding: 0 12px 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loader-letters {
            display: flex;
            gap: 4px;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            direction: ltr;
        }

        .loader-letter {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
            opacity: 0;
            animation: letterBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
        }

        .loader-letter:nth-child(1) { animation-delay: 0.1s; }
        .loader-letter:nth-child(2) { animation-delay: 0.2s; }
        .loader-letter:nth-child(3) { animation-delay: 0.3s; }
        .loader-letter:nth-child(4) { animation-delay: 0.4s; }
        .loader-letter:nth-child(5) { animation-delay: 0.5s; color: #f59e0b; }
        .loader-letter:nth-child(6) { animation-delay: 0.6s; color: #f59e0b; }
        .loader-letter:nth-child(7) { animation-delay: 0.7s; color: #f59e0b; }

        @keyframes letterBounce {
            0% { opacity: 0; transform: translateY(-30px) scale(0.3) rotate(-10deg); }
            50% { opacity: 1; transform: translateY(8px) scale(1.2) rotate(5deg); }
            70% { transform: translateY(-4px) scale(0.95) rotate(-2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        .players-row {
            display: flex;
            gap: 10px;
        }

        .player-card {
            flex: 1;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .player-card.active {
            border-color: var(--gold);
            border-width: 3px;
        }

        .player-tag {
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 auto 4px;
            background: var(--bg2);
            border: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--primary);
        }

        .player-score {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
        }

        .message-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: var(--shadow);
            text-align: center;
            font-size: 9px;
            font-weight: 600;
        }

        .rounds-results {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        .rounds-title {
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .round-result-item {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .round-result-header {
            font-size: 8px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .round-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 8px;
        }

        .round-result-player {
            font-weight: 700;
            min-width: 25px;
        }

        .round-dots {
            display: flex;
            gap: 3px;
            flex: 1;
            justify-content: center;
        }

        .result-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 800;
            border: 1px solid #000;
            background: #10b981;
            color: #fff;
        }

        .result-dot.wrong {
            background: #ef4444;
        }

        .round-result-count {
            font-weight: 800;
            font-size: 9px;
            min-width: 18px;
            text-align: center;
        }

        .question-card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .question-text {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.7;
            text-align: center;
            margin-bottom: 10px;
        }

        .timer-bar-container {
            background: var(--bg3);
            border: var(--border);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .timer-bar-fill {
            height: 100%;
            background: #10b981;
            border-radius: 10px;
            transition: width 1s linear;
        }

        .timer-bar-fill.warning {
            background: #f59e0b;
        }

        .timer-bar-fill.danger {
            background: #ef4444;
        }

        .timer-text {
            text-align: center;
            font-size: 8px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: var(--border);
            border-radius: 8px;
            background: var(--bg2);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-align: right;
        }

        .option-btn.selected-correct {
            background: #10b981;
            color: #fff;
        }

        .option-btn.selected-wrong {
            background: #ef4444;
            color: #fff;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .option-btn.hidden-option {
            opacity: 0.2;
            pointer-events: none;
            text-decoration: line-through;
        }

        .option-letter {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            flex-shrink: 0;
            border: var(--border);
        }

        .actions-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 7px;
            border: var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 8px;
            font-weight: 700;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: 1px 1px 0 #000;
        }

        .bottom-btn-container {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 10px 16px;
            background: var(--header-bg);
            border-top: var(--border);
            z-index: 100;
        }

        .main-btn {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: block;
            padding: 12px;
            background: var(--gold);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }

        .main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .main-btn.waiting {
            background: var(--text-light);
        }

        .result-banner {
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border: var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .result-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .result-score {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .result-btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--primary);
            color: #fff;
            border: var(--border);
            border-radius: 8px;
            font-family: 'IRANSans', Tahoma, sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-right">
                <div class="header-logo">
                    <img src="https://cdn.imgurl.ir/uploads/f30974_InShot_20260821_174101103.png" alt="Quizico">
                </div>
                <div>
                    <div class="header-title">Quiz<span class="t-accent">ico</span></div>
                    <div class="header-subtitle">تک‌نفره</div>
                </div>
            </div>
            <span class="currency-badge coins"><i class="fa-solid fa-coins"></i> <span id="coinsHeader">0</span></span>
        </div>
    </header>

    <main class="main-container" id="mainContainer">
        <div class="loader-letters" id="loaderLetters">
            <span class="loader-letter">Q</span>
            <span class="loader-letter">u</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">z</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">c</span>
            <span class="loader-letter">o</span>
        </div>
    </main>

    <div class="bottom-btn-container" id="bottomBtnContainer" style="display:none;">
        <button class="main-btn" id="mainBtn" onclick="handleMainBtn()">شروع راند 1</button>
    </div>

    <script>
        (function() {
            var webApp = window.Eitaa?.WebApp;
            var API_URL = 'https://script.google.com/macros/s/AKfycby39_m_-w42F1ps3z21aAW2jMXjgmDJjrPD6CfrLLczg-KPk1cbyXcVnUjaeFQ4TIP9ww/exec';

            var TOTAL_ROUNDS = 5;
            var QUESTIONS_PER_ROUND = 3;
            var QUESTION_TIME = 60;
            var currentRound = 1;
            var currentQuestionIndex = 0;
            var yourScore = 0;
            var botScore = 0;
            var questions = [];
            var currentQuestions = [];
            var isAnswered = false;
            var userCoins = 0;
            var userTotalScore = 0;
            var isYourTurn = true;
            var roundResults = [];
            var isRoundActive = false;
            var yourCorrectCount = 0;
            var botCorrectCount = 0;
            var timerInterval = null;
            var timeLeft = QUESTION_TIME;
            var gameId = 'game_' + Date.now();
            var actionUsedThisQuestion = false;

            var messages = [
                'هر سوال درست یه قدم به برد نزدیک‌ترت می‌کنه!',
                'تمرکزت رو بذار روی سوال، وقت داری!',
                'تو از پسش برمیای! فقط با دقت جواب بده',
                'حریفت قویه، ولی تو قوی‌تری!',
                'هر جواب درست ۵ امتیاز داره!',
                'آروم باش و درست فکر کن!',
                'ادامه بده، داری عالی پیش میری!'
            ];

            function getRandomMessage() {
                return messages[Math.floor(Math.random() * messages.length)];
            }

            function getEitaaUser() {
                if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    return webApp.initDataUnsafe.user;
                }
                return null;
            }

            function getUserId() {
                var user = getEitaaUser();
                if (!user) return '';
                if (typeof user.id === 'number') return user.id.toString();
                return String(user.id || '');
            }

            function fetchData(action, params) {
                var username = getUserId();
                var payload = { action: action, username: username };
                if (params) {
                    for (var key in params) {
                        if (params.hasOwnProperty(key)) payload[key] = params[key];
                    }
                }
                return fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(function(r) { return r.json(); }).catch(function() { return { ok: false }; });
            }

            function getSettings() {
                try {
                    var raw = localStorage.getItem('quizicoSettings');
                    if (!raw) return { theme: 'light', primaryColor: '#a855f7', animation: true };
                    var parsed = JSON.parse(raw);
                    if (!parsed.theme) parsed.theme = 'light';
                    if (!parsed.primaryColor) parsed.primaryColor = '#a855f7';
                    if (parsed.animation === undefined) parsed.animation = true;
                    return parsed;
                } catch(e) {
                    return { theme: 'light', primaryColor: '#a855f7', animation: true };
                }
            }

            function hexToRgb(hex) {
                var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 168, g: 85, b: 247 };
            }

            function shadeColor(color, percent) {
                var rgb = hexToRgb(color);
                var r = Math.max(0, Math.min(255, rgb.r + percent));
                var g = Math.max(0, Math.min(255, rgb.g + percent));
                var b = Math.max(0, Math.min(255, rgb.b + percent));
                return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function applyTheme() {
                var settings = getSettings();
                var theme = settings.theme || 'light';
                var primaryColor = settings.primaryColor || '#a855f7';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    var darkPrimary = shadeColor(primaryColor, 40);
                    document.documentElement.style.setProperty('--primary', darkPrimary);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(darkPrimary).r + ', ' + hexToRgb(darkPrimary).g + ', ' + hexToRgb(darkPrimary).b);
                } else {
                    document.documentElement.style.setProperty('--primary', primaryColor);
                    document.documentElement.style.setProperty('--primary-rgb', hexToRgb(primaryColor).r + ', ' + hexToRgb(primaryColor).g + ', ' + hexToRgb(primaryColor).b);
                }
            }

            function shuffleArray(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            function botAnswer(correctIndex) {
                return Math.random() < 0.7 ? correctIndex : Math.floor(Math.random() * 4);
            }

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = QUESTION_TIME;
                updateTimerBar();
                timerInterval = setInterval(function() {
                    timeLeft--;
                    updateTimerBar();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        if (!isAnswered) {
                            timeOut();
                        }
                    }
                }, 1000);
            }

            function updateTimerBar() {
                var fill = document.getElementById('timerFill');
                var text = document.getElementById('timerText');
                if (!fill || !text) return;
                var percent = (timeLeft / QUESTION_TIME) * 100;
                fill.style.width = percent + '%';
                text.textContent = timeLeft + ' ثانیه';
                fill.className = 'timer-bar-fill' + (timeLeft <= 10 ? ' danger' : timeLeft <= 20 ? ' warning' : '');
            }

            function timeOut() {
                isAnswered = true;
                var allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(function(b) { b.classList.add('disabled'); });
                var q = currentQuestions[currentQuestionIndex];
                var correctText = q.options[q.correctOption - 1];
                document.querySelectorAll('.option-btn').forEach(function(btn) {
                    if (btn.getAttribute('data-text') === correctText) {
                        btn.classList.add('selected-correct');
                    }
                });
                setTimeout(function() {
                    goToNextQuestion();
                }, 800);
            }

            function goToNextQuestion() {
                currentQuestionIndex++;
                if (currentQuestionIndex >= QUESTIONS_PER_ROUND) {
                    document.getElementById('mainBtn').textContent = 'دست تمام شد!';
                    document.getElementById('mainBtn').disabled = true;
                    setTimeout(function() {
                        endYourRound();
                    }, 800);
                } else {
                    renderQuestionScreen();
                }
            }

            function renderMainScreen() {
                var html = '';
                html += '<div class="players-row">';
                html += '<div class="player-card' + (isYourTurn && isRoundActive ? ' active' : '') + '">';
                html += '<div class="player-tag">تو</div>';
                html += '<div class="player-avatar"><i class="fa-solid fa-user"></i></div>';
                html += '<span class="player-score">' + yourScore + '</span>';
                html += '</div>';
                html += '<div class="player-card' + (!isYourTurn && isRoundActive ? ' active' : '') + '">';
                html += '<div class="player-tag">حریف</div>';
                html += '<div class="player-avatar"><i class="fa-solid fa-robot"></i></div>';
                html += '<span class="player-score">' + (isYourTurn || !isRoundActive ? '?' : botScore) + '</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="message-card">' + getRandomMessage() + '</div>';
                
                if (roundResults.length > 0) {
                    html += '<div class="rounds-results">';
                    html += '<div class="rounds-title">نتایج راندها</div>';
                    for (var i = 0; i < roundResults.length; i++) {
                        var result = roundResults[i];
                        html += '<div class="round-result-item">';
                        html += '<div class="round-result-header">راند ' + (i + 1) + '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">تو</span>';
                        html += '<div class="round-dots">';
                        for (var j = 0; j < QUESTIONS_PER_ROUND; j++) {
                            html += '<span class="result-dot' + (j < result.yourCorrect ? '' : ' wrong') + '">' + (j + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count">+' + result.yourRoundScore + '</span>';
                        html += '</div>';
                        html += '<div class="round-result-row">';
                        html += '<span class="round-result-player">حریف</span>';
                        html += '<div class="round-dots">';
                        for (var k = 0; k < QUESTIONS_PER_ROUND; k++) {
                            html += '<span class="result-dot' + (k < result.botCorrect ? '' : ' wrong') + '">' + (k + 1) + '</span>';
                        }
                        html += '</div>';
                        html += '<span class="round-result-count">+' + result.botRoundScore + '</span>';
                        html += '</div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }
                
                document.getElementById('mainContainer').innerHTML = html;
            }

            function renderQuestionScreen() {
                isAnswered = false;
                actionUsedThisQuestion = false;
                var q = currentQuestions[currentQuestionIndex];
                var options = shuffleArray(q.options.slice());
                var correctText = q.options[q.correctOption - 1];
                var correctIndex = options.indexOf(correctText);

                var html = '<div class="actions-row">';
                html += '<button class="action-btn" id="btnRemove" onclick="useRemove50()"><i class="fa-solid fa-trash" style="color:#ef4444;"></i> ۵۰</button>';
                html += '<button class="action-btn" id="btnSwap" onclick="useSwapQuestion()"><i class="fa-solid fa-arrows-rotate" style="color:#06b6d4;"></i> ۱۰۰</button>';
                html += '<button class="action-btn" id="btnSkip" onclick="useSkipQuestion()"><i class="fa-solid fa-forward" style="color:#f59e0b;"></i> ۱۵۰</button>';
                html += '</div>';
                html += '<div class="question-card">';
                html += '<div class="question-text">' + q.question + '</div>';
                html += '<div class="timer-bar-container"><div class="timer-bar-fill" id="timerFill" style="width:100%;"></div></div>';
                html += '<div class="timer-text" id="timerText">60 ثانیه</div>';
                html += '<div class="options-grid">';
                for (var i = 0; i < options.length; i++) {
                    html += '<button class="option-btn" data-text="' + options[i] + '" onclick="selectOption(' + i + ', ' + correctIndex + ', this)">';
                    html += '<span class="option-letter">' + (i + 1) + '</span>';
                    html += '<span>' + options[i] + '</span>';
                    html += '</button>';
                }
                html += '</div>';
                html += '</div>';
                
                document.getElementById('mainContainer').innerHTML = html;
                startTimer();
            }

            window.handleMainBtn = function() {
                if (!isRoundActive) {
                    startYourRound();
                }
            };

            function startYourRound() {
                isRoundActive = true;
                isYourTurn = true;
                currentQuestionIndex = 0;
                yourCorrectCount = 0;
                botCorrectCount = 0;
                
                var allQuestions = shuffleArray(questions);
                currentQuestions = allQuestions.slice(0, QUESTIONS_PER_ROUND);
                
                document.getElementById('mainBtn').textContent = 'نوبت توست';
                document.getElementById('mainBtn').disabled = true;
                renderQuestionScreen();
            }

            window.selectOption = function(selectedIndex, correctIndex, btn) {
                if (isAnswered) return;
                isAnswered = true;
                clearInterval(timerInterval);

                var allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(function(b) { b.classList.add('disabled'); });

                if (selectedIndex === correctIndex) {
                    btn.classList.add('selected-correct');
                    yourScore += 5;
                    yourCorrectCount++;
                } else {
                    btn.classList.add('selected-wrong');
                    allBtns[correctIndex].classList.add('selected-correct');
                }

                setTimeout(function() {
                    goToNextQuestion();
                }, 800);
            };

            function endYourRound() {
                isYourTurn = false;
                clearInterval(timerInterval);
                document.getElementById('mainBtn').textContent = 'نوبت حریفه...';
                document.getElementById('mainBtn').disabled = true;
                
                var botRoundScore = 0;
                for (var i = 0; i < QUESTIONS_PER_ROUND; i++) {
                    var q = currentQuestions[i];
                    var correctIndex = q.correctOption - 1;
                    if (botAnswer(correctIndex) === correctIndex) {
                        botRoundScore += 5;
                        botCorrectCount++;
                    }
                }
                botScore += botRoundScore;
                
                roundResults.push({
                    yourRoundScore: yourCorrectCount * 5,
                    botRoundScore: botRoundScore,
                    yourCorrect: yourCorrectCount,
                    botCorrect: botCorrectCount
                });
                
                currentRound++;
                isRoundActive = false;
                
                renderMainScreen();
                
                if (currentRound > TOTAL_ROUNDS) {
                    endGame();
                } else {
                    document.getElementById('mainBtn').textContent = 'شروع راند ' + currentRound;
                    document.getElementById('mainBtn').disabled = false;
                }
            }

            window.useRemove50 = function() {
                if (userCoins < 50 || isAnswered || actionUsedThisQuestion) return;
                userCoins -= 50;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                
                var q = currentQuestions[currentQuestionIndex];
                var correctText = q.options[q.correctOption - 1];
                var wrongOptions = q.options.filter(function(o) { return o !== correctText; });
                var toHide = shuffleArray(wrongOptions).slice(0, 2);
                
                var allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(function(btn) {
                    if (toHide.indexOf(btn.getAttribute('data-text')) !== -1) {
                        btn.classList.add('hidden-option');
                    }
                });
                
                disableAllActions();
                fetchData('updateUser', { coins: userCoins });
            };

            window.useSwapQuestion = function() {
                if (userCoins < 100 || isAnswered || actionUsedThisQuestion) return;
                userCoins -= 100;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                
                var remaining = questions.filter(function(q) {
                    return currentQuestions.indexOf(q) === -1;
                });
                if (remaining.length > 0) {
                    currentQuestions[currentQuestionIndex] = shuffleArray(remaining)[0];
                }
                
                disableAllActions();
                fetchData('updateUser', { coins: userCoins });
                renderQuestionScreen();
            };

            window.useSkipQuestion = function() {
                if (userCoins < 150 || isAnswered || actionUsedThisQuestion) return;
                userCoins -= 150;
                actionUsedThisQuestion = true;
                document.getElementById('coinsHeader').textContent = userCoins;
                
                yourScore += 5;
                yourCorrectCount++;
                
                disableAllActions();
                fetchData('updateUser', { coins: userCoins });
                
                clearInterval(timerInterval);
                setTimeout(function() {
                    goToNextQuestion();
                }, 300);
            };

            function disableAllActions() {
                var btns = document.querySelectorAll('.action-btn');
                btns.forEach(function(b) { b.disabled = true; });
            }

            function saveGame(scoreChange, coinReward) {
                var gameData = {
                    id: gameId,
                    player1: getUserId(),
                    player2: 'bot',
                    round1: JSON.stringify(roundResults[0] || {}),
                    round2: JSON.stringify(roundResults[1] || {}),
                    round3: JSON.stringify(roundResults[2] || {}),
                    round4: JSON.stringify(roundResults[3] || {}),
                    round5: JSON.stringify(roundResults[4] || {}),
                    status: 'finished'
                };
                fetchData('saveGame', { gameData: gameData });
                fetchData('updateUser', { score: userTotalScore + scoreChange, coins: userCoins + coinReward });
            }

            function endGame() {
                clearInterval(timerInterval);
                var resultHtml = '';
                var scoreChange = 0;
                var coinReward = 0;

                if (yourScore > botScore) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">بردی!</div>';
                    scoreChange = 75;
                    coinReward = 300;
                } else if (yourScore < botScore) {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-face-frown" style="color:#ef4444;"></i></div>';
                    resultHtml += '<div class="result-text">باختی!</div>';
                    scoreChange = -25;
                } else {
                    resultHtml = '<div class="result-icon"><i class="fa-solid fa-handshake" style="color:#f59e0b;"></i></div>';
                    resultHtml += '<div class="result-text">مساوی شدی!</div>';
                    scoreChange = 25;
                }

                resultHtml += '<div class="result-score">شما: ' + yourScore + ' - ربات: ' + botScore + '</div>';
                resultHtml += '<div class="result-score">امتیاز: ' + (scoreChange >= 0 ? '+' : '') + scoreChange + '</div>';
                if (coinReward > 0) {
                    resultHtml += '<div class="result-score">سکه: +' + coinReward + '</div>';
                }
                resultHtml += '<button class="result-btn" onclick="backToDashboard()">بازگشت</button>';

                document.getElementById('mainContainer').innerHTML = '<div class="result-banner">' + resultHtml + '</div>';
                document.getElementById('mainBtn').style.display = 'none';

                saveGame(scoreChange, coinReward);
            }

            window.backToDashboard = function() {
                window.location.href = '../../dashboard/';
            };

            async function init() {
                applyTheme();
                if (webApp) {
                    webApp.ready();
                    webApp.expand();
                    webApp.BackButton.show();
                    webApp.BackButton.onClick(function() {
                        window.location.href = '../../dashboard/';
                    });
                }

                var userData = await fetchData('getUser', {});
                if (userData.ok && userData.data) {
                    userCoins = userData.data.coins || 0;
                    userTotalScore = userData.data.score || 0;
                    document.getElementById('coinsHeader').textContent = userCoins;
                }

                var questionsData = await fetchData('getQuestions', { limit: 50 });
                if (questionsData.ok && Array.isArray(questionsData.data) && questionsData.data.length > 0) {
                    questions = questionsData.data;
                    renderMainScreen();
                    document.getElementById('bottomBtnContainer').style.display = 'block';
                } else {
                    document.getElementById('mainContainer').innerHTML = '<div class="result-banner"><div class="result-text">سوالی یافت نشد</div></div>';
                }
            }

            init();
        })();
    </script>
</body>
</html>
